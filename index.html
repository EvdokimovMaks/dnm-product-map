<style>
:root{
  --ink:#202936;
  --muted:#6F7E8E;
  --soft:#9CA9B6;
  --line:#DCE4EA;
  --line-strong:#B8C6D1;
  --paper:#FFFFFF;
  --canvas:#F4F7FC;
  --panel:#EEF3F6;
  --blue:#139FEA;
  --blue-deep:#0E79B2;
  --blue-soft:#EAF7FD;
  --green:#3DDC4A;
  --green-deep:#238B31;
  --green-soft:#EFFBEF;
  --red:#D95B68;
  --red-soft:#FFF0F2;
  --amber:#D59628;
  --amber-soft:#FFF6DE;
  --focus:#0094FF;
  --sidebar:276px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue-deep)}
:focus-visible{outline:3px solid rgba(0,148,255,.28);outline-offset:2px}

/* INFOTECH brand */
.brandbar{height:4px;display:grid;grid-template-columns:1.15fr 1fr .85fr .7fr}
.brandbar span:nth-child(1){background:#139FEA}
.brandbar span:nth-child(2){background:#29B6F3}
.brandbar span:nth-child(3){background:#48DD4B}
.brandbar span:nth-child(4){background:#238B31}
.infotech-mark{display:flex;align-items:center;gap:12px;min-width:0}
.infotech-word{font-size:18px;letter-spacing:.18em;font-weight:700;color:#4F5E6D;white-space:nowrap}
.infotech-bars{display:flex;gap:3px;transform:skewX(-18deg)}
.infotech-bars i{display:block;width:15px;height:6px}
.infotech-bars i:nth-child(1){background:#139FEA}.infotech-bars i:nth-child(2){background:#29B6F3}
.infotech-bars i:nth-child(3){background:#48DD4B}.infotech-bars i:nth-child(4){background:#238B31}

/* Bootstrap-like common UI components, styled to INFOTECH */
.btn{display:inline-block;padding:7px 12px;margin-bottom:0;font-size:13px;font-weight:400;line-height:1.42857143;text-align:center;white-space:nowrap;vertical-align:middle;touch-action:manipulation;border:1px solid transparent;border-radius:3px;background-image:none}
.btn-default{color:#4F5E6D;background:#fff;border-color:#CCD6DE}.btn-default:hover{background:#F5F7F9;border-color:#A8B7C3}
.btn-primary{color:#fff;background:var(--blue-deep);border-color:#086892}.btn-primary:hover{background:#086A9E}
.btn-danger{color:#B13C48;background:#fff;border-color:#E7B1B8}.btn-danger:hover{background:var(--red-soft)}
.btn-xs{padding:2px 7px;font-size:12px;line-height:1.5;border-radius:2px}
.btn-group{display:inline-flex;vertical-align:middle}.btn-group>.btn{border-radius:0}.btn-group>.btn:first-child{border-radius:3px 0 0 3px}.btn-group>.btn:last-child{border-radius:0 3px 3px 0}.btn-group>.btn+.btn{margin-left:-1px}
.label{display:inline;padding:.24em .55em;font-size:10px;font-weight:700;line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:baseline;border-radius:2px}
.label-default{background:#7E8C9B}.label-primary{background:var(--blue-deep)}.label-success{background:var(--green-deep)}.label-info{background:#139FEA}.label-warning{background:#D59628}.label-danger{background:var(--red)}
.badge{display:inline-block;min-width:10px;padding:3px 7px;font-size:11px;font-weight:700;line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:middle;background:#6F7E8E;border-radius:10px}
.nav{padding-left:0;margin-bottom:0;list-style:none}.nav>li{position:relative;display:block}.nav>li>a{position:relative;display:block;text-decoration:none}
.nav-pills>li>a{border-radius:2px}.nav-stacked>li+li{margin-top:2px}
.panel{margin-bottom:16px;background:#fff;border:1px solid transparent;border-radius:2px}
.panel-default{border-color:var(--line)}.panel-heading{padding:10px 12px;border-bottom:1px solid transparent;border-radius:1px 1px 0 0}
.panel-default>.panel-heading{color:var(--ink);background:#F7F9FB;border-color:var(--line)}
.panel-body{padding:12px}.panel-title{margin:0;font-size:14px;font-weight:700}
.list-group{padding-left:0;margin:0}.list-group-item{position:relative;display:block;padding:10px 12px;margin-bottom:-1px;background:#fff;border:1px solid var(--line)}
.list-group-item:first-child{border-top-left-radius:2px;border-top-right-radius:2px}.list-group-item:last-child{margin-bottom:0;border-bottom-left-radius:2px;border-bottom-right-radius:2px}
.input-group{position:relative;display:table;border-collapse:separate}.input-group-addon,.form-control{display:table-cell}
.input-group-addon{width:1%;white-space:nowrap;vertical-align:middle;padding:7px 10px;font-size:13px;color:#5E6D7C;background:#EEF3F6;border:1px solid #C7D2DB;border-right:0;border-radius:3px 0 0 3px}
.form-control{width:100%;height:34px;padding:6px 10px;font-size:13px;line-height:1.42857143;color:#344151;background:#fff;border:1px solid #C7D2DB;border-radius:3px;box-shadow:inset 0 1px 1px rgba(0,0,0,.025)}
.input-group .form-control{border-radius:0 3px 3px 0}
.form-control:focus{border-color:#66AFE9;outline:0;box-shadow:0 0 0 2px rgba(19,159,234,.12)}
.alert{padding:10px 12px;margin-bottom:14px;border:1px solid transparent;border-radius:2px}.alert-info{color:#0C658F;background:#EAF7FD;border-color:#B6E0F3}.alert-danger{color:#9B3440;background:#FFF0F2;border-color:#E9B7BE}
.popover{position:fixed;z-index:1060;display:none;width:430px;max-width:calc(100vw - 28px);padding:1px;text-align:left;white-space:normal;background:#fff;border:1px solid #AEBCC7;border-radius:3px;box-shadow:0 7px 18px rgba(32,41,54,.16)}
.popover-title{padding:9px 12px;margin:0;font-size:13px;font-weight:700;background:#F7F9FB;border-bottom:1px solid var(--line)}
.popover-content{padding:11px 12px;font-size:12px;line-height:1.5;color:#4F5E6D}
.modal-backdrop{position:fixed;inset:0;background:rgba(32,41,54,.45);z-index:1040;display:none}
.modal-backdrop.in{display:block}
.modal{position:fixed;z-index:1050;inset:0;display:none;overflow:auto;padding:38px 16px}
.modal.in{display:block}.modal-dialog{width:min(650px,100%);margin:0 auto}
.modal-content{position:relative;background:#fff;border:1px solid rgba(0,0,0,.18);border-radius:3px;box-shadow:0 8px 28px rgba(32,41,54,.22)}
.modal-header,.modal-footer{padding:13px 15px;border-bottom:1px solid var(--line)}.modal-footer{border-top:1px solid var(--line);border-bottom:0;text-align:right}
.modal-title{margin:0;font-size:17px}.modal-body{padding:15px}
.form-group{margin-bottom:13px}.form-group label{display:block;max-width:100%;margin-bottom:5px;font-weight:700;font-size:12px;color:#536273}
textarea.form-control{height:auto;min-height:90px;resize:vertical}

/* App shell */
.topbar{height:67px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:40}
.topbar-inner{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 18px;gap:18px}
.product-title{min-width:0;display:flex;align-items:baseline;gap:12px}
.product-title h1{font-size:18px;margin:0;font-weight:700;color:var(--ink);white-space:nowrap}
.product-title small{font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.save-state{font-size:11px;color:var(--muted)}

.module-tabsbar{
  position:sticky;top:67px;z-index:35;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 2px 5px rgba(32,41,54,.035)
}
.module-tabs-inner{display:flex;align-items:center;gap:14px;padding:9px 18px;min-width:0}
.module-tabs-heading{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:12px;color:#536273;font-weight:700}
.module-nav-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex:1;padding-bottom:1px}
.modules-horizontal{display:flex;gap:4px;min-width:max-content}
.modules-horizontal>li{display:block}
.modules-horizontal>li>a{
  padding:7px 11px;color:#4F5E6D;border:1px solid transparent;background:#fff;
  font-size:12px;line-height:1.2;border-radius:3px
}
.modules-horizontal>li>a:hover{background:#F4F7FC;border-color:#DCE4EA;color:var(--ink)}
.modules-horizontal>li.active>a{
  background:#EAF7FD;color:#0E79B2;border-color:#A9DDF4;font-weight:700
}
.modules-horizontal .badge{margin-left:5px;background:#C8D5DE;color:#445360}
.modules-horizontal li.active .badge{background:#139FEA;color:#fff}

.shell{min-height:calc(100vh - 112px)}
.main{min-width:0;padding:18px 24px 52px;max-width:1760px;margin:0 auto}
.module-header{display:flex;gap:16px;align-items:center;justify-content:flex-end;margin-bottom:12px}
.module-header-title{display:none}
.module-meta{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;width:100%}
.searchbox{width:min(440px,46vw)}
.summary-strip{display:flex;gap:18px;align-items:center;padding:9px 0 13px;border-bottom:1px solid var(--line);margin-bottom:16px;color:#5B6674;font-size:12px;flex-wrap:wrap}
.summary-strip strong{color:var(--ink);font-size:14px}.summary-strip .sep{width:1px;height:22px;background:var(--line)}
.legend{display:flex;gap:12px;margin-left:auto;align-items:center;font-size:11px;color:#758493}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}.legend .planned{background:#139FEA}.legend .done{background:#9CA9B6}
.progress{height:7px;margin:0;overflow:hidden;background:#E4EAF0;border-radius:2px;width:140px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.progress-bar{float:left;width:0;height:100%;font-size:9px;line-height:7px;color:#fff;text-align:center;background:#139FEA;transition:width .25s ease}
.progress-bar-success{background:#3DDC4A}

/* Network map */
.network-board{
  position:relative;padding:8px 0 34px;min-height:420px;overflow:visible
}
.network-svg{
  position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible
}
.network-root-wrap{position:relative;z-index:2;display:flex;justify-content:center;margin:6px 0 58px}
.network-root{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:15px 28px;background:#fff;border:1px solid #8FB4C9;border-top:4px solid #139FEA;
  min-width:340px;max-width:720px;box-shadow:0 3px 9px rgba(32,41,54,.06)
}
.network-root .root-title{font-size:18px;font-weight:700;line-height:1.2}
.network-root .root-kicker{font-size:10.5px;color:var(--muted);margin-top:4px}
.feature-grid{
  position:relative;z-index:2;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:28px 24px;align-items:start
}
.feature-row{
  position:relative;display:flex;flex-direction:column;min-width:0;gap:8px
}
.feature-panel{margin:0;transition:border-color .12s;background:#fff;position:relative}
.feature-panel:before{
  content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #139FEA;z-index:3
}
.feature-panel:hover{border-color:#88BFD9}
.feature-panel .panel-heading{background:#fff;padding:11px 12px;border-bottom:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.feature-panel .panel-title{font-size:14px;line-height:1.3}
.feature-panel .panel-body{padding:3px 12px 11px}
.feature-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.feature-actions{display:none;gap:4px;white-space:nowrap;align-items:center}.edit-mode .feature-actions{display:flex}
.drag-grip{display:none;color:#8393A1;font-size:16px;line-height:1;cursor:grab;user-select:none;padding:0 3px}
.edit-mode .drag-grip{display:inline-block}
.edit-mode .feature-panel[draggable="true"]{cursor:grab}
.edit-mode .feature-panel[draggable="true"]:active,.edit-mode .drag-grip:active{cursor:grabbing}
.feature-row.dragging{opacity:.38}
.feature-row.drag-over .feature-panel{outline:2px solid #139FEA;outline-offset:4px}
.feature-row.drag-before .feature-panel:after,
.feature-row.drag-after .task-column:after{
  content:"";position:absolute;left:0;right:0;height:3px;background:#139FEA;z-index:5
}
.feature-row.drag-before .feature-panel:after{top:-15px}
.feature-row.drag-after .task-column{position:relative}
.feature-row.drag-after .task-column:after{bottom:-14px}
.task-column{min-width:0}
.task-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;min-height:24px}
.task-toolbar .count{font-size:11px;color:#7A8997}
.task-list.collapsed{display:none}
.task-item{padding:9px 90px 9px 11px;min-height:38px;line-height:1.35;font-size:12px;color:#364453}
.task-item.closed{background:#F5F7F9;color:#778391}
.task-item .task-id{font-weight:700;color:#0E79B2;margin-right:5px}
.task-item.closed .task-id{color:#7B8997}
.task-item .status{margin-right:6px}
.task-actions{position:absolute;right:7px;top:6px;display:none;gap:3px}.edit-mode .task-actions{display:flex}
.empty-tasks{padding:12px;color:#82909D;font-size:12px;border:1px dashed #C9D5DE;background:#FAFBFC}
.add-task{display:none;width:100%;margin-top:7px;border-style:dashed}.edit-mode .add-task{display:block}
.add-feature-wrap{position:relative;z-index:3;text-align:center;margin-top:24px}
.add-feature{display:none}.edit-mode .add-feature{display:inline-block}.edit-mode .add-feature{display:inline-block}
.edit-module{display:none}.edit-mode .edit-module{display:inline-block}
.drag-help{display:none;margin:0 auto 14px;max-width:620px;text-align:center;color:#536273;background:#fff;border:1px solid #DCE4EA;padding:8px 12px;border-radius:3px}.edit-mode .drag-help{display:block}
.no-results{padding:38px 15px;color:#6F7E8E;text-align:center;border:1px dashed #C9D5DE;background:#fff}

.popover .money-block{padding:8px 9px;background:#F4F7FC;border-left:3px solid #139FEA;margin-top:9px}
.popover .money-block.high{background:#EFFBEF;border-color:#3DDC4A}.popover .money-block.low{background:#F3F5F7;border-color:#9CA9B6}
.popover .field-name{font-size:10px;font-weight:700;color:#7B8997;margin-bottom:4px}
.popover .value{color:#354252}
.popover .money-value{font-weight:700}

/* Small screens */
@media(max-width:1100px){
  .product-title small{display:none}
  .feature-grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .network-root{min-width:300px}
}

<script id="productDescriptions" type="application/json">{"Анализ трафика":{"users":"Региональный менеджер и маркетинг дистрибьютора, менеджер и оператор контакт-центра дилера.","beneficiaries":"Дистрибьютор, руководство дилера.","area":"Обработка и контроль лидов в LMS, анализ качества входящего трафика и фактической работы дилера с обращениями клиентов.","functional":"DNM фиксирует звонки по лидам. ИИ переводит записи разговоров в текст, формирует краткую выжимку и проводит комплексный анализ качества работы дилера и качества самого лида.","benefits":"Дистрибьютор получает подтверждение фактической обработки лида, видит качество трафика и источники накрутки, выявляет фальсификации результатов, контролирует стандарты, обогащает данные по клиенту и выявляет недовольство. Дилер получает инструмент для выявления сотрудников, которые некорректно обрабатывают лиды. Без модуля растут потери времени на спам-лиды, снижается конверсия и сложнее выявлять системное недовольство клиентов.","competitors":"Calltouch: транскрибация и оценка звонков по чек-листу.","usp":"DNM анализирует не только звонок и чек-лист, но и данные рабочего листа, выполняет скоринг лида на спам и формирует анкету звонка. Можно сопоставить результат, указанный дилером, с результатом, определённым по разговору. В продуктовом плане отдельно отмечен маскинг номеров вместо сценария обратного звонка."},"Автопроверка":{"users":"Сотрудники дистрибьютора, проверяющие заявки и документы; дилерские пользователи, загружающие документы; юридические и маркетинговые подразделения; сотрудники, работающие с СОПД.","beneficiaries":"Дистрибьютор, дилеры, юридическая служба, сотрудники сети, клиенты в части корректного документооборота и СОПД.","area":"Автоматическая проверка документов и данных в процессах компенсаций, маркетинговых размещений и мероприятий, гарантийных ремонтов, а также сбор, проверка и хранение СОПД и согласий на коммуникацию по дилерской сети.","functional":"Для заявок на компенсацию система автоматически запускает проверку на заданном этапе: распознаёт документы через OCR, сохраняет данные в JSON, сверяет данные системы с документами, при необходимости извлекает дополнительные поля и использует ИИ для проверки каждого пункта чек-листа. Ошибочная заявка возвращается дилеру либо уходит на ручную перепроверку. Дистрибьютор видит статусы, причины отклонений и аналитику.\n\nДля СОПД дистрибьютор задаёт единую форму, дилер формирует и подписывает анкету, загружает скан, QR связывает скан с электронной анкетой, а ИИ проверяет данные, отметки согласий и подпись. Результат сохраняется в карточке клиента.","benefits":"Для дистрибьютора: контроль документов на 100% заявок, снижение ручной нагрузки и ФОТ, уменьшение человеческого фактора и фрода, единый стандарт документооборота, снижение юридических рисков и прозрачность причин отклонений. Для дилера: более быстрое согласование, понятные требования и ошибки, меньше возвратов и задержек выплат. В СОПД дополнительно: единое хранилище, переиспользование согласий между ДЦ и снижение ручного ввода.","competitors":"Авто.ру, Автохаб; для маркетинговой проверки — также маркетинговые агентства, выполняющие контроль вручную. Для части сервисных и СОПД-сценариев в продуктовом плане прямой полноценный аналог не указан.","usp":"Цена 3 000–5 000 руб. в зависимости от объёма; по отзывам клиентов — более высокое качество проверки; прозрачный результат по каждому критерию вместо общего комментария; встроенность в бизнес-процесс DNM и связанные модули; возможность автоматически возвращать заявку; гибкая настройка отдельного алгоритма под каждый критерий."},"AI-ассистент мастера приёмщика":{"users":"Сервисный консультант, мастер-приёмщик.","beneficiaries":"Дилер, дистрибьютор, сервисное подразделение, клиент за счёт более персонализированного обслуживания.","area":"Послепродажное обслуживание и удержание клиентов: подготовка к встрече или звонку, планирование ТО, работа с невыполненными рекомендациями, информирование о сервисных кампаниях и персонализированные допродажи.","functional":"Модуль собирает по VIN историю заказ-нарядов, пробеги, гарантийные обращения, рекомендации, кампании и другие данные. Затем оценивает профиль и лояльность клиента, прогнозирует следующий визит, выделяет критичные невыполненные рекомендации, проверяет сервисные кампании и формирует персонализированные предложения. На выходе создаётся структурированный брифинг с готовыми подсказками для разговора.","benefits":"Дилер экономит время мастера, повышает средний чек за счёт рекомендаций и дополнительных услуг, персонализирует визит и снижает зависимость от опыта конкретного сотрудника. Дистрибьютор получает единый стандарт приёма по сети, более своевременную работу с сервисными кампаниями и более единый клиентский опыт.","competitors":"В продуктовом плане прямые аналоги не выявлены.","usp":"Отдельный блок УТП в продуктовом плане не заполнен. В описании продукта акцент сделан на автоматическом анализе полной истории автомобиля и клиента и формировании готового персонального брифинга для мастера."},"Модуль обучения":{"users":"Отдел обучения / HR / бизнес-академия импортёра, руководители направлений, ответственные за обучение в ДЦ, руководители отделов, сотрудники дилерской сети.","beneficiaries":"Дистрибьютор, дилеры, сотрудники сети, руководители направлений и HR.","area":"Обучение, аттестация и развитие сотрудников дилерской сети в онлайн- и офлайн-форматах, включая KPI и сертификацию.","functional":"Импортёр создаёт курсы, тесты и материалы, формирует сертификационные пути и планы обучения по должностям. Онлайн-курсы могут назначаться автоматически по роли и должности. Очные мероприятия используют отдельный процесс регистрации. Сотрудник проходит материалы и тесты, система фиксирует результаты, рассчитывает KPI и формирует отчётность, а импортёр видит аналитику по дилерам, сотрудникам и курсам.","benefits":"Для дистрибьютора: повышение качества работы сети, снижение потерь от ошибок сотрудников, уменьшение затрат на обучение и ручное администрирование, единая статистика и прозрачность KPI, быстрый запуск обучения на всю сеть и аудит актуальности пользователей. Для дилера: снижение затрат на обучение и адаптацию, удобная запись на тренинги и быстрый доступ к материалам. Для сотрудника: понятный путь развития и прозрачные требования.","competitors":"Mirapolis, iSpring.","usp":"Персонал уже ведётся в DNM — не нужна отдельная синхронизация пользователей; гибкая схема оплаты; нет лимита пользователей; поддержка дилера и импортёра; более короткие сроки доработок; аудит пользователей по корпоративной почте; автоматический сбор статистики по вебинарам; результаты обучения находятся в одной системе с рабочими показателями персонала."},"База знаний + ИИ":{"users":"Механики, мастера-консультанты, диагносты, РОПы, продавцы, HR, бренд- и региональные менеджеры.","beneficiaries":"Дистрибьютор, дилеры, сотрудники сервиса и продаж, HR и обучение.","area":"Техническая поддержка дилеров, гарантийное и постгарантийное обслуживание, обучение сотрудников и контроль корпоративных политик и регламентов.","functional":"Дистрибьютор загружает документы в DNM, назначает теги и права доступа. Сервис распознаёт и индексирует содержимое в RAG-движке, а устаревшие версии деиндексируются. Пользователь задаёт вопрос естественным языком; система определяет контекст, применяет фильтры по модели, разделу и ACL и формирует ответ на основе разрешённых документов с обязательными ссылками на конкретные страницы источников.","benefits":"Дистрибьютор обеспечивает работу по актуальным регламентам, разграничивает доступ к чувствительной информации и сокращает трудозатраты на onboarding. Дилер быстрее находит нужные инструкции, снижает риск ошибок из-за устаревших документов и работает в привычном интерфейсе DNM без отдельного софта.","competitors":"Облачные ИИ с загрузкой документов; YandexGPT + Vector Search.","usp":"RAG-поиск встроен в экосистему дистрибьютора и дилера, понимает бизнес-контекст, бренды и модели, учитывает сложные теги и права пользователей. Ответ ограничен корпоративной базой и подкрепляется точной ссылкой на первоисточник."},"Модуль рассылок для дилеров":{"users":"Маркетинг, бренд- и CRM-менеджеры дистрибьютора и дилера.","beneficiaries":"Дистрибьютор, дилеры, маркетинговые подразделения, клиенты за счёт более корректных и согласованных коммуникаций.","area":"Дилерский маркетинг и контроль маркетинговых стандартов дистрибьютором. Дилер запускает массовые рассылки по своей клиентской базе после модерации брендом.","functional":"DNM/CRM дедублицирует клиентские данные и формирует «золотую карточку клиента» с актуальным согласием на коммуникацию. Дилер создаёт письмо в визуальном конструкторе на базе утверждённых материалов, отправляет его на согласование по workflow, а после одобрения запускает рассылку по согласованному сегменту.","benefits":"Дистрибьютор контролирует соответствие писем стандартам бренда и видит активность дилеров по сети. Дилер получает более чистую базу без дублей, профессиональные шаблоны и работу только с подтверждёнными согласиями. Это снижает репутационные и юридические риски и повышает качество коммуникаций.","competitors":"Маркетинговые агентства; Unisender; Mindbox.","usp":"Не только отправка писем, а замкнутый процесс: дедубликация клиента в DNM, работа с согласиями, конструктор, брендовые материалы и workflow согласования с дистрибьютором."},"Мобильное приложение DNM/CRM":{"users":"Менеджеры по продажам, мастера-приёмщики, сервисные консультанты, склад, руководители, региональные менеджеры, аудиторы.","beneficiaries":"Дистрибьютор, дилеры, сотрудники фронт-офиса и сервиса, аудиторы и руководители.","area":"Продажи, сервис, складской учёт и контроль качества: лиды и рабочие листы, приёмка и заказ-наряды, история по VIN, чек-листы и PDI.","functional":"Мобильное PWA-приложение является продолжением DNM/CRM и показывает доступные пользователю модули по его правам. Интегрированная телефония работает через Voximplant, а при звонке система автоматически открывает связанный бизнес-контекст: лид, рабочий лист, заказ-наряд или историю по VIN. В полях можно заполнять чек-листы, фиксировать фото и PDI с мгновенной синхронизацией с основной системой.","benefits":"Дистрибьютор получает мобильный доступ к сквозной истории и контролю стандартов по сети. Дилер сокращает перемещения к стационарному ПК, вводит данные непосредственно у автомобиля или клиента, получает контекст при звонке и работает в одном мобильном окне вместо разрозненных инструментов.","competitors":"Мобильные софтфоны — без бизнес-контекста DNM. В продуктовом плане полноценный мобильный аналог CRM для автодистрибьютора и дилера, интегрированный во все процессы, не указан; теоретическая альтернатива — дорогое кастомное приложение ДЦ через API.","usp":"Мобильное приложение является прямым продолжением CRM/DNM, а не отдельным инструментом. Оно объединяет продажи, сервис, склад и аудит, а телефония автоматически определяет контекст клиента и открывает нужную сущность системы."},"Умный центр диалогов":{"users":"В продуктовом плане не заполнено.","beneficiaries":"В продуктовом плане не заполнено.","area":"В продуктовом плане не заполнено.","functional":"В продуктовом плане не заполнено.","benefits":"В продуктовом плане не заполнено.","competitors":"В продуктовом плане не заполнено.","usp":"В продуктовом плане не заполнено."},"Контакт-центр (CRM)":{"users":"Операторы контакт-центра, менеджеры, ресепшн; маркетинг и руководители используют аналитику.","beneficiaries":"Дилер, дистрибьютор, контакт-центр, маркетинг, руководители подразделений.","area":"Обработка входящего трафика и коммуникаций с клиентами в едином контуре: звонки, чаты и заявки.","functional":"Лиды создаются автоматически из входящих каналов, фиксируется источник. Для чатов предусмотрена автоматизация: автоответы, автоматическое закрытие при отсутствии ответа и дальнейшее развитие AI-коммуникаций. Ответственные обрабатывают лиды и переписку, а DNM формирует статистику по источникам, подразделениям, отказам и обработке обращений.","benefits":"Дилер снижает потери обращений, повышает эффективность обработки и получает более прозрачную картину входящего трафика. Продуктовый план отдельно фиксирует проблему разрыва между маркетинговой аналитикой и реальными рабочими листами, а также стоимость потерянных целевых обращений.","competitors":"Бачата, Talk-me, Callibri, Chat2desk, Wazzup; электронная почта для заявок; Calltouch в части статического коллтрекинга.","usp":"Связка обращений с рабочими листами и клиентами DNM; единое окно для чатов, звонков и заявок; статический коллтрекинг на номерах телефонии клиента; более полные данные для аналитики; развитие автоматической обработки и маршрутизации трафика."},"Предодобрение кредита Сбербанк в DNM":{"users":"Маркетинг дистрибьютора, менеджер дилера.","beneficiaries":"Дистрибьютор, дилеры, клиенты в части ускорения кредитного процесса.","area":"Обработка лидов в LMS и триггерные коммуникации с клиентом в кредитном сценарии.","functional":"При создании лида DNM передаёт в Сбербанк номер телефона клиента, бренд и модель автомобиля. Банк возвращает предодобренный кредитный лимит, который отображается менеджеру в лиде; клиент при необходимости завершает оформление в приложении банка. Второй сценарий — триггерная коммуникация после сервисного визита при выполнении заданных условий.","benefits":"В продуктовом плане этот раздел заполнен текстом, относящимся к контролю обработки лидов и анализу трафика: подтверждение фактической обработки лида, выявление фрода и качества источников, контроль стандартов. Для кредитного продукта блок требует отдельной актуализации.","competitors":"В продуктовом плане указан Calltouch, однако этот блок по смыслу относится к «Анализу трафика» и требует актуализации для кредитного сценария.","usp":"В продуктовом плане приведены преимущества анализа трафика: совместный анализ звонка и рабочего листа, спам-скоринг, сравнение результата дилера с разговором и маскинг номеров. Для предодобрения кредита отдельное УТП в источнике не сформулировано."},"Модуль In-App продаж":{"users":"В продуктовом плане не заполнено.","beneficiaries":"В продуктовом плане не заполнено.","area":"Внутренний маркетплейс / витрина приложений и дополнительных сервисов внутри DNM/CRM.","functional":"Зафиксированы гипотезы: витрина приложений и дополнительных сервисов внутри DNM/CRM, полная автоматизация процесса запроса/продажи, подтверждение заказа ЛПР заказчика, автоматический onboarding, отчёт по просмотрам, лидам и конверсии.","benefits":"В продуктовом плане отдельный блок выгод пока не заполнен.","competitors":"В продуктовом плане не заполнено.","usp":"В продуктовом плане не заполнено."},"Анализ оттока клиентов из сервиса":{"users":"Сотрудники сервисного подразделения дилера, сотрудники, работающие с удержанием клиентов.","beneficiaries":"Исходный дилерский центр, дистрибьютор, сервисные подразделения.","area":"Контроль и анализ клиентов, которые приезжают на обслуживание не в свой дилерский центр.","functional":"DNM получает заказ-наряд по заезду клиента в другой ДЦ, по триггеру отправляет опрос с выяснением причин, после чего исходный ДЦ получает обезличенную информацию по результатам опроса.","benefits":"Даёт исходному дилерскому центру фактические причины ухода клиента на обслуживание в другой ДЦ и данные для работы с удержанием.","competitors":"В продуктовом плане не заполнено.","usp":"В продуктовом плане не заполнено."},"Умный тест-драйв":{"users":"В продуктовом плане не заполнено.","beneficiaries":"В продуктовом плане не заполнено.","area":"В продуктовом плане не заполнено.","functional":"В продуктовом плане не заполнено.","benefits":"В продуктовом плане не заполнено.","competitors":"В продуктовом плане не заполнено.","usp":"В продуктовом плане не заполнено."}}</script>

60":{"actualStartDate":"2026-02-17","actualCloseDate":""},"43747":{"actualStartDate":"2026-01-14","actualCloseDate":""},"45034":{"actualStartDate":"2026-02-09","actualCloseDate":""},"45032":{"actualStartDate":"2026-02-09","actualCloseDate":""},"44504":{"actualStartDate":"2026-01-29","actualCloseDate":"2026-02-13"},"44583":{"actualStartDate":"2026-01-30","actualCloseDate":""},"45178":{"actualStartDate":"2026-02-11","actualCloseDate":""},"44703":{"actualStartDate":"2026-02-02","actualCloseDate":""},"45127":{"actualStartDate":"2026-02-10","actualCloseDate":""},"44987":{"actualStartDate":"2026-02-06","actualCloseDate":"2026-02-11"},"44908":{"actualStartDate":"2026-02-05","actualCloseDate":""},"44804":{"actualStartDate":"2026-02-04","actualCloseDate":""},"45012":{"actualStartDate":"2026-02-09","actualCloseDate":""},"44423":{"actualStartDate":"2026-01-28","actualCloseDate":""},"44669":{"actualStartDate":"2026-02-02","actualCloseDate":""},"44055":{"actualStartDate":"2026-01-21","actualCloseDate":""},"44247":{"actualStartDate":"2026-01-23","actualCloseDate":""},"44608":{"actualStartDate":"2026-01-30","actualCloseDate":""},"43946":{"actualStartDate":"2026-01-19","actualCloseDate":""},"44054":{"actualStartDate":"2026-01-21","actualCloseDate":""},"43808":{"actualStartDate":"2026-01-15","actualCloseDate":""},"44235":{"actualStartDate":"2026-01-23","actualCloseDate":"2026-01-29"},"43827":{"actualStartDate":"2026-01-15","actualCloseDate":""},"44252":{"actualStartDate":"2026-01-23","actualCloseDate":""},"43690":{"actualStartDate":"2026-01-13","actualCloseDate":""},"44189":{"actualStartDate":"2026-01-22","actualCloseDate":""},"44203":{"actualStartDate":"2026-01-23","actualCloseDate":""},"43753":{"actualStartDate":"2026-01-14","actualCloseDate":""},"43985":{"actualStartDate":"2026-01-20","actualCloseDate":""},"44106":{"actualStartDate":"2026-01-21","actualCloseDate":""},"43928":{"actualStartDate":"2026-01-19","actualCloseDate":""},"43916":{"actualStartDate":"2026-01-19","actualCloseDate":""},"43636":{"actualStartDate":"2026-01-12","actualCloseDate":""},"43603":{"actualStartDate":"2026-01-12","actualCloseDate":""},"43644":{"actualStartDate":"2026-01-12","actualCloseDate":""},"43769":{"actualStartDate":"2026-01-15","actualCloseDate":""},"43685":{"actualStartDate":"2026-01-13","actualCloseDate":""},"43600":{"actualStartDate":"2026-01-12","actualCloseDate":""},"43691":{"actualStartDate":"2026-01-13","actualCloseDate":""}}</script>
<script>
(function(){
  const STORAGE_KEY="infotech-dnm-product-map-v16";
  const REMOTE_API="/api/product-map";
  const AUTH_API="/api/auth";
  let remoteSaveTimer=null;
  let remoteSaving=false;
  let remoteLoadDone=false;

  const initial=JSON.parse(document.getElementById("initialData").textContent);
  const productDescriptions=JSON.parse(document.getElementById("productDescriptions").textContent);
  const issueMeta=JSON.parse(document.getElementById("issueMeta").textContent);

  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const clone=v=>JSON.parse(JSON.stringify(v));
  const closed=t=>String(t.status||"").toLowerCase()==="закрыто";

  const quarterNames=["Q1","Q2","Q3","Q4"];
  const formatDisplayDate=value=>{
    if(!value)return "—";
    const s=String(value).trim();
    if(!s)return "—";
    const match=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(match)return `${match[3]}.${match[2]}.${match[1]}`;
    const d=new Date(s);
    if(Number.isNaN(d.getTime()))return s;
    return d.toLocaleDateString("ru-RU");
  };
  const dateInputValue=value=>{
    if(!value)return "";
    const s=String(value).trim();
    const match=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(match)return `${match[1]}-${match[2]}-${match[3]}`;
    const d=new Date(s);
    if(Number.isNaN(d.getTime()))return "";
    return d.toISOString().slice(0,10);
  };
  const dateTextValue=value=>{
    const iso=dateInputValue(value);
    if(!iso)return "";
    const [year,month,day]=iso.split("-");
    return `${day}.${month}.${year}`;
  };

  const normalizeTaskDateText=value=>{
    const raw=String(value??"").trim();
    if(!raw)return "";

    let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m){
      const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);
      const dt=new Date(Date.UTC(y,mo-1,d));
      if(dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d){
        return `${String(y).padStart(4,"0")}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      }
      return null;
    }

    m=raw.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    if(m){
      const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]);
      const dt=new Date(Date.UTC(y,mo-1,d));
      if(dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d){
        return `${String(y).padStart(4,"0")}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      }
      return null;
    }

    return null;
  };

  function normalizeTaskDateField(id){
    const input=$(id);
    if(!input)return "";
    const normalized=normalizeTaskDateText(input.value);
    if(normalized===null){
      input.classList.add("date-input-invalid");
      input.focus();
      return null;
    }
    input.classList.remove("date-input-invalid");
    input.value=normalized?dateTextValue(normalized):"";
    return normalized||"";
  }

  const quarterIndexFromDate=value=>{
    const s=dateInputValue(value);
    if(!s)return null;
    const [year,month]=s.split("-").map(Number);
    return year*4 + Math.floor((month-1)/3);
  };
  const quarterMetaFromIndex=index=>{
    const year=Math.floor(index/4);
    const q=index%4;
    return {index,year,q,label:`${quarterNames[q]} ${year}`};
  };
  const currentQuarterIndex=()=>{
    const d=new Date();
    return d.getFullYear()*4 + Math.floor(d.getMonth()/3);
  };
  const priorityRank=value=>({"Высокий":3,"Средний":2,"Низкий":1}[value]||0);
  const statusBucket=value=>{
    const s=String(value||"").trim().toLowerCase();
    if(s==="закрыто")return "closed";
    if(["в планах","планируется (нет задачи)","планируется","планирование","backlog"].includes(s))return "planned";
    return "inwork";
  };
  const taskProgressPercent=feature=>{
    const total=(feature.tasks||[]).length;
    if(!total)return 0;
    const done=(feature.tasks||[]).filter(t=>closed(t)).length;
    return Math.round(done/total*100);
  };
  const roadmapTaskKey=(task,featureName)=>{
    const num=String(task.number||"").trim();
    if(num)return `n:${num}`;
    const title=String(task.title||"").trim().toLowerCase();
    return `t:${title}:${featureName}`;
  };
  const quarterFillLabel=(bucket,task,quarter)=>{
    if(bucket==="closed" && task.actualCloseDate && quarterIndexFromDate(task.actualCloseDate)===quarter.index)return "Факт";
    if(bucket==="inwork" && task.actualStartDate && quarterIndexFromDate(task.actualStartDate)===quarter.index)return "Старт";
    if(bucket==="planned" && task.plannedCloseDate && quarterIndexFromDate(task.plannedCloseDate)===quarter.index)return "План";
    return "";
  };

  let appStarted=false;

  function showAuth(message=""){
    document.body.classList.add("auth-pending");
    $("authGate")?.classList.remove("is-hidden");
    if($("authError")) $("authError").textContent=message;
    setTimeout(()=>$("authPassword")?.focus(),0);
  }

  function unlockAuth(){
    document.body.classList.remove("auth-pending");
    $("authGate")?.classList.add("is-hidden");
    if($("authError")) $("authError").textContent="";
  }

  async function authStatus(){
    const response=await fetch(AUTH_API,{
      method:"GET",
      cache:"no-store",
      credentials:"same-origin"
    });
    let payload={};
    try{payload=await response.json()}catch(e){}
    if(response.status===503){
      throw new Error(payload.error||"Пароль доступа не настроен на сервере");
    }
    return response.ok && payload.authenticated===true;
  }

  async function loginWithPassword(password){
    const response=await fetch(AUTH_API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      cache:"no-store",
      credentials:"same-origin",
      body:JSON.stringify({password})
    });
    let payload={};
    try{payload=await response.json()}catch(e){}
    if(!response.ok){
      throw new Error(payload.error||"Неверный пароль");
    }
    return payload.authenticated===true;
  }

  async function logout(){
    try{
      await fetch(AUTH_API,{
        method:"DELETE",
        cache:"no-store",
        credentials:"same-origin"
      });
    }catch(e){}
    location.reload();
  }

  function startApp(){
    if(appStarted)return;
    appStarted=true;
    unlockAuth();
    bindScrollSync();
    render();
    loadRemoteState();
  }

  async function initAuth(){
    showAuth("");
    try{
      if(await authStatus()){
        startApp();
      }else{
        showAuth("");
      }
    }catch(err){
      console.error(err);
      showAuth(err.message||"Не удалось проверить доступ");
    }
  }

  function prioritizeModules(data){
    const priority=["Модуль обучения","Автопроверка"];
    const rank=name=>{
      const i=priority.indexOf(name);
      return i===-1 ? priority.length : i;
    };
    return data
      .map((item,index)=>({item,index}))
      .sort((a,b)=>{
        const ra=rank(a.item.name), rb=rank(b.item.name);
        return ra===rb ? a.index-b.index : ra-rb;
      })
      .map(x=>x.item);
  }

  function migrateState(data){
    const removedProductName="Лид-расчет-рекомендации в ОП по клиенту записанному на сервис";
    const newProductName="Умный тест-драйв";
    const removedProductIndex=data.findIndex(m=>m?.name===removedProductName);
    for(let i=data.length-1;i>=0;i--){
      if(data[i]?.name===removedProductName||data[i]?.name===newProductName)data.splice(i,1);
    }
    data.splice(removedProductIndex>=0?Math.min(removedProductIndex,data.length):data.length,0,{name:newProductName,features:[]});
    data.forEach(m=>{
      (m.features||[]).forEach(f=>{
        if(m.name==="Модуль обучения" && f.name==="360 по сотруднику"){
          f.name="Отчетность: реализация 360 по сотруднику";
        }
        if(m.name==="Модуль обучения" && f.name==="Логика назначения курсов"){
          f.name="Оптимизация логики назначения курсов";
        }
        (f.tasks||[]).forEach(t=>{
          if(["Планируется","Планируется (нет задачи)"].includes(String(t.status||"").trim())) t.status="В планах";
          const number=String(t.number||"").trim();
          const meta=number && issueMeta[number] ? issueMeta[number] : null;

          const hadPlannedStart=Object.prototype.hasOwnProperty.call(t,"plannedStartDate");
          const hadPlannedClose=Object.prototype.hasOwnProperty.call(t,"plannedCloseDate");
          const hadActualStart=Object.prototype.hasOwnProperty.call(t,"actualStartDate");
          const hadActualClose=Object.prototype.hasOwnProperty.call(t,"actualCloseDate");

          if(!hadPlannedStart) t.plannedStartDate="";
          else if(typeof t.plannedStartDate!=="string") t.plannedStartDate=t.plannedStartDate?String(t.plannedStartDate):"";

          if(!hadPlannedClose) t.plannedCloseDate="";
          else if(typeof t.plannedCloseDate!=="string") t.plannedCloseDate=t.plannedCloseDate?String(t.plannedCloseDate):"";

          if(!hadActualStart) t.actualStartDate="";
          else if(typeof t.actualStartDate!=="string") t.actualStartDate=t.actualStartDate?String(t.actualStartDate):"";

          if(!hadActualClose) t.actualCloseDate="";
          else if(typeof t.actualCloseDate!=="string") t.actualCloseDate=t.actualCloseDate?String(t.actualCloseDate):"";

          // Одноразовая миграция существующих задач: значение ставится только если поля
          // plannedStartDate раньше вообще не было. Если пользователь потом очистит дату,
          // она не появится снова после перезагрузки.
          if(!hadPlannedStart && ["в планах","планируется (нет задачи)","планируется","планирование","backlog"].includes(String(t.status||"").trim().toLowerCase())){
            t.plannedStartDate="2026-09-22";
          }

          // Метаданные из выгрузок заполняют только действительно старые записи без полей.
          if(meta){
            if(!hadActualStart && !t.actualStartDate) t.actualStartDate=meta.actualStartDate||"";
            if(!hadActualClose && !t.actualCloseDate) t.actualCloseDate=meta.actualCloseDate||"";
          }
        });
      });
    });
    return data;
  }

  const marketingFields=[
    {key:"presentation",label:"Преза",type:"checkbox"},
    {key:"landing",label:"Лендинг",type:"checkbox"},
    {key:"popup",label:"Pop up в интерфейсе",type:"checkbox"},
    {key:"tgPublications",label:"ТГ публикации",type:"count"},
    {key:"conferences",label:"Конференции",type:"count"},
    {key:"digestMentions",label:"Упоминания в дайджестах",type:"count"},
    {key:"siteArticles",label:"Статьи на сайте",type:"count"},
    {key:"pulseSurveys",label:"Опросы пользователей",type:"count"},
    {key:"dnmFeedback",label:"ОС в DNM",type:"checkbox"},
    {key:"custDev",label:"Cust Dev",type:"checkbox"}
  ];

  function defaultMarketing(){
    return {
      presentation:false,
      landing:false,
      popup:false,
      tgPublications:0,
      conferences:0,
      digestMentions:0,
      siteArticles:0,
      pulseSurveys:0,
      dnmFeedback:false,
      custDev:false
    };
  }

  function normalizeMarketing(value){
    const source=value&&typeof value==="object"?value:{};
    const result=defaultMarketing();
    marketingFields.forEach(field=>{
      if(field.type==="checkbox"){
        const raw=source[field.key];
        const normalized=String(raw??"").trim().toLowerCase();
        result[field.key]=raw===true||Number(raw)>0||["true","да","yes","on"].includes(normalized);
      }else{
        const n=Number(source[field.key]);
        result[field.key]=Number.isFinite(n)&&n>0?Math.floor(n):0;
      }
    });
    return result;
  }

  function hydrateDescriptions(data){
    data.forEach(m=>{
      if(!m.description){
        m.description=clone(productDescriptions[m.name]||{
          users:"В продуктовом плане не заполнено.",
          beneficiaries:"В продуктовом плане не заполнено.",
          area:"В продуктовом плане не заполнено.",
          functional:"В продуктовом плане не заполнено.",
          benefits:"В продуктовом плане не заполнено.",
          competitors:"В продуктовом плане не заполнено.",
          usp:"В продуктовом плане не заполнено."
        });
      }
      m.marketing=normalizeMarketing(m.marketing);
    });
    return data;
  }

  let state=prioritizeModules(hydrateDescriptions(migrateState(load())));
  let active=0;
  let viewMode="roadmap";
  let taskStageFilters=new Set();
  let topStageFilters=new Set();
  let topDirectionFilters=new Set();
  let topPriorityFilters=new Set();
  let topQuarterFilters=new Set();
  let focusedFeatureName=null;
  let dragContext=null;
  let justDragged=false;
  const collapsed=new Set();

  function areAllFeaturesCollapsed(){
    const features=state[active]?.features||[];
    return features.length>0 && features.every((_,i)=>collapsed.has(`${active}:${i}`));
  }

  function toggleAllFeatures(){
    const features=state[active]?.features||[];
    if(areAllFeaturesCollapsed()){
      features.forEach((_,i)=>collapsed.delete(`${active}:${i}`));
    }else{
      features.forEach((_,i)=>collapsed.add(`${active}:${i}`));
    }
    render();
  }

  function load(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed)&&parsed.length)return parsed;
      }
    }catch(e){}
    return clone(initial);
  }
  function saveLocal(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      const status=$("saveState");
      if(status)status.textContent="Сохранено локально";
    }catch(e){
      const status=$("saveState");
      if(status)status.textContent="Не удалось сохранить локально";
    }
  }

  function setSaveState(text){
    const status=$("saveState");
    if(status)status.textContent=text;
  }

  async function putRemoteState(data){
    if(remoteSaving)return false;
    remoteSaving=true;
    try{
      const response=await fetch(REMOTE_API,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        cache:"no-store",
        body:JSON.stringify({data})
      });

      let payload={};
      try{ payload=await response.json(); }catch(e){}

      if(!response.ok){
        throw new Error(payload.error||"Ошибка серверного сохранения");
      }

      setSaveState(payload.unchanged?"Без изменений":"Сохранено");
      return true;
    }catch(err){
      console.error("Remote save failed",err);
      setSaveState("Сохранено только на этом устройстве");
      return false;
    }finally{
      remoteSaving=false;
    }
  }

  async function getVersionHistory(){
    const response=await fetch(`${REMOTE_API}?history=1`,{method:"GET",cache:"no-store"});
    let payload={};
    try{payload=await response.json()}catch(e){}
    if(!response.ok)throw new Error(payload.error||"Не удалось загрузить историю");
    return payload;
  }

  function formatVersionDate(value){
    if(!value)return "Дата неизвестна";
    const d=new Date(value);
    if(Number.isNaN(d.getTime()))return value;
    return d.toLocaleString("ru-RU",{
      day:"2-digit",month:"2-digit",year:"numeric",
      hour:"2-digit",minute:"2-digit",second:"2-digit"
    });
  }

  function versionStatsText(v){
    const parts=[];
    if(Number.isFinite(v.moduleCount))parts.push(`${v.moduleCount} мод.`);
    if(Number.isFinite(v.featureCount))parts.push(`${v.featureCount} функц.`);
    if(Number.isFinite(v.taskCount))parts.push(`${v.taskCount} дораб.`);
    return parts.join(" · ");
  }

  async function versionHistoryModal(){
    closeActionsMenu();
    openModal(`<div class="modal-header"><h4 class="modal-title">История версий</h4></div>
      <div class="modal-body"><div class="history-loading">Загрузка истории…</div></div>
      <div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Закрыть</button></div>`);

    try{
      const payload=await getVersionHistory();
      const current=payload.current;
      const history=Array.isArray(payload.history)?payload.history:[];
      const rows=[];

      if(current){
        rows.push(`<div class="history-row current">
          <div class="history-main">
            <div class="history-date">${esc(formatVersionDate(current.updatedAt))}</div>

  async function rollbackVersion(versionId){
    if(!versionId)return;
    if(!confirm("Восстановить выбранную версию? Текущая версия останется в истории."))return;

    try{
      setSaveState("Восстановление…");
      const response=await fetch(REMOTE_API,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        cache:"no-store",
        body:JSON.stringify({action:"rollback",versionId})
      });

      let payload={};
      try{payload=await response.json()}catch(e){}
      if(!response.ok)throw new Error(payload.error||"Не удалось восстановить версию");
      if(!Array.isArray(payload.data))throw new Error("Сервер вернул некорректные данные");

      state=prioritizeModules(hydrateDescriptions(migrateState(payload.data)));
      active=0;
      saveLocal();
      closeModal();
      render();
      setSaveState("Версия восстановлена");
    }catch(err){
      console.error(err);
      alert(err.message||"Не удалось восстановить версию");
      setSaveState("Ошибка восстановления");
    }
  }

  function scheduleRemoteSave(){
    if(!remoteLoadDone){
      setSaveState("Загрузка данных…");
      return;
    }
    clearTimeout(remoteSaveTimer);
    remoteSaveTimer=setTimeout(()=>{
      putRemoteState(clone(state));
    },350);
  }

  function save(){
    saveLocal();
    scheduleRemoteSave();
  }

  async function loadRemoteState(){
    try{
      const response=await fetch(REMOTE_API,{method:"GET",cache:"no-store"});
      if(!response.ok)throw new Error("HTTP "+response.status);
      const payload=await response.json();

      if(Array.isArray(payload.data)&&payload.data.length){
        state=prioritizeModules(hydrateDescriptions(migrateState(payload.data)));
        active=Math.min(active,Math.max(0,state.length-1));
        saveLocal();
        render();
        setSaveState("Синхронизировано");
      }else{
        // Сервер пуст: ничего автоматически не записываем.
        // Данные появятся на сервере только после явного редактирования пользователем.
        setSaveState("Сервер готов");
      }
    }catch(err){
      console.error("Remote load failed",err);
      setSaveState("Локальный режим");
    }finally{
      remoteLoadDone=true;
    }
  }

  function money(s){
    const m=String(s||"").match(/^\s*(Высокий|Средний|Низкий)\.?\s*(.*)$/i);
    if(!m)return{level:"Средний",reason:String(s||"")};
    const level=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
    return{level,reason:m[2]||""};
  }

  function featureMoneyValue(feature){
    const legacy=money(feature?.monetization);
    const hasLevel=feature&&Object.prototype.hasOwnProperty.call(feature,"monetizationLevel");
    const hasReason=feature&&Object.prototype.hasOwnProperty.call(feature,"monetizationReason");

    const level=hasLevel&&["Высокий","Средний","Низкий"].includes(String(feature.monetizationLevel||"").trim())
      ? String(feature.monetizationLevel).trim()
      : legacy.level;

    const reason=hasReason
      ? String(feature.monetizationReason??"")
      : legacy.reason;

    return {level,reason};
  }

  function taskMoneyReasonValue(task,featureMoney){
    return task&&Object.prototype.hasOwnProperty.call(task,"monetizationReason")
      ? String(task.monetizationReason??"")
      : String(featureMoney?.reason??"");

    if(
      s==="очередь" ||

      s==="тестирование" ||
      s==="вылить" ||

  function getStageOrder(module=state[active]){
    const stored=Array.isArray(module?.stageOrder)?module.stageOrder:[];
    const actual=(module?.features||[])
      .flatMap(f=>(f.tasks||[]).map(t=>String(t.status||"В планах")));
    const result=[];
    const seen=new Set();
    [...stored,...DEFAULT_STAGE_ORDER,...actual].forEach(stage=>{
      const s=String(stage||"").trim();
      if(!s||seen.has(s))return;
      seen.add(s);
      result.push(s);
    });
    return result;
  }

  function stageRank(status){
    const s=String(status||"В планах");
    const order=getStageOrder();
    const i=order.indexOf(s);
    return i===-1?order.length:i;

  function groupTasksByStage(tasks){

    tasks.forEach(t=>{
      const stage=String(t.status||"В планах");
      if(!map.has(stage))map.set(stage,[]);
      map.get(stage).push(t);
    });
    return [...map.entries()].sort((a,b)=>{
      const ra=stageRank(a[0]), rb=stageRank(b[0]);
      return ra===rb ? a[0].localeCompare(b[0],"ru") : ra-rb;
    });

  function taskMatchesQuarterFilter(task,status=task.status){
    if(!topQuarterFilters.size)return true;
    if(topQuarterFilters.has(FILTER_NONE))return false;

    const range=roadmapDateRange(task,status);
    if(range.start===null||range.end===null)return false;

    const lo=Math.min(range.start,range.end);
    const hi=Math.max(range.start,range.end);
    return [...topQuarterFilters].some(value=>{
      const index=Number(value);
      return Number.isFinite(index)&&index>=lo&&index<=hi;
    });
  }

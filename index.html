<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFOTECH DNM — карта развития продуктов</title>
<style>
:root{
  --ink:#202936;
  --muted:#6F7E8E;
  --soft:#9CA9B6;
  --line:#DCE4EA;
  --line-strong:#B8C6D1;
  --paper:#FFFFFF;
  --canvas:#F4F7FC;
  --panel:#EEF3F6;
  --blue:#139FEA;
  --blue-deep:#0E79B2;
  --blue-soft:#EAF7FD;
  --green:#3DDC4A;
  --green-deep:#238B31;
  --green-soft:#EFFBEF;
  --red:#D95B68;
  --red-soft:#FFF0F2;
  --amber:#D59628;
  --amber-soft:#FFF6DE;
  --focus:#0094FF;
  --sidebar:276px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue-deep)}
:focus-visible{outline:3px solid rgba(0,148,255,.28);outline-offset:2px}

/* INFOTECH brand */
.brandbar{height:4px;display:grid;grid-template-columns:1.15fr 1fr .85fr .7fr}
.brandbar span:nth-child(1){background:#139FEA}
.brandbar span:nth-child(2){background:#29B6F3}
.brandbar span:nth-child(3){background:#48DD4B}
.brandbar span:nth-child(4){background:#238B31}
.infotech-mark{display:flex;align-items:center;gap:12px;min-width:0}
.infotech-word{font-size:18px;letter-spacing:.18em;font-weight:700;color:#4F5E6D;white-space:nowrap}
.infotech-bars{display:flex;gap:3px;transform:skewX(-18deg)}
.infotech-bars i{display:block;width:15px;height:6px}
.infotech-bars i:nth-child(1){background:#139FEA}.infotech-bars i:nth-child(2){background:#29B6F3}
.infotech-bars i:nth-child(3){background:#48DD4B}.infotech-bars i:nth-child(4){background:#238B31}

/* Bootstrap-like common UI components, styled to INFOTECH */
.btn{display:inline-block;padding:7px 12px;margin-bottom:0;font-size:13px;font-weight:400;line-height:1.42857143;text-align:center;white-space:nowrap;vertical-align:middle;touch-action:manipulation;border:1px solid transparent;border-radius:3px;background-image:none}
.btn-default{color:#4F5E6D;background:#fff;border-color:#CCD6DE}.btn-default:hover{background:#F5F7F9;border-color:#A8B7C3}
.btn-primary{color:#fff;background:var(--blue-deep);border-color:#086892}.btn-primary:hover{background:#086A9E}
.btn-danger{color:#B13C48;background:#fff;border-color:#E7B1B8}.btn-danger:hover{background:var(--red-soft)}
.btn-xs{padding:2px 7px;font-size:12px;line-height:1.5;border-radius:2px}
.btn-group{display:inline-flex;vertical-align:middle}.btn-group>.btn{border-radius:0}.btn-group>.btn:first-child{border-radius:3px 0 0 3px}.btn-group>.btn:last-child{border-radius:0 3px 3px 0}.btn-group>.btn+.btn{margin-left:-1px}
.label{display:inline;padding:.24em .55em;font-size:10px;font-weight:700;line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:baseline;border-radius:2px}
.label-default{background:#7E8C9B}.label-primary{background:var(--blue-deep)}.label-success{background:var(--green-deep)}.label-info{background:#139FEA}.label-warning{background:#D59628}.label-danger{background:var(--red)}
.badge{display:inline-block;min-width:10px;padding:3px 7px;font-size:11px;font-weight:700;line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:middle;background:#6F7E8E;border-radius:10px}
.nav{padding-left:0;margin-bottom:0;list-style:none}.nav>li{position:relative;display:block}.nav>li>a{position:relative;display:block;text-decoration:none}
.nav-pills>li>a{border-radius:2px}.nav-stacked>li+li{margin-top:2px}
.panel{margin-bottom:16px;background:#fff;border:1px solid transparent;border-radius:2px}
.panel-default{border-color:var(--line)}.panel-heading{padding:10px 12px;border-bottom:1px solid transparent;border-radius:1px 1px 0 0}
.panel-default>.panel-heading{color:var(--ink);background:#F7F9FB;border-color:var(--line)}
.panel-body{padding:12px}.panel-title{margin:0;font-size:14px;font-weight:700}
.list-group{padding-left:0;margin:0}.list-group-item{position:relative;display:block;padding:10px 12px;margin-bottom:-1px;background:#fff;border:1px solid var(--line)}
.list-group-item:first-child{border-top-left-radius:2px;border-top-right-radius:2px}.list-group-item:last-child{margin-bottom:0;border-bottom-left-radius:2px;border-bottom-right-radius:2px}
.input-group{position:relative;display:table;border-collapse:separate}.input-group-addon,.form-control{display:table-cell}
.input-group-addon{width:1%;white-space:nowrap;vertical-align:middle;padding:7px 10px;font-size:13px;color:#5E6D7C;background:#EEF3F6;border:1px solid #C7D2DB;border-right:0;border-radius:3px 0 0 3px}
.form-control{width:100%;height:34px;padding:6px 10px;font-size:13px;line-height:1.42857143;color:#344151;background:#fff;border:1px solid #C7D2DB;border-radius:3px;box-shadow:inset 0 1px 1px rgba(0,0,0,.025)}
.input-group .form-control{border-radius:0 3px 3px 0}
.form-control:focus{border-color:#66AFE9;outline:0;box-shadow:0 0 0 2px rgba(19,159,234,.12)}
.alert{padding:10px 12px;margin-bottom:14px;border:1px solid transparent;border-radius:2px}.alert-info{color:#0C658F;background:#EAF7FD;border-color:#B6E0F3}.alert-danger{color:#9B3440;background:#FFF0F2;border-color:#E9B7BE}
.popover{position:fixed;z-index:1060;display:none;width:430px;max-width:calc(100vw - 28px);padding:1px;text-align:left;white-space:normal;background:#fff;border:1px solid #AEBCC7;border-radius:3px;box-shadow:0 7px 18px rgba(32,41,54,.16)}
.popover-title{padding:9px 12px;margin:0;font-size:13px;font-weight:700;background:#F7F9FB;border-bottom:1px solid var(--line)}
.popover-content{padding:11px 12px;font-size:12px;line-height:1.5;color:#4F5E6D}
.modal-backdrop{position:fixed;inset:0;background:rgba(32,41,54,.45);z-index:1040;display:none}
.modal-backdrop.in{display:block}
.modal{position:fixed;z-index:1050;inset:0;display:none;overflow:auto;padding:38px 16px}
.modal.in{display:block}.modal-dialog{width:min(650px,100%);margin:0 auto}
.modal-content{position:relative;background:#fff;border:1px solid rgba(0,0,0,.18);border-radius:3px;box-shadow:0 8px 28px rgba(32,41,54,.22)}
.modal-header,.modal-footer{padding:13px 15px;border-bottom:1px solid var(--line)}.modal-footer{border-top:1px solid var(--line);border-bottom:0;text-align:right}
.modal-title{margin:0;font-size:17px}.modal-body{padding:15px}
.form-group{margin-bottom:13px}.form-group label{display:block;max-width:100%;margin-bottom:5px;font-weight:700;font-size:12px;color:#536273}
textarea.form-control{height:auto;min-height:90px;resize:vertical}

/* App shell */
.topbar{height:67px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:40}
.topbar-inner{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 18px;gap:18px}
.product-title{min-width:0;display:flex;align-items:baseline;gap:12px}
.product-title h1{font-size:18px;margin:0;font-weight:700;color:var(--ink);white-space:nowrap}
.product-title small{font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.save-state{font-size:11px;color:var(--muted)}

.module-tabsbar{
  position:sticky;top:67px;z-index:35;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 2px 5px rgba(32,41,54,.035)
}
.module-tabs-inner{display:flex;align-items:center;gap:14px;padding:9px 18px;min-width:0}
.module-tabs-heading{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:12px;color:#536273;font-weight:700}
.module-nav-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex:1;padding-bottom:1px}
.modules-horizontal{display:flex;gap:4px;min-width:max-content}
.modules-horizontal>li{display:block}
.modules-horizontal>li>a{
  padding:7px 11px;color:#4F5E6D;border:1px solid transparent;background:#fff;
  font-size:12px;line-height:1.2;border-radius:3px
}
.modules-horizontal>li>a:hover{background:#F4F7FC;border-color:#DCE4EA;color:var(--ink)}
.modules-horizontal>li.active>a{
  background:#EAF7FD;color:#0E79B2;border-color:#A9DDF4;font-weight:700
}
.modules-horizontal .badge{margin-left:5px;background:#C8D5DE;color:#445360}
.modules-horizontal li.active .badge{background:#139FEA;color:#fff}

.shell{min-height:calc(100vh - 112px)}
.main{min-width:0;padding:18px 24px 52px;max-width:1760px;margin:0 auto}
.module-header{display:flex;gap:16px;align-items:center;justify-content:flex-end;margin-bottom:12px}
.module-header-title{display:none}
.module-meta{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;width:100%}
.searchbox{width:min(440px,46vw)}
.summary-strip{display:flex;gap:18px;align-items:center;padding:9px 0 13px;border-bottom:1px solid var(--line);margin-bottom:16px;color:#5B6674;font-size:12px;flex-wrap:wrap}
.summary-strip strong{color:var(--ink);font-size:14px}.summary-strip .sep{width:1px;height:22px;background:var(--line)}
.legend{display:flex;gap:12px;margin-left:auto;align-items:center;font-size:11px;color:#758493}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}.legend .planned{background:#139FEA}.legend .done{background:#9CA9B6}
.progress{height:7px;margin:0;overflow:hidden;background:#E4EAF0;border-radius:2px;width:140px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.progress-bar{float:left;width:0;height:100%;font-size:9px;line-height:7px;color:#fff;text-align:center;background:#139FEA;transition:width .25s ease}
.progress-bar-success{background:#3DDC4A}

/* Network map */
.network-board{
  position:relative;padding:8px 0 34px;min-height:420px;overflow:visible
}
.network-svg{
  position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible
}
.network-root-wrap{position:relative;z-index:2;display:flex;justify-content:center;margin:6px 0 58px}
.network-root{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:15px 28px;background:#fff;border:1px solid #8FB4C9;border-top:4px solid #139FEA;
  min-width:340px;max-width:720px;box-shadow:0 3px 9px rgba(32,41,54,.06)
}
.network-root .root-title{font-size:18px;font-weight:700;line-height:1.2}
.network-root .root-kicker{font-size:10.5px;color:var(--muted);margin-top:4px}
.feature-grid{
  position:relative;z-index:2;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:28px 24px;align-items:start
}
.feature-row{
  position:relative;display:flex;flex-direction:column;min-width:0;gap:8px
}
.feature-panel{margin:0;transition:border-color .12s;background:#fff;position:relative}
.feature-panel:before{
  content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #139FEA;z-index:3
}
.feature-panel:hover{border-color:#88BFD9}
.feature-panel .panel-heading{background:#fff;padding:11px 12px;border-bottom:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.feature-panel .panel-title{font-size:14px;line-height:1.3}
.feature-panel .panel-body{padding:3px 12px 11px}
.feature-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.feature-hint{font-size:10.5px;color:#8492A0;margin-top:9px}
.feature-actions{display:none;gap:4px;white-space:nowrap}.edit-mode .feature-actions{display:flex}
.task-column{min-width:0}
.task-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;min-height:24px}
.task-toolbar .count{font-size:11px;color:#7A8997}
.task-list.collapsed{display:none}
.task-item{padding:9px 90px 9px 11px;min-height:38px;line-height:1.35;font-size:12px;color:#364453}
.task-item.closed{background:#F5F7F9;color:#778391}
.task-item .task-id{font-weight:700;color:#0E79B2;margin-right:5px}
.task-item.closed .task-id{color:#7B8997}
.task-item .status{margin-right:6px}
.task-actions{position:absolute;right:7px;top:6px;display:none;gap:3px}.edit-mode .task-actions{display:flex}
.empty-tasks{padding:12px;color:#82909D;font-size:12px;border:1px dashed #C9D5DE;background:#FAFBFC}
.add-task{display:none;width:100%;margin-top:7px;border-style:dashed}.edit-mode .add-task{display:block}
.add-feature-wrap{position:relative;z-index:3;text-align:center;margin-top:24px}
.add-feature{display:none}.edit-mode .add-feature{display:inline-block}.edit-mode .add-feature{display:inline-block}
.edit-module{display:none}.edit-mode .edit-module{display:inline-block}
.no-results{padding:38px 15px;color:#6F7E8E;text-align:center;border:1px dashed #C9D5DE;background:#fff}

.popover .money-block{padding:8px 9px;background:#F4F7FC;border-left:3px solid #139FEA;margin-top:9px}
.popover .money-block.high{background:#EFFBEF;border-color:#3DDC4A}.popover .money-block.low{background:#F3F5F7;border-color:#9CA9B6}
.popover .field-name{font-size:10px;font-weight:700;color:#7B8997;margin-bottom:4px}
.popover .value{color:#354252}
.popover .money-value{font-weight:700}

/* Small screens */
@media(max-width:1100px){
  .product-title small{display:none}
  .feature-grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .network-root{min-width:300px}
}
@media(max-width:760px){
  .topbar{height:auto;position:static}.topbar-inner{align-items:flex-start;padding:12px;flex-direction:column}
  .toolbar{justify-content:flex-start}.save-state{display:none}
  .module-tabsbar{position:static}.module-tabs-inner{padding:8px 10px;align-items:flex-start;flex-direction:column;gap:6px}
  .module-tabs-heading{display:none}.module-nav-wrap{width:100%}
  .main{padding:12px 10px 40px}.module-header{justify-content:flex-start}.header-actions{justify-content:flex-start}
  .searchbox{width:100%}.summary-strip{gap:10px}.legend{margin-left:0;width:100%}
  .network-root-wrap{margin-bottom:45px}.network-root{min-width:0;width:100%;max-width:100%}
  .feature-grid{grid-template-columns:1fr;gap:24px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="brandbar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="product-title">
      <div class="infotech-mark" aria-label="INFOTECH">
        <div>
          <div class="infotech-word">INFOTECH</div>
          <div class="infotech-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
      <h1>DNM · карта развития продуктов</h1>
      <small>иерархия планируемых и закрытых доработок</small>
    </div>
    <div class="toolbar">
      <span id="saveState" class="save-state">Исходные данные</span>
      <div class="btn-group" role="group" aria-label="Редактирование">
        <button id="editToggle" class="btn btn-primary">Редактировать</button>
        <button id="exportCsv" class="btn btn-default">CSV</button>
        <button id="exportJson" class="btn btn-default">JSON</button>
      </div>
      <button id="importJsonBtn" class="btn btn-default">Импорт</button>
      <input id="importJson" type="file" accept=".json,application/json" hidden>
      <button id="resetBtn" class="btn btn-danger">Сбросить</button>
    </div>
  </div>
</header>

<div class="module-tabsbar">
  <div class="module-tabs-inner">
    <div class="module-tabs-heading">Модули <span id="moduleCount" class="badge"></span></div>
    <div class="module-nav-wrap">
      <ul id="moduleNav" class="nav nav-pills modules-horizontal"></ul>
    </div>
  </div>
</div>

<div class="shell">

  <main class="main">
    <div class="module-header">
      <div class="module-header-title">
        <h2 id="moduleTitle"></h2>
        <div id="moduleMeta" class="module-meta"></div>
      </div>
      <div class="header-actions">
        <div class="input-group searchbox">
          <span class="input-group-addon">⌕</span>
          <input id="searchInput" class="form-control" type="search" placeholder="Найти Ф-л или доработку">
        </div>
        <label class="btn btn-default"><input id="showClosed" type="checkbox" checked style="margin-right:6px">Закрытые</label>
        <button id="editModuleBtn" class="btn btn-default edit-module">Изменить модуль</button>
      </div>
    </div>

    <div id="summaryStrip" class="summary-strip"></div>


    <div id="networkBoard" class="network-board">
      <svg id="networkSvg" class="network-svg" aria-hidden="true">
        <defs>
          <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto">
            <polygon points="0 0, 7 3.5, 0 7" fill="#93AFC1"></polygon>
          </marker>
        </defs>
      </svg>
      <div class="network-root-wrap">
        <div id="networkRoot" class="network-root">
          <div>
            <div id="rootTitle" class="root-title"></div>
            <div class="root-kicker">Dealer Network Management / продуктовый контур</div>
          </div>
        </div>
      </div>
      <div id="featureRows" class="feature-grid"></div>
      <div class="add-feature-wrap">
        <button id="addFeatureBtn" class="btn btn-default add-feature">Добавить Ф-л</button>
      </div>
    </div>
  </main>
</div>

<div id="popover" class="popover" role="tooltip">
  <h3 id="popoverTitle" class="popover-title"></h3>
  <div id="popoverContent" class="popover-content"></div>
</div>

<div id="modalBackdrop" class="modal-backdrop"></div>

"20283","status":"Закрыто","title":"Всплывающие окошки при звонке"}]},{"name":"UX и производительность","why":"Ускоряет работу оператора и снижает риск потери обращения из-за задержек и перегруженного интерфейса.","monetization":"Низкий. Ускоряет работу операторов, но воспринимается как обязательное качество контакт-центра, а не самостоятельная платная возможность.","tasks":[{"number":"","status":"Планируется","title":"Оптимизировать создание лидов по звонкам и чатам."},{"number":"","status":"Планируется","title":"Обновить UX меню, карточки лида и создания РЛ."},{"number":"","status":"Планируется","title":"Добавить режимы «Мои»/«Наблюдаю»."},{"number":"48543","status":"Закрыто","title":"Коллцентр, долгая загрузка"},{"number":"20057","status":"Закрыто","title":"504  /yii/contactCenter/report/attract/"}]},{"name":"Аналитика","why":"Дает руководителю полную картину нагрузки и эффективности операторов, каналов и конверсии до РЛ.","monetization":"Средний. Повышает управляемость контакт-центра и даёт основу для premium-отчётности, но основная ценность зависит от уже используемого операционного контура.","tasks":[{"number":"","status":"Планируется","title":"Расширить и оптимизировать отчетность по лидам, операторам, времени обработки и источникам."}]},{"name":"Процессы клиентской службы","why":"Переносит сложные процессы клиентской службы из Excel в DNM и снижает ручной перенос и рассинхронизацию данных.","monetization":"Средний. Заменяет Excel и ручные процессы, повышая ценность CRM и удержание клиента; чаще монетизируется как расширение существующего модуля.","tasks":[{"number":"44039","status":"Ждем согласования/оплаты/ДС","title":"процесс согласования компенсации/возврата автомобиля с настраиваемыми расчетами в DNM."}]}]},{"name":"Предодобрение кредита Сбербанк в DNM","features":[{"name":"Кредитный скоринг и триггерные предложения","why":"Позволяет использовать кредитный потенциал клиента уже в первом контакте и повторно активировать клиентов сервиса релевантным предложением нового автомобиля.","monetization":"Высокий. Может давать прямой прирост продаж и кредитных сделок, а также допускает партнёрскую модель оплаты за лид, заявку или результат.","tasks":[{"number":"","status":"Планируется","title":"При создании лида передавать в Сбербанк телефон, бренд и модель; возвращать и показывать менеджеру предодобренный кредитный лимит."},{"number":"","status":"Планируется","title":"По ЗН и заданным условиям автоматически формировать коммуникацию клиенту с релевантным кредитным предложением."}]}]},{"name":"Модуль In-App продаж","features":[{"name":"Витрина и продажа продуктов","why":"Повышает знание клиентов о доступных модулях и сокращает путь от интереса к подключению и использованию продукта.","monetization":"Высокий. Это прямой канал внутренних продаж модулей и услуг DNM, который сокращает путь до покупки и непосредственно влияет на выручку.","tasks":[{"number":"376","status":"Code review","title":"единый механизм рекламных/информационных карточек и модалок с заявкой на подключение."},{"number":"","status":"Планируется","title":"Создать внутри DNM/CRM страницу-витрину приложений и дополнительных сервисов."},{"number":"","status":"Планируется","title":"Автоматизировать путь запрос → подтверждение ЛПР → подключение/продажа → онбординг."}]},{"name":"Аналитика воронки","why":"Позволяет оценивать эффективность внутренних продаж продуктов от показа карточки до фактического подключения.","monetization":"Средний. Помогает повышать конверсию внутренних продаж и оптимизировать продуктовые предложения, но сама по себе не является отдельным продаваемым продуктом.","tasks":[{"number":"","status":"Планируется","title":"Сделать отчет по просмотрам карточек, лидам и конверсии в подключение/продажу."}]}]},{"name":"Лид-расчет-рекомендации в ОП по клиенту записанному на сервис","features":[{"name":"Сервис → продажи","why":"Позволяет системно выявлять клиентов сервиса, готовых к замене автомобиля, и сразу передавать в продажи персональное предложение из реального склада.","monetization":"Высокий. Создаёт новый поток лидов из сервисной базы и персональные предложения по реальному складу; ценность напрямую измеряется дополнительными продажами.","tasks":[{"number":"","status":"Планируется","title":"Анализировать будущую запись/ПЗН/ЗН по набору параметров и рассчитывать вероятность обмена автомобиля."},{"number":"","status":"Планируется","title":"Автоматически формировать индивидуальное КП с вариантами обмена на базе актуального склада и передавать его в отдел продаж/CRM."}]}]},{"name":"Анализ оттока клиентов из сервиса","features":[{"name":"Причины оттока и удержание","why":"Помогает понять, почему клиент уходит в другой ДЦ, и дает исходному дилеру фактические причины для улучшения процесса удержания.","monetization":"Высокий. Удержание сервисных клиентов напрямую связано с повторной выручкой; аналитика причин оттока имеет понятный финансовый эффект и может продаваться как AI-аналитика.","tasks":[{"number":"","status":"Планируется","title":"При получении ЗН по заезду не в свой ДЦ автоматически отправлять клиенту опрос, а исходному ДЦ передавать обезличенную аналитику по причинам ухода."}]}]}]</script>
<script>
(function(){
  const STORAGE_KEY="infotech-dnm-product-map-v3";
  const initial=JSON.parse(document.getElementById("initialData").textContent);

  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const clone=v=>JSON.parse(JSON.stringify(v));
  const closed=t=>String(t.status||"").toLowerCase()==="закрыто";

  let state=load();
  let active=0;
  let editMode=false;
  const collapsed=new Set();

  function load(){try{const x=localStorage.getItem(STORAGE_KEY);return x?JSON.parse(x):clone(initial)}catch(e){return clone(initial)}}
  function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$("saveState").textContent="Сохранено "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}catch(e){$("saveState").textContent="Не удалось сохранить"}}

  function money(s){
    const m=String(s||"").match(/^\s*(Высокий|Средний|Низкий)\.?\s*(.*)$/i);
    if(!m)return{level:"Средний",reason:String(s||"")};
    const level=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
    return{level,reason:m[2]||""};
  }
  function labelClass(status){
    const s=String(status||"").toLowerCase();
    if(s==="закрыто")return"label-default";
    if(s.includes("работ"))return"label-primary";
    if(s.includes("реализ")||s.includes("code review")||s.includes("проверке"))return"label-info";
    if(s.includes("ожид")||s.includes("соглас"))return"label-warning";
    if(s.includes("дизайн")||s.includes("аналит"))return"label-success";
    return"label-primary";
  }
  function moneyLabel(level){return level==="Высокий"?"label-success":level==="Низкий"?"label-default":"label-warning"}
  function taskText(t){
    return `${t.number?"#"+t.number+" ":""}${t.status&&t.status!=="Планируется"?"("+t.status+") — ":""}${t.title||""}`.trim()
  }
  function q(){return $("searchInput").value.trim().toLowerCase()}
  function matches(s){return !q()||String(s||"").toLowerCase().includes(q())}

  function renderNav(){
    $("moduleCount").textContent=state.length;
    const ul=$("moduleNav");ul.innerHTML="";
    state.forEach((m,i)=>{
      const li=document.createElement("li");if(i===active)li.className="active";
      const a=document.createElement("a");a.href="#";a.innerHTML=`${esc(m.name)} <span class="badge">${m.features.length}</span>`;
      a.onclick=e=>{e.preventDefault();active=i;render()};
      li.appendChild(a);ul.appendChild(li);
    })
  }

  function render(){
    if(!state.length)return;
    if(active>=state.length)active=0;
    renderNav();
    const m=state[active];
    const all=m.features.flatMap(f=>f.tasks);
    const done=all.filter(closed).length;
    $("moduleTitle").textContent=m.name;
    $("rootTitle").textContent=m.name;
    $("moduleMeta").textContent=`${m.features.length} функциональных блоков · ${all.length} доработок`;
    $("summaryStrip").innerHTML=`
      <span><strong>${m.features.length}</strong> Ф-л</span><span class="sep"></span>
      <span><strong>${all.length-done}</strong> планируются / в работе</span><span class="sep"></span>
      <span><strong>${done}</strong> закрыто</span>
      <span class="progress" title="Доля закрытых задач"><span class="progress-bar progress-bar-success" style="width:${all.length?Math.round(done/all.length*100):0}%"></span></span>
      <span class="legend"><span><i class="planned"></i>активные</span><span><i class="done"></i>закрытые</span></span>`;
    renderFeatures(m);
  }

  function featureVisible(f){
    if(!q())return true;
    if(matches(f.name)||matches(f.why)||matches(f.monetization))return true;
    return f.tasks.some(t=>matches(taskText(t)));
  }

  function visibleTasks(f){
    return f.tasks.filter(t=>{
      if(!$("showClosed").checked&&closed(t))return false;
      if(!q())return true;
      if(matches(f.name)||matches(f.why)||matches(f.monetization))return true;
      return matches(taskText(t));
    })
  }

  function renderFeatures(m){
    const host=$("featureRows");host.innerHTML="";
    let shown=0;
    m.features.forEach((f,fi)=>{
      if(!featureVisible(f))return;
      shown++;
      const mp=money(f.monetization);
      const tasks=visibleTasks(f);
      const key=`${active}:${fi}`;
      const isCollapsed=collapsed.has(key)&&!q();
      const row=document.createElement("section");row.className="feature-row";row.dataset.fi=fi;
      row.innerHTML=`
        <div class="panel panel-default feature-panel" data-hover="${fi}" tabindex="0">
          <div class="panel-heading">
            <h3 class="panel-title">${esc(f.name)}</h3>
            <span class="feature-actions">
              <button class="btn btn-default btn-xs" data-action="edit-feature" data-fi="${fi}">Изм.</button>
              <button class="btn btn-danger btn-xs" data-action="delete-feature" data-fi="${fi}">×</button>
            </span>
          </div>
          <div class="panel-body">
            <div class="feature-tags">
              <span class="label ${moneyLabel(mp.level)}">${esc(mp.level)}</span>
              <span class="label label-info">${f.tasks.length} задач</span>
            </div>
            <div class="feature-hint">Навести: зачем и монетизация</div>
          </div>
        </div>
        <div class="task-column">
          <div class="task-toolbar">
            <span class="count">${tasks.length} отображается</span>
            <button class="btn btn-default btn-xs" data-action="toggle" data-fi="${fi}">${isCollapsed?"Показать":"Свернуть"}</button>
          </div>
          <div class="task-list ${isCollapsed?"collapsed":""}">
            <div class="list-group">
              ${tasks.map(t=>{
                const ti=f.tasks.indexOf(t);
                return `<div class="list-group-item task-item ${closed(t)?"closed":""}">
                  ${t.number?`<span class="task-id">#${esc(t.number)}</span>`:""}
                  <span class="label ${labelClass(t.status)} status">${esc(t.status||"Планируется")}</span>
                  <span>${esc(t.title||"")}</span>
                  <span class="task-actions">
                    <button class="btn btn-default btn-xs" data-action="edit-task" data-fi="${fi}" data-ti="${ti}">Изм.</button>
                    <button class="btn btn-danger btn-xs" data-action="delete-task" data-fi="${fi}" data-ti="${ti}">×</button>
                  </span>
                </div>`
              }).join("")||`<div class="empty-tasks">Нет отображаемых доработок</div>`}
            </div>
            <button class="btn btn-default add-task" data-action="add-task" data-fi="${fi}">Добавить доработку</button>
          </div>
        </div>`;
      host.appendChild(row);
    })
    if(!shown)host.innerHTML=`<div class="no-results">По запросу ничего не найдено в этом модуле.</div>`;
    bindPopover();
    requestAnimationFrame(()=>requestAnimationFrame(drawNetworkArrows));
  }

  function drawNetworkArrows(){
    const svg=$("networkSvg"),board=$("networkBoard"),root=$("networkRoot");
    if(!svg||!board||!root)return;
    while(svg.lastChild && svg.lastChild.tagName.toLowerCase()!=="defs")svg.removeChild(svg.lastChild);

    const cards=[...document.querySelectorAll(".feature-panel")];
    if(!cards.length)return;

    const br=board.getBoundingClientRect();
    const rr=root.getBoundingClientRect();
    const width=board.clientWidth;
    const height=board.scrollHeight;
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.setAttribute("height",height);

    const sx=rr.left+rr.width/2-br.left;
    const sy=rr.bottom-br.top+2;
    const branchY=sy+27;

    cards.forEach(card=>{
      const cr=card.getBoundingClientRect();
      const tx=cr.left+cr.width/2-br.left;
      const ty=cr.top-br.top-9;

      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      const curve=Math.max(18,Math.min(48,(ty-sy)*.35));
      path.setAttribute("d",`M ${sx} ${sy} C ${sx} ${sy+curve}, ${tx} ${ty-curve}, ${tx} ${ty}`);
      path.setAttribute("fill","none");
      path.setAttribute("stroke","#93AFC1");
      path.setAttribute("stroke-width","1.7");
      path.setAttribute("marker-end","url(#arrowHead)");
      path.setAttribute("vector-effect","non-scaling-stroke");
      svg.appendChild(path);
    });
  }

  function bindPopover(){
    document.querySelectorAll("[data-hover]").forEach(x=>{
      const fi=Number(x.dataset.hover);
      x.onmouseenter=e=>showPopover(e.currentTarget,fi);
      x.onmouseleave=hidePopover;
      x.onfocus=e=>showPopover(e.currentTarget,fi);
      x.onblur=hidePopover;
    })
  }
  function showPopover(anchor,fi){
    const f=state[active].features[fi],mp=money(f.monetization),p=$("popover");
    $("popoverTitle").textContent=f.name;
    const cls=mp.level==="Высокий"?"high":mp.level==="Низкий"?"low":"";
    $("popoverContent").innerHTML=`
      <div class="field-name">Зачем / какую боль закрывает</div>
      <div class="value">${esc(f.why||"Не указано")}</div>
      <div class="money-block ${cls}">
        <div class="field-name">Перспектива монетизации</div>
        <div class="money-value">${esc(mp.level)}</div>
        ${mp.reason?`<div class="value" style="margin-top:3px">${esc(mp.reason)}</div>`:""}
      </div>`;
    p.style.display="block";
    const r=anchor.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
    let left=r.right+10,top=r.top;
    if(left+w>innerWidth-12)left=Math.max(12,r.left-w-10);
    if(top+h>innerHeight-12)top=Math.max(12,innerHeight-h-12);
    p.style.left=left+"px";p.style.top=top+"px";
  }
  function hidePopover(){$("popover").style.display="none"}

  function openModal(body){
    $("modalContent").innerHTML=body;$("modalBackdrop").classList.add("in");$("modal").classList.add("in");
  }
  function closeModal(){$("modalBackdrop").classList.remove("in");$("modal").classList.remove("in")}

  function featureModal(fi=null){
    const m=state[active],f=fi===null?{name:"",why:"",monetization:"Средний. ",tasks:[]}:m.features[fi],mp=money(f.monetization);
    openModal(`<div class="modal-header"><h4 class="modal-title">${fi===null?"Добавить Ф-л":"Редактировать Ф-л"}</h4></div>
      <div class="modal-body">
        <div class="form-group"><label>Ф-л</label><input id="fName" class="form-control" value="${esc(f.name)}"></div>
        <div class="form-group"><label>Зачем / какую боль закрывает</label><textarea id="fWhy" class="form-control">${esc(f.why)}</textarea></div>
        <div class="form-group"><label>Перспектива монетизации</label><select id="fLevel" class="form-control">${["Высокий","Средний","Низкий"].map(x=>`<option ${x===mp.level?"selected":""}>${x}</option>`).join("")}</select></div>
        <div class="form-group"><label>Обоснование</label><textarea id="fReason" class="form-control">${esc(mp.reason)}</textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Отмена</button> <button class="btn btn-primary" data-modal="save-feature" data-fi="${fi===null?"":fi}">Сохранить</button></div>`)
  }
  function taskModal(fi,ti=null){
    const m=state[active],f=m.features[fi],t=ti===null?{number:"",status:"Планируется",title:""}:f.tasks[ti];
    const statuses=["Планируется","Backlog","Аналитика и проработка","Дизайн","Обсуждение и оценка DNM","Ждем согласования/оплаты/ДС","Очередь","В работе","Реализовано","Code review","На проверке постановщиком","Закрыто"];
    const opts=[...new Set([...statuses,t.status].filter(Boolean))];
    openModal(`<div class="modal-header"><h4 class="modal-title">${ti===null?"Добавить доработку":"Редактировать доработку"}</h4></div>
      <div class="modal-body">
        <div class="form-group"><label>Ф-л</label><select id="tFeature" class="form-control">${m.features.map((x,i)=>`<option value="${i}" ${i===fi?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
        <div class="form-group"><label>Номер задачи</label><input id="tNumber" class="form-control" value="${esc(t.number)}" placeholder="Например 55248"></div>
        <div class="form-group"><label>Статус</label><select id="tStatus" class="form-control">${opts.map(x=>`<option ${x===t.status?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
        <div class="form-group"><label>Доработка</label><textarea id="tTitle" class="form-control">${esc(t.title)}</textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Отмена</button> <button class="btn btn-primary" data-modal="save-task" data-fi="${fi}" data-ti="${ti===null?"":ti}">Сохранить</button></div>`)
  }
  function moduleModal(){
    const m=state[active];
    openModal(`<div class="modal-header"><h4 class="modal-title">Редактировать модуль</h4></div><div class="modal-body"><div class="form-group"><label>Название модуля</label><input id="mName" class="form-control" value="${esc(m.name)}"></div></div><div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Отмена</button> <button class="btn btn-primary" data-modal="save-module">Сохранить</button></div>`)
  }

  document.addEventListener("click",e=>{
    const a=e.target.closest("[data-action]");
    if(a){
      const act=a.dataset.action,fi=Number(a.dataset.fi),ti=Number(a.dataset.ti),key=`${active}:${fi}`;
      if(act==="toggle"){collapsed.has(key)?collapsed.delete(key):collapsed.add(key);render();return}
      if(act==="edit-feature"){featureModal(fi);return}
      if(act==="add-task"){taskModal(fi,null);return}
      if(act==="edit-task"){taskModal(fi,ti);return}
      if(act==="delete-task"&&confirm("Удалить доработку?")){state[active].features[fi].tasks.splice(ti,1);save();render();return}
      if(act==="delete-feature"&&confirm("Удалить Ф-л и все его доработки?")){state[active].features.splice(fi,1);save();render();return}
    }
    const b=e.target.closest("[data-modal]");
    if(!b)return;
    const act=b.dataset.modal;
    if(act==="cancel"){closeModal();return}
    if(act==="save-module"){
      const name=$("mName").value.trim();if(!name)return;
      state[active].name=name;save();closeModal();render();return
    }
    if(act==="save-feature"){
      const raw=b.dataset.fi,name=$("fName").value.trim();if(!name)return;
      const obj={name,why:$("fWhy").value.trim(),monetization:`${$("fLevel").value}. ${$("fReason").value.trim()}`.trim(),tasks:[]};
      if(raw==="")state[active].features.push(obj);else{const i=Number(raw);obj.tasks=state[active].features[i].tasks;state[active].features[i]=obj}
      save();closeModal();render();return
    }
    if(act==="save-task"){
      const oldFi=Number(b.dataset.fi),raw=b.dataset.ti,newFi=Number($("tFeature").value);
      const obj={number:$("tNumber").value.trim().replace(/^#/,""),status:$("tStatus").value,title:$("tTitle").value.trim()};if(!obj.title)return;
      if(raw==="")state[active].features[newFi].tasks.push(obj);else{const ti=Number(raw);if(oldFi===newFi)state[active].features[oldFi].tasks[ti]=obj;else{state[active].features[oldFi].tasks.splice(ti,1);state[active].features[newFi].tasks.push(obj)}}
      save();closeModal();render();return
    }
  });

  $("modalBackdrop").onclick=closeModal;
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
  $("searchInput").oninput=render;$("showClosed").onchange=render;
  window.addEventListener("resize",()=>requestAnimationFrame(drawNetworkArrows));
  $("editModuleBtn").onclick=moduleModal;$("addFeatureBtn").onclick=()=>featureModal(null);
  $("editToggle").onclick=()=>{editMode=!editMode;document.body.classList.toggle("edit-mode",editMode);$("editToggle").textContent=editMode?"Завершить":"Редактировать";$("editToggle").className="btn "+(editMode?"btn-default":"btn-primary")};

  function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),700)}
  $("exportJson").onclick=()=>download("DNM_карта_развития.json",JSON.stringify(state,null,2),"application/json;charset=utf-8");
  $("exportCsv").onclick=()=>{
    const rows=[["Продукт","Ф-л","Зачем / какую боль закрывает","Перспектива монетизации","Доработки"]];
    state.forEach(m=>m.features.forEach(f=>f.tasks.forEach(t=>rows.push([m.name,f.name,f.why,f.monetization,taskText(t)]))));
    const quote=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    download("DNM_карта_развития.csv","\ufeff"+rows.map(r=>r.map(quote).join(";")).join("\r\n"),"text/csv;charset=utf-8")
  }
  $("importJsonBtn").onclick=()=>$("importJson").click();
  $("importJson").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!Array.isArray(x))throw 0;state=x;active=0;save();render()}catch(err){alert("Ожидается JSON, экспортированный этой страницей.")}e.target.value=""}
  $("resetBtn").onclick=()=>{if(confirm("Вернуть исходные данные из Excel?")){state=clone(initial);active=0;localStorage.removeItem(STORAGE_KEY);$("saveState").textContent="Исходные данные";render()}}

  try {
    render();
  } catch (err) {
    console.error(err);
    const host=document.getElementById("featureRows");
    if(host){
      host.innerHTML='<div class="alert alert-danger"><strong>Ошибка загрузки карты.</strong> Перезагрузите страницу. Если ошибка повторяется, используйте новую версию файла.</div>';
    }
  }
})();
</script>
</body>
</html>

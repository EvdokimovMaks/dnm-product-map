<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INFOTECH DNM — карта развития продуктов</title>
<style>
:root{
  --ink:#202936;
  --muted:#6F7E8E;
  --soft:#9CA9B6;
  --line:#DCE4EA;
  --line-strong:#B8C6D1;
  --paper:#FFFFFF;
  --canvas:#F4F7FC;
  --panel:#EEF3F6;
  --blue:#139FEA;
  --blue-deep:#0E79B2;
  --blue-soft:#EAF7FD;
  --green:#3DDC4A;
  --green-deep:#238B31;
  --green-soft:#EFFBEF;
  --red:#D95B68;
  --red-soft:#FFF0F2;
  --amber:#D59628;
  --amber-soft:#FFF6DE;
  --focus:#0094FF;
  --sidebar:276px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--blue-deep)}
:focus-visible{outline:3px solid rgba(0,148,255,.28);outline-offset:2px}

/* INFOTECH brand */
.brandbar{height:4px;display:grid;grid-template-columns:1.15fr 1fr .85fr .7fr}
.brandbar span:nth-child(1){background:#139FEA}
.brandbar span:nth-child(2){background:#29B6F3}
.brandbar span:nth-child(3){background:#48DD4B}
.brandbar span:nth-child(4){background:#238B31}
.infotech-mark{display:flex;align-items:center;gap:12px;min-width:0}
.infotech-word{font-size:18px;letter-spacing:.18em;font-weight:700;color:#4F5E6D;white-space:nowrap}
.infotech-bars{display:flex;gap:3px;transform:skewX(-18deg)}
.infotech-bars i{display:block;width:15px;height:6px}
.infotech-bars i:nth-child(1){background:#139FEA}.infotech-bars i:nth-child(2){background:#29B6F3}
.infotech-bars i:nth-child(3){background:#48DD4B}.infotech-bars i:nth-child(4){background:#238B31}

/* Bootstrap-like common UI components, styled to INFOTECH */
.btn{display:inline-block;padding:7px 12px;margin-bottom:0;font-size:13px;font-weight:400;line-height:1.42857143;text-align:center;white-space:nowrap;vertical-align:middle;touch-action:manipulation;border:1px solid transparent;border-radius:3px;background-image:none}
.btn-default{color:#4F5E6D;background:#fff;border-color:#CCD6DE}.btn-default:hover{background:#F5F7F9;border-color:#A8B7C3}
.btn-primary{color:#fff;background:var(--blue-deep);border-color:#086892}.btn-primary:hover{background:#086A9E}
.btn-danger{color:#B13C48;background:#fff;border-color:#E7B1B8}.btn-danger:hover{background:var(--red-soft)}
.btn-xs{padding:2px 7px;font-size:12px;line-height:1.5;border-radius:2px}
.btn-group{display:inline-flex;vertical-align:middle}.btn-group>.btn{border-radius:0}.btn-group>.btn:first-child{border-radius:3px 0 0 3px}.btn-group>.btn:last-child{border-radius:0 3px 3px 0}.btn-group>.btn+.btn{margin-left:-1px}
.label{display:inline;padding:.24em .55em;font-size:10px;font-weight:700;line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:baseline;border-radius:2px}
.label-default{background:#7E8C9B}.label-primary{background:var(--blue-deep)}.label-success{background:var(--green-deep)}.label-info{background:#139FEA}.label-warning{background:#D59628}.label-danger{background:var(--red)}
.badge{display:inline-block;min-width:10px;padding:3px 7px;font-size:11px;font-weight:700;line-height:1;color:#fff;text-align:center;white-space:nowrap;vertical-align:middle;background:#6F7E8E;border-radius:10px}
.nav{padding-left:0;margin-bottom:0;list-style:none}.nav>li{position:relative;display:block}.nav>li>a{position:relative;display:block;text-decoration:none}
.nav-pills>li>a{border-radius:2px}.nav-stacked>li+li{margin-top:2px}
.panel{margin-bottom:16px;background:#fff;border:1px solid transparent;border-radius:2px}
.panel-default{border-color:var(--line)}.panel-heading{padding:10px 12px;border-bottom:1px solid transparent;border-radius:1px 1px 0 0}
.panel-default>.panel-heading{color:var(--ink);background:#F7F9FB;border-color:var(--line)}
.panel-body{padding:12px}.panel-title{margin:0;font-size:14px;font-weight:700}
.list-group{padding-left:0;margin:0}.list-group-item{position:relative;display:block;padding:10px 12px;margin-bottom:-1px;background:#fff;border:1px solid var(--line)}
.list-group-item:first-child{border-top-left-radius:2px;border-top-right-radius:2px}.list-group-item:last-child{margin-bottom:0;border-bottom-left-radius:2px;border-bottom-right-radius:2px}
.input-group{position:relative;display:table;border-collapse:separate}.input-group-addon,.form-control{display:table-cell}
.input-group-addon{width:1%;white-space:nowrap;vertical-align:middle;padding:7px 10px;font-size:13px;color:#5E6D7C;background:#EEF3F6;border:1px solid #C7D2DB;border-right:0;border-radius:3px 0 0 3px}
.form-control{width:100%;height:34px;padding:6px 10px;font-size:13px;line-height:1.42857143;color:#344151;background:#fff;border:1px solid #C7D2DB;border-radius:3px;box-shadow:inset 0 1px 1px rgba(0,0,0,.025)}
.input-group .form-control{border-radius:0 3px 3px 0}
.form-control:focus{border-color:#66AFE9;outline:0;box-shadow:0 0 0 2px rgba(19,159,234,.12)}
.alert{padding:10px 12px;margin-bottom:14px;border:1px solid transparent;border-radius:2px}.alert-info{color:#0C658F;background:#EAF7FD;border-color:#B6E0F3}.alert-danger{color:#9B3440;background:#FFF0F2;border-color:#E9B7BE}
.popover{position:fixed;z-index:1060;display:none;width:430px;max-width:calc(100vw - 28px);padding:1px;text-align:left;white-space:normal;background:#fff;border:1px solid #AEBCC7;border-radius:3px;box-shadow:0 7px 18px rgba(32,41,54,.16)}
.popover-title{padding:9px 12px;margin:0;font-size:13px;font-weight:700;background:#F7F9FB;border-bottom:1px solid var(--line)}
.popover-content{padding:11px 12px;font-size:12px;line-height:1.5;color:#4F5E6D}
.modal-backdrop{position:fixed;inset:0;background:rgba(32,41,54,.45);z-index:1040;display:none}
.modal-backdrop.in{display:block}
.modal{position:fixed;z-index:1050;inset:0;display:none;overflow:auto;padding:38px 16px}
.modal.in{display:block}.modal-dialog{width:min(650px,100%);margin:0 auto}
.modal-content{position:relative;background:#fff;border:1px solid rgba(0,0,0,.18);border-radius:3px;box-shadow:0 8px 28px rgba(32,41,54,.22)}
.modal-header,.modal-footer{padding:13px 15px;border-bottom:1px solid var(--line)}.modal-footer{border-top:1px solid var(--line);border-bottom:0;text-align:right}
.modal-title{margin:0;font-size:17px}.modal-body{padding:15px}
.form-group{margin-bottom:13px}.form-group label{display:block;max-width:100%;margin-bottom:5px;font-weight:700;font-size:12px;color:#536273}
textarea.form-control{height:auto;min-height:90px;resize:vertical}

/* App shell */
.topbar{height:67px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;z-index:40}
.topbar-inner{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 18px;gap:18px}
.product-title{min-width:0;display:flex;align-items:baseline;gap:12px}
.product-title h1{font-size:18px;margin:0;font-weight:700;color:var(--ink);white-space:nowrap}
.product-title small{font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.save-state{font-size:11px;color:var(--muted)}

.module-tabsbar{
  position:sticky;top:67px;z-index:35;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 2px 5px rgba(32,41,54,.035)
}
.module-tabs-inner{display:flex;align-items:center;gap:14px;padding:9px 18px;min-width:0}
.module-tabs-heading{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:12px;color:#536273;font-weight:700}
.module-nav-wrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;flex:1;padding-bottom:1px}
.modules-horizontal{display:flex;gap:4px;min-width:max-content}
.modules-horizontal>li{display:block}
.modules-horizontal>li>a{
  padding:7px 11px;color:#4F5E6D;border:1px solid transparent;background:#fff;
  font-size:12px;line-height:1.2;border-radius:3px
}
.modules-horizontal>li>a:hover{background:#F4F7FC;border-color:#DCE4EA;color:var(--ink)}
.modules-horizontal>li.active>a{
  background:#EAF7FD;color:#0E79B2;border-color:#A9DDF4;font-weight:700
}
.modules-horizontal .badge{margin-left:5px;background:#C8D5DE;color:#445360}
.modules-horizontal li.active .badge{background:#139FEA;color:#fff}

.shell{min-height:calc(100vh - 112px)}
.main{min-width:0;padding:18px 24px 52px;max-width:1760px;margin:0 auto}
.module-header{display:flex;gap:16px;align-items:center;justify-content:flex-end;margin-bottom:12px}
.module-header-title{display:none}
.module-meta{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;width:100%}
.searchbox{width:min(440px,46vw)}
.summary-strip{display:flex;gap:18px;align-items:center;padding:9px 0 13px;border-bottom:1px solid var(--line);margin-bottom:16px;color:#5B6674;font-size:12px;flex-wrap:wrap}
.summary-strip strong{color:var(--ink);font-size:14px}.summary-strip .sep{width:1px;height:22px;background:var(--line)}
.legend{display:flex;gap:12px;margin-left:auto;align-items:center;font-size:11px;color:#758493}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}.legend .planned{background:#139FEA}.legend .done{background:#9CA9B6}
.progress{height:7px;margin:0;overflow:hidden;background:#E4EAF0;border-radius:2px;width:140px;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.progress-bar{float:left;width:0;height:100%;font-size:9px;line-height:7px;color:#fff;text-align:center;background:#139FEA;transition:width .25s ease}
.progress-bar-success{background:#3DDC4A}

/* Network map */
.network-board{
  position:relative;padding:8px 0 34px;min-height:420px;overflow:visible
}
.network-svg{
  position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible
}
.network-root-wrap{position:relative;z-index:2;display:flex;justify-content:center;margin:6px 0 58px}
.network-root{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:15px 28px;background:#fff;border:1px solid #8FB4C9;border-top:4px solid #139FEA;
  min-width:340px;max-width:720px;box-shadow:0 3px 9px rgba(32,41,54,.06)
}
.network-root .root-title{font-size:18px;font-weight:700;line-height:1.2}
.network-root .root-kicker{font-size:10.5px;color:var(--muted);margin-top:4px}
.feature-grid{
  position:relative;z-index:2;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:28px 24px;align-items:start
}
.feature-row{
  position:relative;display:flex;flex-direction:column;min-width:0;gap:8px
}
.feature-panel{margin:0;transition:border-color .12s;background:#fff;position:relative}
.feature-panel:before{
  content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #139FEA;z-index:3
}
.feature-panel:hover{border-color:#88BFD9}
.feature-panel .panel-heading{background:#fff;padding:11px 12px;border-bottom:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.feature-panel .panel-title{font-size:14px;line-height:1.3}
.feature-panel .panel-body{padding:3px 12px 11px}
.feature-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.feature-actions{display:none;gap:4px;white-space:nowrap;align-items:center}.edit-mode .feature-actions{display:flex}
.drag-grip{display:none;color:#8393A1;font-size:16px;line-height:1;cursor:grab;user-select:none;padding:0 3px}
.edit-mode .drag-grip{display:inline-block}
.edit-mode .feature-panel[draggable="true"]{cursor:grab}
.edit-mode .feature-panel[draggable="true"]:active,.edit-mode .drag-grip:active{cursor:grabbing}
.feature-row.dragging{opacity:.38}
.feature-row.drag-over .feature-panel{outline:2px solid #139FEA;outline-offset:4px}
.feature-row.drag-before .feature-panel:after,
.feature-row.drag-after .task-column:after{
  content:"";position:absolute;left:0;right:0;height:3px;background:#139FEA;z-index:5
}
.feature-row.drag-before .feature-panel:after{top:-15px}
.feature-row.drag-after .task-column{position:relative}
.feature-row.drag-after .task-column:after{bottom:-14px}
.task-column{min-width:0}
.task-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;min-height:24px}
.task-toolbar .count{font-size:11px;color:#7A8997}
.task-list.collapsed{display:none}
.task-item{padding:9px 90px 9px 11px;min-height:38px;line-height:1.35;font-size:12px;color:#364453}
.task-item.closed{background:#F5F7F9;color:#778391}
.task-item .task-id{font-weight:700;color:#0E79B2;margin-right:5px}
.task-item.closed .task-id{color:#7B8997}
.task-item .status{margin-right:6px}
.task-actions{position:absolute;right:7px;top:6px;display:none;gap:3px}.edit-mode .task-actions{display:flex}
.empty-tasks{padding:12px;color:#82909D;font-size:12px;border:1px dashed #C9D5DE;background:#FAFBFC}
.add-task{display:none;width:100%;margin-top:7px;border-style:dashed}.edit-mode .add-task{display:block}
.add-feature-wrap{position:relative;z-index:3;text-align:center;margin-top:24px}
.add-feature{display:none}.edit-mode .add-feature{display:inline-block}.edit-mode .add-feature{display:inline-block}
.edit-module{display:none}.edit-mode .edit-module{display:inline-block}
.drag-help{display:none;margin:0 auto 14px;max-width:620px;text-align:center;color:#536273;background:#fff;border:1px solid #DCE4EA;padding:8px 12px;border-radius:3px}.edit-mode .drag-help{display:block}
.no-results{padding:38px 15px;color:#6F7E8E;text-align:center;border:1px dashed #C9D5DE;background:#fff}

.popover .money-block{padding:8px 9px;background:#F4F7FC;border-left:3px solid #139FEA;margin-top:9px}
.popover .money-block.high{background:#EFFBEF;border-color:#3DDC4A}.popover .money-block.low{background:#F3F5F7;border-color:#9CA9B6}
.popover .field-name{font-size:10px;font-weight:700;color:#7B8997;margin-bottom:4px}
.popover .value{color:#354252}
.popover .money-value{font-weight:700}

/* Small screens */
@media(max-width:1100px){
  .product-title small{display:none}
  .feature-grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .network-root{min-width:300px}
}
@media(max-width:760px){
  .topbar{height:auto;position:static}.topbar-inner{align-items:flex-start;padding:12px;flex-direction:column}
  .toolbar{justify-content:flex-start}.save-state{display:none}
  .module-tabsbar{position:static}.module-tabs-inner{padding:8px 10px;align-items:flex-start;flex-direction:column;gap:6px}
  .module-tabs-heading{display:none}.module-nav-wrap{width:100%}
  .main{padding:12px 10px 40px}.module-header{justify-content:flex-start}.header-actions{justify-content:flex-start}
  .searchbox{width:100%}.summary-strip{gap:10px}.legend{margin-left:0;width:100%}
  .network-root-wrap{margin-bottom:45px}.network-root{min-width:0;width:100%;max-width:100%}
  .feature-grid{grid-template-columns:1fr;gap:24px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.nav-tabs{border-bottom:1px solid var(--line);display:flex;gap:0;margin:0 0 18px}
.nav-tabs>li{margin-bottom:-1px}
.nav-tabs>li>a{padding:9px 14px;color:#5B6977;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;font-size:12.5px}
.nav-tabs>li>a:hover{background:#F5F8FA;color:var(--ink)}
.nav-tabs>li.active>a{color:#0E79B2;background:#fff;border-color:var(--line);border-bottom-color:#fff;font-weight:700}
.view-hidden{display:none!important}
.product-description{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:30px}
.product-description-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.product-description-head h3{margin:0 0 4px;font-size:18px}
.product-description-head p{margin:0;color:var(--muted);font-size:11px}
.description-edit{display:none}.edit-mode .description-edit{display:inline-block}
.description-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.desc-section{border:1px solid var(--line);background:#FAFCFD;padding:13px 14px;min-width:0}
.desc-section.functional{grid-column:1/-1}
.desc-section h4{margin:0 0 8px;font-size:12px;color:#0E79B2}
.desc-section .desc-text{white-space:pre-line;color:#3F4C59;line-height:1.55;font-size:12.5px}
.description-source{margin-top:12px;color:#8A97A4;font-size:10.5px}
@media(max-width:760px){.description-grid{grid-template-columns:1fr}.desc-section.functional{grid-column:auto}}


/* v8 overrides */
.save-state{display:none}
.module-tabs-heading{display:none}
.modules-horizontal{gap:8px;padding:2px 0}
.modules-horizontal>li>a,.nav-tabs>li>a{
  border:1px solid #7E8FCF!important;background:#fff!important;color:#5F70B4!important;
  border-radius:0!important;padding:10px 16px!important;font-weight:400!important
}
.modules-horizontal>li>a:hover,.nav-tabs>li>a:hover{background:#F6F8FF!important;color:#5062AD!important}
.modules-horizontal>li.active>a,.nav-tabs>li.active>a{
  background:#EDF1FF!important;color:#5062AD!important;border-color:#7E8FCF!important;font-weight:700!important
}
.modules-horizontal .badge{display:none}
.nav-tabs{border-bottom:0;display:flex;gap:0;margin:0 0 18px}
.btn-primary{background:#6D78B8;border-color:#5F6AAD}
.btn-primary:hover{background:#5F6AAD;border-color:#5560A5}
.actions-dropdown{position:relative}
.actions-menu{
  position:absolute;right:0;top:calc(100% + 8px);display:none;min-width:240px;background:#fff;border:1px solid var(--line);
  box-shadow:0 12px 28px rgba(32,41,54,.12);z-index:70;padding:6px 0
}
.actions-dropdown.open .actions-menu{display:block}
.actions-item{display:block;width:100%;text-align:left;background:transparent;border:0;padding:10px 14px;color:#41515F;font-size:13px}
.actions-item:hover{background:#F5F8FA}
.actions-item.danger{color:#B34B57}
.actions-divider{height:1px;background:var(--line);margin:5px 0}
.module-header{margin-bottom:10px}
.header-actions{gap:8px}
.summary-strip{display:block;padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.summary-progress-wrap{max-width:1180px}
.summary-progress-labels{position:relative;height:24px;margin-bottom:8px;font-size:13px;color:#4F5E6D}
.summary-progress-label{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;font-weight:700}
.summary-progress-label.planned{color:#6E717A}
.summary-progress-label.inwork{color:#5A67AE}
.summary-progress-label.closed{color:#5E9F44}
.summary-progress{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#D8D8D8}
.summary-progress-segment{height:100%}
.summary-progress-segment.planned{background:#CFCFCF}
.summary-progress-segment.inwork{background:#6D78B8}
.summary-progress-segment.closed{background:#97BF6D}
.legend{display:none!important}
.root-kicker{display:none}
.network-root-wrap{margin-top:2px}
.feature-panel .panel-body{padding:5px 12px 12px}
.desc-section.users,.desc-section.beneficiaries{grid-column:span 1}
.description-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.description-grid .desc-section.functional{grid-column:1 / -1}
@media(max-width:760px){
  .summary-progress-labels{font-size:11px}
  .actions-menu{left:0;right:auto}
  .description-grid{grid-template-columns:1fr}
}


/* v9: dsf-common-ui chips / counters / alert-info */

/* CHIP */
.label{
  display:inline-flex;align-items:center;justify-content:center;
  padding:4px 10px;
  min-height:25px;
  border-radius:14px;
  border:1px solid transparent;
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}

/* label-default: светлый нейтральный чип из базовой группы */
.label-default{
  color:#30343A;
  background:#FFFFFF;
  border-color:#D8DDE2;
}

/* label-primary: основной сине-фиолетовый чип */
.label-primary{
  color:#FFFFFF;
  background:#7886C4;
  border-color:#6F7DBC;
}

/* label-success */
.label-success{
  color:#FFFFFF;
  background:#93C465;
  border-color:#82B455;
}

/* label-yellow */
.label-yellow{
  color:#343434;
  background:#F0D55C;
  border-color:#D8BC46;
}

/* label-grey2 */
.label-grey2{
  color:#404348;
  background:#DEDEDE;
  border-color:#CDCDCD;
}

.label-info{
  color:#6978B8;
  background:#EEF1FC;
  border-color:#D7DDF3;
}

.label-warning{
  color:#4D4424;
  background:#E2C454;
  border-color:#CFB140;
}

.label-danger{

<script id="productDescriptions" type="application/json">{"Анализ трафика": {"users": "Региональный менеджер и маркетинг дистрибьютора, менеджер и оператор контакт-центра дилера.", "beneficiaries": "Дистрибьютор, руководство дилера.", "area": "Обработка и контроль лидов в LMS, анализ качества входящего трафика и фактической работы дилера с обращениями клиентов.", "functional": "DNM фиксирует звонки по лидам. ИИ переводит записи разговоров в текст, формирует краткую выжимку и проводит комплексный анализ качества работы дилера и качества самого лида.", "benefits": "Дистрибьютор получает подтверждение фактической обработки лида, видит качество трафика и источники накрутки, выявляет фальсификации результатов, контролирует стандарты, обогащает данные по клиенту и выявляет недовольство. Дилер получает инструмент для выявления сотрудников, которые некорректно обрабатывают лиды. Без модуля растут потери времени на спам-лиды, снижается конверсия и сложнее выявлять системное недовольство клиентов.", "competitors": "Calltouch: транскрибация и оценка звонков по чек-листу.", "usp": "DNM анализирует не только звонок и чек-лист, но и данные рабочего листа, выполняет скоринг лида на спам и формирует анкету звонка. Можно сопоставить результат, указанный дилером, с результатом, определённым по разговору. В продуктовом плане отдельно отмечен маскинг номеров вместо сценария обратного звонка."}, "Автопроверка": {"users": "Сотрудники дистрибьютора, проверяющие заявки и документы; дилерские пользователи, загружающие документы; юридические и маркетинговые подразделения; сотрудники, работающие с СОПД.", "beneficiaries": "Дистрибьютор, дилеры, юридическая служба, сотрудники сети, клиенты в части корректного документооборота и СОПД.", "area": "Автоматическая проверка документов и данных в процессах компенсаций, маркетинговых размещений и мероприятий, гарантийных ремонтов, а также сбор, проверка и хранение СОПД и согласий на коммуникацию по дилерской сети.", "functional": "Для заявок на компенсацию система автоматически запускает проверку на заданном этапе: распознаёт документы через OCR, сохраняет данные в JSON, сверяет данные системы с документами, при необходимости извлекает дополнительные поля и использует ИИ для проверки каждого пункта чек-листа. Ошибочная заявка возвращается дилеру либо уходит на ручную перепроверку. Дистрибьютор видит статусы, причины отклонений и аналитику.\n\nДля СОПД дистрибьютор задаёт единую форму, дилер формирует и подписывает анкету, загружает скан, QR связывает скан с электронной анкетой, а ИИ проверяет данные, отметки согласий и подпись. Результат сохраняется в карточке клиента.", "benefits": "Для дистрибьютора: контроль документов на 100% заявок, снижение ручной нагрузки и ФОТ, уменьшение человеческого фактора и фрода, единый стандарт документооборота, снижение юридических рисков и прозрачность причин отклонений. Для дилера: более быстрое согласование, понятные требования и ошибки, меньше возвратов и задержек выплат. В СОПД дополнительно: единое хранилище, переиспользование согласий между ДЦ и снижение ручного ввода.", "competitors": "Авто.ру, Автохаб; для маркетинговой проверки — также маркетинговые агентства, выполняющие контроль вручную. Для части сервисных и СОПД-сценариев в продуктовом плане прямой полноценный аналог не указан.", "usp": "Цена 3 000–5 000 руб. в зависимости от объёма; по отзывам клиентов — более высокое качество проверки; прозрачный результат по каждому критерию вместо общего комментария; встроенность в бизнес-процесс DNM и связанные модули; возможность автоматически возвращать заявку; гибкая настройка отдельного алгоритма под каждый критерий."}, "AI-ассистент мастера приёмщика": {"users": "Сервисный консультант, мастер-приёмщик.", "beneficiaries": "Дилер, дистрибьютор, сервисное подразделение, клиент за счёт более персонализированного обслуживания.", "area": "Послепродажное обслуживание и удержание клиентов: подготовка к встрече или звонку, планирование ТО, работа с невыполненными рекомендациями, информирование о сервисных кампаниях и персонализированные допродажи.", "functional": "Модуль собирает по VIN историю заказ-нарядов, пробеги, гарантийные обращения, рекомендации, кампании и другие данные. Затем оценивает профиль и лояльность клиента, прогнозирует следующий визит, выделяет критичные невыполненные рекомендации, проверяет сервисные кампании и формирует персонализированные предложения. На выходе создаётся структурированный брифинг с готовыми подсказками для разговора.", "benefits": "Дилер экономит время мастера, повышает средний чек за счёт рекомендаций и дополнительных услуг, персонализирует визит и снижает зависимость от опыта конкретного сотрудника. Дистрибьютор получает единый стандарт приёма по сети, более своевременную работу с сервисными кампаниями и более единый клиентский опыт.", "competitors": "В продуктовом плане прямые аналоги не выявлены.", "usp": "Отдельный блок УТП в продуктовом плане не заполнен. В описании продукта акцент сделан на автоматическом анализе полной истории автомобиля и клиента и формировании готового персонального брифинга для мастера."}, "Модуль обучения": {"users": "Отдел обучения / HR / бизнес-академия импортёра, руководители направлений, ответственные за обучение в ДЦ, руководители отделов, сотрудники дилерской сети.", "beneficiaries": "Дистрибьютор, дилеры, сотрудники сети, руководители направлений и HR.", "area": "Обучение, аттестация и развитие сотрудников дилерской сети в онлайн- и офлайн-форматах, включая KPI и сертификацию.", "functional": "Импортёр создаёт курсы, тесты и материалы, формирует сертификационные пути и планы обучения по должностям. Онлайн-курсы могут назначаться автоматически по роли и должности. Очные мероприятия используют отдельный процесс регистрации. Сотрудник проходит материалы и тесты, система фиксирует результаты, рассчитывает KPI и формирует отчётность, а импортёр видит аналитику по дилерам, сотрудникам и курсам.", "benefits": "Для дистрибьютора: повышение качества работы сети, снижение потерь от ошибок сотрудников, уменьшение затрат на обучение и ручное администрирование, единая статистика и прозрачность KPI, быстрый запуск обучения на всю сеть и аудит актуальности пользователей. Для дилера: снижение затрат на обучение и адаптацию, удобная запись на тренинги и быстрый доступ к материалам. Для сотрудника: понятный путь развития и прозрачные требования.", "competitors": "Mirapolis, iSpring.", "usp": "Персонал уже ведётся в DNM — не нужна отдельная синхронизация пользователей; гибкая схема оплаты; нет лимита пользователей; поддержка дилера и импортёра; более короткие сроки доработок; аудит пользователей по корпоративной почте; автоматический сбор статистики по вебинарам; результаты обучения находятся в одной системе с рабочими показателями персонала."}, "База знаний + ИИ": {"users": "Механики, мастера-консультанты, диагносты, РОПы, продавцы, HR, бренд- и региональные менеджеры.", "beneficiaries": "Дистрибьютор, дилеры, сотрудники сервиса и продаж, HR и обучение.", "area": "Техническая поддержка дилеров, гарантийное и постгарантийное обслуживание, обучение сотрудников и контроль корпоративных политик и регламентов.", "functional": "Дистрибьютор загружает документы в DNM, назначает теги и права доступа. Сервис распознаёт и индексирует содержимое в RAG-движке, а устаревшие версии деиндексируются. Пользователь задаёт вопрос естественным языком; система определяет контекст, применяет фильтры по модели, разделу и ACL и формирует ответ на основе разрешённых документов с обязательными ссылками на конкретные страницы источников.", "benefits": "Дистрибьютор обеспечивает работу по актуальным регламентам, разграничивает доступ к чувствительной информации и сокращает трудозатраты на onboarding. Дилер быстрее находит нужные инструкции, снижает риск ошибок из-за устаревших документов и работает в привычном интерфейсе DNM без отдельного софта.", "competitors": "Облачные ИИ с загрузкой документов; YandexGPT + Vector Search.", "usp": "RAG-поиск встроен в экосистему дистрибьютора и дилера, понимает бизнес-контекст, бренды и модели, учитывает сложные теги и права пользователей. Ответ ограничен корпоративной базой и подкрепляется точной ссылкой на первоисточник."}, "Модуль рассылок для дилеров": {"users": "Маркетинг, бренд- и CRM-менеджеры дистрибьютора и дилера.", "beneficiaries": "Дистрибьютор, дилеры, маркетинговые подразделения, клиенты за счёт более корректных и согласованных коммуникаций.", "area": "Дилерский маркетинг и контроль маркетинговых стандартов дистрибьютором. Дилер запускает массовые рассылки по своей клиентской базе после модерации брендом.", "functional": "DNM/CRM дедублицирует клиентские данные и формирует «золотую карточку клиента» с актуальным согласием на коммуникацию. Дилер создаёт письмо в визуальном конструкторе на базе утверждённых материалов, отправляет его на согласование по workflow, а после одобрения запускает рассылку по согласованному сегменту.", "benefits": "Дистрибьютор контролирует соответствие писем стандартам бренда и видит активность дилеров по сети. Дилер получает более чистую базу без дублей, профессиональные шаблоны и работу только с подтверждёнными согласиями. Это снижает репутационные и юридические риски и повышает качество коммуникаций.", "competitors": "Маркетинговые агентства; Unisender; Mindbox.", "usp": "Не только отправка писем, а замкнутый процесс: дедубликация клиента в DNM, работа с согласиями, конструктор, брендовые материалы и workflow согласования с дистрибьютором."}, "Мобильное приложение DNM/CRM": {"users": "Менеджеры по продажам, мастера-приёмщики, сервисные консультанты, склад, руководители, региональные менеджеры, аудиторы.", "beneficiaries": "Дистрибьютор, дилеры, сотрудники фронт-офиса и сервиса, аудиторы и руководители.", "area": "Продажи, сервис, складской учёт и контроль качества: лиды и рабочие листы, приёмка и заказ-наряды, история по VIN, чек-листы и PDI.", "functional": "Мобильное PWA-приложение является продолжением DNM/CRM и показывает доступные пользователю модули по его правам. Интегрированная телефония работает через Voximplant, а при звонке система автоматически открывает связанный бизнес-контекст: лид, рабочий лист, заказ-наряд или историю по VIN. В полях можно заполнять чек-листы, фиксировать фото и PDI с мгновенной синхронизацией с основной системой.", "benefits": "Дистрибьютор получает мобильный доступ к сквозной истории и контролю стандартов по сети. Дилер сокращает перемещения к стационарному ПК, вводит данные непосредственно у автомобиля или клиента, получает контекст при звонке и работает в одном мобильном окне вместо разрозненных инструментов.", "competitors": "Мобильные софтфоны — без бизнес-контекста DNM. В продуктовом плане полноценный мобильный аналог CRM для автодистрибьютора и дилера, интегрированный во все процессы, не указан; теоретическая альтернатива — дорогое кастомное приложение ДЦ через API.", "usp": "Мобильное приложение является прямым продолжением CRM/DNM, а не отдельным инструментом. Оно объединяет продажи, сервис, склад и аудит, а телефония автоматически определяет контекст клиента и открывает нужную сущность системы."}, "Умный центр диалогов": {"users": "В продуктовом плане не заполнено.", "beneficiaries": "В продуктовом плане не заполнено.", "area": "В продуктовом плане не заполнено.", "functional": "В продуктовом плане не заполнено.", "benefits": "В продуктовом плане не заполнено.", "competitors": "В продуктовом плане не заполнено.", "usp": "В продуктовом плане не заполнено."}, "Контакт-центр (CRM)": {"users": "Операторы контакт-центра, менеджеры, ресепшн; маркетинг и руководители используют аналитику.", "beneficiaries": "Дилер, дистрибьютор, контакт-центр, маркетинг, руководители подразделений.", "area": "Обработка входящего трафика и коммуникаций с клиентами в едином контуре: звонки, чаты и заявки.", "functional": "Лиды создаются автоматически из входящих каналов, фиксируется источник. Для чатов предусмотрена автоматизация: автоответы, автоматическое закрытие при отсутствии ответа и дальнейшее развитие AI-коммуникаций. Ответственные обрабатывают лиды и переписку, а DNM формирует статистику по источникам, подразделениям, отказам и обработке обращений.", "benefits": "Дилер снижает потери обращений, повышает эффективность обработки и получает более прозрачную картину входящего трафика. Продуктовый план отдельно фиксирует проблему разрыва между маркетинговой аналитикой и реальными рабочими листами, а также стоимость потерянных целевых обращений.", "competitors": "Бачата, Talk-me, Callibri, Chat2desk, Wazzup; электронная почта для заявок; Calltouch в части статического коллтрекинга.", "usp": "Связка обращений с рабочими листами и клиентами DNM; единое окно для чатов, звонков и заявок; статический коллтрекинг на номерах телефонии клиента; более полные данные для аналитики; развитие автоматической обработки и маршрутизации трафика."}, "Предодобрение кредита Сбербанк в DNM": {"users": "Маркетинг дистрибьютора, менеджер дилера.", "beneficiaries": "Дистрибьютор, дилеры, клиенты в части ускорения кредитного процесса.", "area": "Обработка лидов в LMS и триггерные коммуникации с клиентом в кредитном сценарии.", "functional": "При создании лида DNM передаёт в Сбербанк номер телефона клиента, бренд и модель автомобиля. Банк возвращает предодобренный кредитный лимит, который отображается менеджеру в лиде; клиент при необходимости завершает оформление в приложении банка. Второй сценарий — триггерная коммуникация после сервисного визита при выполнении заданных условий.", "benefits": "В продуктовом плане этот раздел заполнен текстом, относящимся к контролю обработки лидов и анализу трафика: подтверждение фактической обработки лида, выявление фрода и качества источников, контроль стандартов. Для кредитного продукта блок требует отдельной актуализации.", "competitors": "В продуктовом плане указан Calltouch, однако этот блок по смыслу относится к «Анализу трафика» и требует актуализации для кредитного сценария.", "usp": "В продуктовом плане приведены преимущества анализа трафика: совместный анализ звонка и рабочего листа, спам-скоринг, сравнение результата дилера с разговором и маскинг номеров. Для предодобрения кредита отдельное УТП в источнике не сформулировано."}, "Модуль In-App продаж": {"users": "В продуктовом плане не заполнено.", "beneficiaries": "В продуктовом плане не заполнено.", "area": "Внутренний маркетплейс / витрина приложений и дополнительных сервисов внутри DNM/CRM.", "functional": "Зафиксированы гипотезы: витрина приложений и дополнительных сервисов внутри DNM/CRM, полная автоматизация процесса запроса/продажи, подтверждение заказа ЛПР заказчика, автоматический onboarding, отчёт по просмотрам, лидам и конверсии.", "benefits": "В продуктовом плане отдельный блок выгод пока не заполнен.", "competitors": "В продуктовом плане не заполнено.", "usp": "В продуктовом плане не заполнено."}, "Лид-расчет-рекомендации в ОП по клиенту записанному на сервис": {"users": "Сотрудники отдела продаж, работающие с клиентами, записанными на сервис.", "beneficiaries": "Дилер, отдел продаж, дистрибьютор.", "area": "Работа с клиентами, записанными на сервис, и поиск потенциала продажи / обмена автомобиля с передачей рекомендации в отдел продаж.", "functional": "ИИ анализирует будущую запись на сервис по вероятности обмена автомобиля на основе набора параметров и формирует индивидуальное коммерческое предложение с вариантами обмена на базе реального склада автомобилей.", "benefits": "В продуктовом плане указана гипотеза достижения конверсии до 1,5% от общего числа машино-заездов в месяц на старте за счёт более результативного подхода к клиенту.", "competitors": "В продуктовом плане не заполнено.", "usp": "В продуктовом плане отдельный блок УТП не заполнен."}, "Анализ оттока клиентов из сервиса": {"users": "Сотрудники сервисного подразделения дилера, сотрудники, работающие с удержанием клиентов.", "beneficiaries": "Исходный дилерский центр, дистрибьютор, сервисные подразделения.", "area": "Контроль и анализ клиентов, которые приезжают на обслу <script>
(function(){
  const STORAGE_KEY="infotech-dnm-product-map-v16";
  const REMOTE_API="/api/product-map";
  const AUTH_API="/api/auth";
  let remoteSaveTimer=null;
  let remoteSaving=false;
  let remoteLoadDone=false;

  const initial=JSON.parse(document.getElementById("initialData").textContent);
  const productDescriptions=JSON.parse(document.getElementById("productDescriptions").textContent);

  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const clone=v=>JSON.parse(JSON.stringify(v));
  const closed=t=>String(t.status||"").toLowerCase()==="закрыто";

  let appStarted=false;

  function showAuth(message=""){
    document.body.classList.add("auth-pending");
    $("authGate")?.classList.remove("is-hidden");
    if($("authError")) $("authError").textContent=message;
    setTimeout(()=>$("authPassword")?.focus(),0);
  }

  function unlockAuth(){
    document.body.classList.remove("auth-pending");
    $("authGate")?.classList.add("is-hidden");
    if($("authError")) $("authError").textContent="";
  }

  async function authStatus(){
    const response=await fetch(AUTH_API,{
      method:"GET",
      cache:"no-store",
      credentials:"same-origin"
    });
    let payload={};
    try{payload=await response.json()}catch(e){}
    if(response.status===503){
      throw new Error(payload.error||"Пароль доступа не настроен на сервере");
    }
    return response.ok && payload.authenticated===true;
  }

  async function loginWithPassword(password){
    const response=await fetch(AUTH_API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      cache:"no-store",
      credentials:"same-origin",
      body:JSON.stringify({password})
    });
    let payload={};
    try{payload=await response.json()}catch(e){}
    if(!response.ok){
      throw new Error(payload.error||"Неверный пароль");
    }
    return payload.authenticated===true;
  }

  async function logout(){
    try{
      await fetch(AUTH_API,{
        method:"DELETE",
        cache:"no-store",
        credentials:"same-origin"
      });
    }catch(e){}
    location.reload();
  }

  function startApp(){
    if(appStarted)return;
    appStarted=true;
    unlockAuth();
    bindScrollSync();
    render();
    loadRemoteState();
  }

  async function initAuth(){
    showAuth("");
    try{
      if(await authStatus()){
        startApp();
      }else{
        showAuth("");
      }
    }catch(err){
      console.error(err);
      showAuth(err.message||"Не удалось проверить доступ");
    }
  }

  function prioritizeModules(data){
    const priority=["Модуль обучения","Автопроверка"];
    const rank=name=>{
      const i=priority.indexOf(name);
      return i===-1 ? priority.length : i;
    };
    return data
      .map((item,index)=>({item,index}))
      .sort((a,b)=>{
        const ra=rank(a.item.name), rb=rank(b.item.name);
        return ra===rb ? a.index-b.index : ra-rb;
      })
      .map(x=>x.item);
  }

  function migrateState(data){
    data.forEach(m=>{
      (m.features||[]).forEach(f=>{
        if(m.name==="Модуль обучения" && f.name==="360 по сотруднику"){
          f.name="Отчетность: реализация 360 по сотруднику";
        }
        if(m.name==="Модуль обучения" && f.name==="Логика назначения курсов"){
          f.name="Оптимизация логики назначения курсов";
        }
        (f.tasks||[]).forEach(t=>{
          if(t.status==="Планируется") t.status="Планируется (нет задачи)";
        });
      });
    });
    return data;
  }

  function hydrateDescriptions(data){
    data.forEach(m=>{
      if(!m.description){
        m.description=clone(productDescriptions[m.name]||{
          users:"В продуктовом плане не заполнено.",
          beneficiaries:"В продуктовом плане не заполнено.",
          area:"В продуктовом плане не заполнено.",
          functional:"В продуктовом плане не заполнено.",
          benefits:"В продуктовом плане не заполнено.",
          competitors:"В продуктовом плане не заполнено.",
          usp:"В продуктовом плане не заполнено."
        });
      }
    });
    return data;
  }

  let state=prioritizeModules(hydrateDescriptions(migrateState(load())));
  let active=0;
  let viewMode="roadmap";
  let taskStageFilter=null;
  let dragContext=null;
  let justDragged=false;
  const collapsed=new Set();

  function areAllFeaturesCollapsed(){
    const features=state[active]?.features||[];
    return features.length>0 && features.every((_,i)=>collapsed.has(`${active}:${i}`));
  }

  function toggleAllFeatures(){
    const features=state[active]?.features||[];
    if(areAllFeaturesCollapsed()){
      features.forEach((_,i)=>collapsed.delete(`${active}:${i}`));
    }else{
      features.forEach((_,i)=>collapsed.add(`${active}:${i}`));
    }
    render();
  }

  function load(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed)&&parsed.length)return parsed;
      }
    }catch(e){}
    return clone(initial);
  }
  function saveLocal(){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      const status=$("saveState");
      if(status)status.textContent="Сохранено локально";
    }catch(e){
      const status=$("saveState");
      if(status)status.textContent="Не удалось сохранить локально";
    }
  }

  function setSaveState(text){
    const status=$("saveState");
    if(status)status.textContent=text;
  }

  async function putRemoteState(data){
    if(remoteSaving)return false;
    remoteSaving=true;
    try{
      const response=await fetch(REMOTE_API,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        cache:"no-store",
        body:JSON.stringify({data})
      });

      let payload={};
      try{ payload=await response.json(); }catch(e){}

      if(!response.ok){
        throw new Error(payload.error||"Ошибка серверного сохранения");
      }

      setSaveState(payload.unchanged?"Без изменений":"Сохранено");
      return true;
    }catch(err){
      console.error("Remote save failed",err);
      setSaveState("Сохранено только на этом устройстве");
      return false;
    }finally{
      remoteSaving=false;
    }
  }

  async function getVersionHistory(){
    const response=await fetch(`${REMOTE_API}?history=1`,{method:"GET",cache:"no-store"});
    let payload={};
    try{payload=await response.json()}catch(e){}
    if(!response.ok)throw new Error(payload.error||"Не удалось загрузить историю");
    return payload;
  }

  function formatVersionDate(value){
    if(!value)return "Дата неизвестна";
    const d=new Date(value);
    if(Number.isNaN(d.getTime()))return value;
    return d.toLocaleString("ru-RU",{
      day:"2-digit",month:"2-digit",year:"numeric",
      hour:"2-digit",minute:"2-digit",second:"2-digit"
    });
  }

  function versionStatsText(v){
    const parts=[];
    if(Number.isFinite(v.moduleCount))parts.push(`${v.moduleCount} мод.`);
    if(Number.isFinite(v.featureCount))parts.push(`${v.featureCount} функц.`);
    if(Number.isFinite(v.taskCount))parts.push(`${v.taskCount} дораб.`);
    return parts.join(" · ");
  }

  async function versionHistoryModal(){
    closeActionsMenu();
    openModal(`<div class="modal-header"><h4 class="modal-title">История версий</h4></div>
      <div class="modal-body"><div class="history-loading">Загрузка истории…</div></div>
      <div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Закрыть</button></div>`);

    try{
      const payload=await getVersionHistory();
      const current=payload.current;
      const history=Array.isArray(payload.history)?payload.history:[];
      const rows=[];

      if(current){
        rows.push(`<div class="history-row current">
          <div class="history-main">
            <div class="history-date">${esc(formatVersionDate(current.updatedAt))}</div>
            <div class="history-meta">Текущая версия${current.action==="rollback"?" · восстановлена из истории":""}${versionStatsText(current)?` · ${esc(versionStatsText(current))}`:""}</div>
          </div>
          <span class="label label-success">Текущая</span>
        </div>`);
      }

      history.forEach(v=>{
        rows.push(`<div class="history-row">
          <div class="history-main">
            <div class="history-date">${esc(formatVersionDate(v.updatedAt))}</div>
            <div class="history-meta">${v.action==="rollback"?"Откат":"Сохранение"}${versionStatsText(v)?` · ${esc(versionStatsText(v))}`:""}</div>
          </div>
          <button class="btn btn-default btn-xs" data-modal="rollback-version" data-version-id="${esc(v.id)}">Восстановить</button>
        </div>`);
      });

      $("modalContent").innerHTML=`<div class="modal-header"><h4 class="modal-title">История версий</h4></div>
        <div class="modal-body">
          <div class="history-note">Хранятся последние 30 изменённых версий. Перед откатом текущая версия автоматически попадает в историю.</div>
          <div class="history-list">${rows.join("")||'<div class="history-empty">История пока пуста.</div>'}</div>
        </div>
        <div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Закрыть</button></div>`;
    }catch(err){
      console.error(err);
      $("modalContent").innerHTML=`<div class="modal-header"><h4 class="modal-title">История версий</h4></div>
        <div class="modal-body"><div class="alert alert-danger">${esc(err.message||"Не удалось загрузить историю")}</div></div>
        <div class="modal-footer"><button class="btn btn-default" data-modal="cancel">Закрыть</button></div>`;
    }
  }

  async function rollbackVersion(versionId){
    if(!versionId)return;
    if(!confirm("Восстановить выбранную версию? Текущая версия останется в истории."))return;

    try{
      setSaveState("Восстановление…");
      const response=await fetch(REMOTE_API,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        cache:"no-store",
        body:JSON.stringify({action:"rollback",versionId})
      });

      let payload={};
      try{payload=await response.json()}catch(e){}
      if(!response.ok)throw new Error(payload.error||"Не удалось восстановить версию");
      if(!Array.isArray(payload.data))throw new Error("Сервер вернул некорректные данные");

      state=prioritizeModules(hydrateDescriptions(migrateState(payload.data)));
      active=0;
      saveLocal();
      closeModal();
      render();
      setSaveState("Версия восстановлена");
    }catch(err){
      console.error(err);
      alert(err.message||"Не удалось восстановить версию");
      setSaveState("Ошибка восстановления");
    }
  }

  function scheduleRemoteSave(){
    clearTimeout(remoteSaveTimer);
    remoteSaveTimer=setTimeout(()=>{
      putRemoteState(clone(state));
    },350);
  }

  function save(){
    saveLocal();
    scheduleRemoteSave();
  }

  async function loadRemoteState(){
    try{
      const response=await fetch(REMOTE_API,{method:"GET",cache:"no-store"});
      if(!response.ok)throw new Error("HTTP "+response.status);
      const payload=await response.json();

      if(Array.isArray(payload.data)&&payload.data.length){
        state=prioritizeModules(hydrateDescriptions(migrateState(payload.data)));
        saveLocal();
        render();
        setSaveState("Синхронизировано");
      }else{
        // На первом запуске сервер пуст. Не затираем локальные данные:
        // текущая версия будет отправлена при первом редактировании.
        setSaveState("Сервер готов");
      }
      remoteLoadDone=true;
    }catch(err){
      console.error("Remote load failed",err);
      remoteLoadDone=true;
      setSaveState("Локальный режим");
    }
  }

  function money(s){
    const m=String(s||"").match(/^\s*(Высокий|Средний|Низкий)\.?\s*(.*)$/i);
    if(!m)return{level:"Средний",reason:String(s||"")};
    const level=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
    return{level,reason:m[2]||""};
  }
  function labelClass(status){
    const s=String(status||"").trim().toLowerCase();

    if(s==="backlog" || s==="планируется (нет задачи)" || s==="планируется" || s==="планирование") return "label-default";

    if(s==="code review" || s==="на проверке постановщиком" || s.includes("ревью")) return "label-review";

    if(
      s==="очередь" ||
      s==="в работе" ||
      s==="тестирование" ||
      s==="вылить" ||
      s==="верстка" ||
      s==="реализовано"
    ) return "label-primary";

    if(s==="обсуждение и оценка dnm" || s==="обсуждение и оценка") return "label-info";
    if(s==="закрыто") return "label-success";
    if(s.includes("ждем согласования") || s.includes("ожид")) return "label-warning";
    if(s.includes("аналит") || s.includes("дизайн")) return "label-info";

    return "label-default";
  }
  function moneyLabel(level){return level==="Высокий"?"money-high":level==="Средний"?"money-medium":"money-low"}

  const DEFAULT_STAGE_ORDER=[
    "Обсуждение и оценка DNM","Аналитика и проработка","Дизайн",
    "Планируется (нет задачи)","Backlog","Ждем согласования/оплаты/ДС",
    "Очередь","В работе","Верстка","Code review","Доработки",
    "Тестирование","На проверке постановщиком","Вылить","Реализовано","Закрыто"
  ];

  function getStageOrder(module=state[active]){
    const stored=Array.isArray(module?.stageOrder)?module.stageOrder:[];
    const actual=(module?.features||[])
      .flatMap(f=>(f.tasks||[]).map(t=>String(t.status||"Планируется (нет задачи)")));
    const result=[];
    const seen=new Set();
    [...stored,...DEFAULT_STAGE_ORDER,...actual].forEach(stage=>{
      const s=String(stage||"").trim();
      if(!s||seen.has(s))return;
      seen.add(s);
      result.push(s);
    });
    return result;
  }

  function stageRank(status){
    const s=String(status||"Планируется (нет задачи)");
    const order=getStageOrder();
    const i=order.indexOf(s);
    return i===-1?order.length:i;
  }

  function groupTasksByStage(tasks){
    const map=new Map();
    tasks.forEach(t=>{
      const stage=String(t.status||"Планируется (нет задачи)");
      if(!map.has(stage))map.set(stage,[]);
      map.get(stage).push(t);
    });
    return [...map.entries()].sort((a,b)=>{
      const ra=stageRank(a[0]), rb=stageRank(b[0]);
      return ra===rb ? a[0].localeCompare(b[0],"ru") : ra-rb;
    });
  }

  function taskPriorityClass(level){
    return level==="Высокий"?"priority-high":level==="Средний"?"priority-medium":"priority-low";
  }

  function taskText(t){
    return `${t.number?"#"+t.number+" ":""}${t.status&&t.status!=="Планируется"?"("+t.status+") — ":""}${t.title||""}`.trim()
  }
  function q(){return $("searchInput").value.trim().toLowerCase()}
  function matches(s){return !q()||String(s||"").toLowerCase().includes(q())}

  function renderNav(){
    $("moduleCount").textContent=state.length;
    const ul=$("moduleNav");ul.innerHTML="";

      const taskCount=(m.features||[]).reduce((sum,f)=>sum+((f.tasks||[]).length),0);

      badge.title=`Доработок: ${taskCount}`;

      a.appendChild(badge);

  function render(){
    if(!state.length)return;
    if(active>=state.length)active=0;
    renderNav();
    const m=state[active];
    const all=m.features.flatMap(f=>f.tasks);
    const done=all.filter(closed).length;
    const planned=all.filter(t=>["планируется (нет задачи)","планируется","backlog"].includes(String(t.status||"").toLowerCase())).length;
    const closedCount=all.filter(t=>String(t.status||"").toLowerCase()==="закрыто").length;
    const inwork=Math.max(0,all.length-planned-closedCount);
    const total=Math.max(1,all.length);
    const segWidth=v=>(v/total*100);
    const segCenter=(offset,width)=>offset + width/2;
    const plannedW=segWidth(planned), inworkW=segWidth(inwork), closedW=segWidth(closedCount);
    $("summaryStrip").innerHTML=`
      <div class="summary-progress-wrap">

renderFeatures(m);

  function taskBucket(t){
    const s=String(t.status||"").trim().toLowerCase();
    if(s==="закрыто")return "closed";
    if(["планируется (нет задачи)","планируется","планирование","backlog"].includes(s))return "planned";
    return "inwork";
  }
  function passesStageFilter(t){return !taskStageFilter||taskBucket(t)===taskStageFilter}
  function featureQueryMatch(f){return !!q()&&(matches(f.name)||matches(f.why)||matches(f.monetization))}
  function taskQueryMatch(t,f){return !q()||featureQueryMatch(f)||matches(taskText(t))}
  function featureVisible(f){
    if(!q()&&!taskStageFilter)return true;
    return f.tasks.some(t=>passesStageFilter(t)&&taskQueryMatch(t,f));
  }

  function visibleTasks(f){
    return f.tasks.filter(t=>passesStageFilter(t)&&taskQueryMatch(t,f))
  }

              <button class="icon-btn danger" title="Удалить функционал" aria-label="Удалить функционал" data-action="delete-feature" data-fi="${fi}">${iconSvg("delete")}</button>

              <button class="feature-money-chip label ${moneyLabel(mp.level)}" data-action="feature-money" data-fi="${fi}" title="Показать обоснование монетизации">

              </button>
              <button class="task-visibility-btn feature-eye" data-action="toggle" data-fi="${fi}" title="${isCollapsed?"Показать доработки":"Скрыть доработки"}" aria-label="${isCollapsed?"Показать доработки":"Скрыть доработки"}">

  function clearDragMarks(){
    document.querySelectorAll(".feature-row,.task-item,.task-list,.stage-group,.stage-group-head").forEach(el=>{
      el.classList.remove(
        "dragging-feature","feature-drop-before","feature-drop-after",
        "dragging-task","task-drop-before","task-drop-after","task-list-drop",
        "dragging-stage","stage-drop-before","stage-drop-after"
      );
    });
  }

  function reorderStage(stageName,targetStage,after){
    const module=state[active];
    if(!module||!stageName||!targetStage||stageName===targetStage)return false;

    const order=getStageOrder(module);
    const from=order.indexOf(stageName);
    const to=order.indexOf(targetStage);
    if(from===-1||to===-1)return false;

    order.splice(from,1);
    let insertAt=order.indexOf(targetStage);
    if(after)insertAt++;
    order.splice(Math.max(0,Math.min(insertAt,order.length)),0,stageName);

    module.stageOrder=order;
    return true;
  }

  function insertTaskAtStage(feature,t,stage,beforeIndex=null){
    t.status=stage;
    const list=feature.tasks;
    if(beforeIndex!==null){
      list.splice(beforeIndex,0,t);
      return;
    }
    let last=-1;
    list.forEach((x,i)=>{if(String(x.status||"Планируется")===stage)last=i});
    list.splice(last>=0?last+1:list.length,0,t);
  }

  function bindDragAndDrop(){
    document.querySelectorAll(".stage-group-head").forEach(head=>{
      head.addEventListener("dragstart",e=>{
        if(e.target.closest("button,input,select,textarea,a")){e.preventDefault();return}
        const stage=head.dataset.dragStage;
        if(!stage){e.preventDefault();return}
        dragContext={kind:"stage",stage};
        justDragged=true;
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",JSON.stringify(dragContext));
        head.classList.add("dragging-stage");
        hidePopover();
      });
      head.addEventListener("dragend",()=>{
        dragContext=null;
        clearDragMarks();
        setTimeout(()=>{justDragged=false},80);
      });
    });

    document.querySelectorAll(".stage-group").forEach(group=>{
      group.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="stage")return;
        e.preventDefault();
        e.stopPropagation();

        document.querySelectorAll(".stage-group").forEach(x=>{
          x.classList.remove("stage-drop-before","stage-drop-after");
        });

        const head=group.querySelector(".stage-group-head");
        const r=(head||group).getBoundingClientRect();
        const after=e.clientY>=r.top+r.height/2;
        group.classList.add(after?"stage-drop-after":"stage-drop-before");
        e.dataTransfer.dropEffect="move";
      });

      group.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="stage")return;
        e.preventDefault();
        e.stopPropagation();

        const targetStage=group.dataset.stageName;
        const head=group.querySelector(".stage-group-head");
        const r=(head||group).getBoundingClientRect();
        const after=e.clientY>=r.top+r.height/2;

        if(reorderStage(dragContext.stage,targetStage,after)){
          dragContext=null;
          clearDragMarks();
          save();
          render();
          return;
        }

        dragContext=null;
        clearDragMarks();
      });
    });

    document.querySelectorAll(".feature-panel").forEach(panel=>{
      panel.addEventListener("dragstart",e=>{
        if(e.target.closest("button,input,select,textarea,a")){e.preventDefault();return}
        const fi=Number(panel.dataset.dragFeature);
        if(Number.isNaN(fi)){e.preventDefault();return}
        dragContext={kind:"feature",fi};
        justDragged=true;
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",JSON.stringify(dragContext));
        panel.closest(".feature-row")?.classList.add("dragging-feature");
        hidePopover();
      });
      panel.addEventListener("dragend",()=>{
        dragContext=null;
        clearDragMarks();
        setTimeout(()=>{justDragged=false},80);
        requestAnimationFrame(drawNetworkArrows);
      });
    });

    document.querySelectorAll(".feature-row").forEach(row=>{
      row.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="feature")return;
        e.preventDefault();
        document.querySelectorAll(".feature-row").forEach(x=>x.classList.remove("feature-drop-before","feature-drop-after"));
        const r=row.getBoundingClientRect();
        row.classList.add(e.clientX<r.left+r.width/2?"feature-drop-before":"feature-drop-after");
        e.dataTransfer.dropEffect="move";
      });
      row.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="feature")return;
        e.preventDefault();
        const from=dragContext.fi,to=Number(row.dataset.fi);
        if(Number.isNaN(from)||Number.isNaN(to)){clearDragMarks();return}
        const r=row.getBoundingClientRect();
        const after=e.clientX>=r.left+r.width/2;
        const features=state[active].features;
        if(from===to){dragContext=null;clearDragMarks();return}
        const [moved]=features.splice(from,1);
        let insertAt=to+(after?1:0);
        if(from<insertAt)insertAt--;
        features.splice(Math.max(0,Math.min(insertAt,features.length)),0,moved);
        collapsed.clear();
        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });

    document.querySelectorAll(".task-item").forEach(item=>{
      item.addEventListener("dragstart",e=>{
        if(e.target.closest("button,input,select,textarea,a")){e.preventDefault();return}
        const fi=Number(item.dataset.taskFi),ti=Number(item.dataset.taskTi);
        if(Number.isNaN(fi)||Number.isNaN(ti)){e.preventDefault();return}
        dragContext={kind:"task",fi,ti};
        justDragged=true;
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",JSON.stringify(dragContext));
        item.classList.add("dragging-task");
        hidePopover();
      });
      item.addEventListener("dragend",()=>{
        dragContext=null;
        clearDragMarks();
        setTimeout(()=>{justDragged=false},80);
      });
    });

    document.querySelectorAll(".task-item").forEach(item=>{
      item.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="task")return;
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll(".task-item").forEach(x=>x.classList.remove("task-drop-before","task-drop-after"));
        const r=item.getBoundingClientRect();
        item.classList.add(e.clientY<r.top+r.height/2?"task-drop-before":"task-drop-after");
        e.dataTransfer.dropEffect="move";
      });
      item.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="task")return;
        e.preventDefault();
        e.stopPropagation();

        const srcFi=dragContext.fi,srcTi=dragContext.ti;
        const dstFi=Number(item.dataset.taskFi),rawDstTi=Number(item.dataset.taskTi);
        if([srcFi,srcTi,dstFi,rawDstTi].some(Number.isNaN)){clearDragMarks();return}

        const r=item.getBoundingClientRect();
        const after=e.clientY>=r.top+r.height/2;
        const source=state[active].features[srcFi].tasks;
        const destination=state[active].features[dstFi].tasks;
        const targetTask=destination[rawDstTi];
        const targetStage=String(targetTask?.status||"Планируется");

        const [moved]=source.splice(srcTi,1);
        let dstTi=rawDstTi;
        if(srcFi===dstFi&&srcTi<dstTi)dstTi--;
        if(after)dstTi++;
        dstTi=Math.max(0,Math.min(dstTi,destination.length));

        moved.status=targetStage;
        destination.splice(dstTi,0,moved);

        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });

    document.querySelectorAll(".stage-group").forEach(group=>{
      group.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="task"||e.target.closest(".task-item"))return;
        e.preventDefault();
        group.classList.add("task-list-drop");
        e.dataTransfer.dropEffect="move";
      });
      group.addEventListener("dragleave",e=>{
        if(!group.contains(e.relatedTarget))group.classList.remove("task-list-drop");
      });
      group.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="task"||e.target.closest(".task-item"))return;
        e.preventDefault();

        const srcFi=dragContext.fi,srcTi=dragContext.ti,dstFi=Number(group.dataset.taskListFi);
        const stage=group.dataset.stageName||"Планируется (нет задачи)";
        if([srcFi,srcTi,dstFi].some(Number.isNaN)){clearDragMarks();return}

        const source=state[active].features[srcFi].tasks;
        const destinationFeature=state[active].features[dstFi];
        const [moved]=source.splice(srcTi,1);
        insertTaskAtStage(destinationFeature,moved,stage);

        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });

    document.querySelectorAll(".task-list").forEach(list=>{
      list.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="task")return;
        if(e.target.closest(".task-item")||e.target.closest(".stage-group"))return;
        e.preventDefault();
        list.classList.add("task-list-drop");
      });
      list.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="task"||e.target.closest(".task-item")||e.target.closest(".stage-group"))return;
        e.preventDefault();
        const srcFi=dragContext.fi,srcTi=dragContext.ti,dstFi=Number(list.dataset.taskListFi);
        if([srcFi,srcTi,dstFi].some(Number.isNaN)){clearDragMarks();return}
        const source=state[active].features[srcFi].tasks;
        const [moved]=source.splice(srcTi,1);
        state[active].features[dstFi].tasks.push(moved);
        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });
  }

  function syncTopScroll(){
    const top=$("topScroll"),inner=$("topScrollInner"),view=$("roadmapView"),board=$("networkBoard");
    if(!top||!inner||!view||!board)return;
    inner.style.width=Math.max(board.scrollWidth,board.offsetWidth)+"px";
    top.scrollLeft=view.scrollLeft;
  }

  let syncingScroll=false;
  function bindScrollSync(){
    const top=$("topScroll"),view=$("roadmapView");
    if(!top||!view||top.dataset.bound==="1")return;
    top.dataset.bound="1";

    top.addEventListener("scroll",()=>{
      if(syncingScroll)return;
      syncingScroll=true;
      view.scrollLeft=top.scrollLeft;
      requestAnimationFrame(()=>{syncingScroll=false;drawNetworkArrows()});
    });

    view.addEventListener("scroll",()=>{
      if(syncingScroll)return;
      syncingScroll=true;
      top.scrollLeft=view.scrollLeft;
      requestAnimationFrame(()=>{syncingScroll=false;drawNetworkArrows()});
    });
  }

  function drawNetworkArrows(){
    const svg=$("networkSvg"),board=$("networkBoard"),root=$("networkRoot");
    if(!svg||!board||!root)return;
    while(svg.lastChild && svg.lastChild.tagName.toLowerCase()!=="defs")svg.removeChild(svg.lastChild);

    const cards=[...document.querySelectorAll(".feature-panel")];
    if(!cards.length)return;

    const br=board.getBoundingClientRect();
    const rr=root.getBoundingClientRect();
    const width=Math.max(board.clientWidth,board.scrollWidth);
    const height=board.scrollHeight;

    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.setAttribute("width",width);
    svg.setAttribute("height",height);
    svg.style.width=width+"px";

    const sx=(rr.left+rr.width/2-br.left)||width/2;
    const sy=Math.max(4,rr.bottom-br.top+2);

    cards.forEach(card=>{
      const cr=card.getBoundingClientRect();
      const tx=cr.left+cr.width/2-br.left;
      const ty=cr.top-br.top-7;
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      const curve=Math.max(14,Math.min(38,(ty-sy)*.35));
      path.setAttribute("d",`M ${sx} ${sy} C ${sx} ${sy+curve}, ${tx} ${ty-curve}, ${tx} ${ty}`);
      path.setAttribute("fill","none");
      path.setAttribute("stroke","#93AFC1");
      path.setAttribute("stroke-width","1.5");
      path.setAttribute("marker-end","url(#arrowHead)");
      path.setAttribute("vector-effect","non-scaling-stroke");
      svg.appendChild(path);
    });
  }

      m.features.forEach(f=>{
        if(!f.tasks.length){
          rows.push([m.name,desc.users||"",desc.beneficiaries||"",desc.area||"",desc.functional||"",desc.benefits||"",desc.competitors||"",desc.usp||"",f.name||"",f.why||"",f.monetization||"","","",""]);
          return;
        }
        f.tasks.forEach(t=>{
          rows.push([m.name,desc.users||"",desc.beneficiaries||"",desc.area||"",desc.functional||"",desc.benefits||"",desc.competitors||"",desc.usp||"",f.name||"",f.why||"",f.monetization||"",t.number||"",t.status||"",t.title||"",t.monetizationLevel||"",t.monetizationReason||""]);
        });
      });
    });
    return "\ufeff"+rows.map(r=>r.map(escapeCsv).join(";")).join("\r\n");
  }

  function parseCsv(text){
    const rows=[]; let row=[]; let value=""; let inQuotes=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i], next=text[i+1];
      if(ch==='"'){
        if(inQuotes && next==='"'){value+='"';i++;}
        else inQuotes=!inQuotes;
      } else if(ch===';' && !inQuotes){
        row.push(value); value="";
      } else if((ch==='\n' || ch==='\r') && !inQuotes){
        if(ch==='\r' && next==='\n') i++;
        row.push(value); rows.push(row); row=[]; value="";
      } else {
        value+=ch;
      }
    }
    if(value!=="" || row.length){row.push(value); rows.push(row);}
    return rows.filter(r=>r.some(cell=>String(cell||"").trim()!==""));
  }

  function importStateFromCsv(text){
    text=text.replace(/^\ufeff/,"");
    const rows=parseCsv(text);
    if(rows.length<2) throw new Error("CSV пустой");
    const header=rows[0].map(x=>String(x||"").trim());
    const idx=name=>header.indexOf(name);
    const req=["Продукт","Пользователи","Выгодоприобретатели","Область применения","Функциональное описание","Выгоды применения","Конкуренты","УТП","Функционал","Зачем / какую боль закрывает","Перспектива монетизации","Номер задачи","Статус задачи","Доработка","Приоритет монетизации доработки","Обоснование монетизации доработки"];
    if(req.some(x=>idx(x)===-1)) throw new Error("bad");
    const modules=[]; const byModule=new Map();
    rows.slice(1).forEach(r=>{
      const moduleName=String(r[idx("Продукт")]||"").trim();
      if(!moduleName) return;
      let module=byModule.get(moduleName);
      if(!module){
        module={
          name:moduleName,
          description:{
            users:String(r[idx("Пользователи")]||"").trim(),
            beneficiaries:String(r[idx("Выгодоприобретатели")]||"").trim(),
            area:String(r[idx("Область применения")]||"").trim(),
            functional:String(r[idx("Функциональное описание")]||"").trim(),
            benefits:String(r[idx("Выгоды применения")]||"").trim(),
            competitors:String(r[idx("Конкуренты")]||"").trim(),
            usp:String(r[idx("УТП")]||"").trim()
          },
          features:[]
        };
        module._featureMap=new Map();
        byModule.set(moduleName,module);
        modules.push(module);
      }
      const featureName=String(r[idx("Функционал")]||"").trim();
      if(!featureName) return;
      let feature=module._featureMap.get(featureName);
      if(!feature){
        feature={
          name:featureName,
          why:String(r[idx("Зачем / какую боль закрывает")]||"").trim(),
          monetization:String(r[idx("Перспектива монетизации")]||"").trim(),
          tasks:[]
        };
        module._featureMap.set(featureName,feature);
        module.features.push(feature);
      }
      const taskTitle=String(r[idx("Доработка")]||"").trim();
      const taskNumber=String(r[idx("Номер задачи")]||"").trim().replace(/^#/,"");
      const taskStatus=String(r[idx("Статус задачи")]||"").trim();
      if(taskTitle || taskNumber || taskStatus){
        feature.tasks.push({number:taskNumber,status:taskStatus || "Планируется",title:taskTitle,monetizationLevel:String(r[idx("Приоритет монетизации доработки")]||"").trim()||money(feature.monetization).level,monetizationReason:String(r[idx("Обоснование монетизации доработки")]||"").trim()||money(feature.monetization).reason});
      }
    });
    modules.forEach(m=>delete m._featureMap);
    return hydrateDescriptions(modules);
  }

  $("authForm")?.addEventListener("submit",async e=>{
    e.preventDefault();
    const password=$("authPassword")?.value||"";
    const submit=$("authSubmit");
    if(submit)submit.disabled=true;
    if($("authError"))$("authError").textContent="";
    try{
      if(await loginWithPassword(password)){
        if($("authPassword"))$("authPassword").value="";
        startApp();
      }else{
        showAuth("Неверный пароль");
      }
    }catch(err){
      showAuth(err.message||"Не удалось выполнить вход");
    }finally{
      if(submit)submit.disabled=false;
    }
  });

  function closeActionsMenu(){document.querySelector(".actions-dropdown")?.classList.remove("open")}
  $("actionsToggle").onclick=(e)=>{e.stopPropagation();document.querySelector(".actions-dropdown")?.classList.toggle("open")}
  document.addEventListener("click",(e)=>{if(!e.target.closest(".actions-dropdown"))closeActionsMenu()})

  $("versionHistoryAction").onclick=versionHistoryModal;
  $("logoutAction").onclick=()=>{closeActionsMenu();logout()};
  $("exportJsonAction").onclick=()=>{closeActionsMenu();download("DNM_карта_развития.json",JSON.stringify(state,null,2),"application/json;charset=utf-8")}
  $("exportCsvAction").onclick=()=>{closeActionsMenu();download("DNM_карта_развития_Excel.csv",exportStateToCsv(),"text/csv;charset=utf-8")}
  $("importJsonAction").onclick=()=>{$("importJson").click();closeActionsMenu()}
  $("importCsvAction").onclick=()=>{$("importCsv").click();closeActionsMenu()}
  $("resetAction").onclick=()=>{closeActionsMenu();if(confirm("Вернуть исходные данные из файла?")){state=prioritizeModules(hydrateDescriptions(migrateState(clone(initial))));active=0;save();render()}}

  $("importJson").onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const x=JSON.parse(await file.text());
      if(!Array.isArray(x)) throw new Error("bad");
      state=prioritizeModules(hydrateDescriptions(migrateState(x)));active=0;save();render();
    }catch(err){alert("Не удалось загрузить JSON. Используйте файл, выгруженный с этой страницы.");}
    e.target.value="";
  }

  $("importCsv").onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const text=await file.text();
      state=prioritizeModules(migrateState(importStateFromCsv(text)));active=0;save();render();
      alert("Данные из Excel (CSV) загружены.");
    }catch(err){alert("Не удалось загрузить CSV. Проверьте, что это файл, выгруженный с этой страницы.");}
    e.target.value="";
  }
try {
    initAuth();
  } catch (err) {
    console.error(err);
    showAuth("Ошибка инициализации входа");
  }
})();
</script>

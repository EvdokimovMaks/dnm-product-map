  function buildRoadmapRows(module){
    const rowsMap=new Map();
    (module.features||[]).forEach((feature,fi)=>{
      (feature.tasks||[]).forEach((task,ti)=>{
        const key=roadmapTaskKey(task,feature.name);
        const level=task.monetizationLevel||money(feature.monetization).level||"Средний";
        if(!rowsMap.has(key)){
          rowsMap.set(key,{
            featureNames:[feature.name],
            task:clone(task),
            priority:level,
            status:task.status||"",
            bucket:statusBucket(task.status),
            reasons:[task.monetizationReason||""],
            sourceFi:fi,
            sourceTi:ti,
            sources:[{fi,ti}]
          });
        }else{
          const row=rowsMap.get(key);
          if(!row.featureNames.includes(feature.name))row.featureNames.push(feature.name);
          row.sources.push({fi,ti});
          if(priorityRank(level)>priorityRank(row.priority))row.priority=level;
          if(!row.task.plannedStartDate && task.plannedStartDate)row.task.plannedStartDate=task.plannedStartDate;
          if(!row.task.plannedCloseDate && task.plannedCloseDate)row.task.plannedCloseDate=task.plannedCloseDate;
          if(!row.task.actualStartDate && task.actualStartDate)row.task.actualStartDate=task.actualStartDate;
          if(!row.task.actualCloseDate && task.actualCloseDate)row.task.actualCloseDate=task.actualCloseDate;
          if(row.bucket!=="closed" && statusBucket(task.status)==="closed"){
            row.status=task.status||row.status;
            row.bucket="closed";
          }
        }
      });
    });
    return Array.from(rowsMap.values()).sort((a,b)=>{
      const pd=priorityRank(b.priority)-priorityRank(a.priority);
      if(pd)return pd;
      const qa=quarterIndexFromDate(a.bucket==="closed"?a.task.actualStartDate:a.task.plannedStartDate)||999999;
      const qb=quarterIndexFromDate(b.bucket==="closed"?b.task.actualStartDate:b.task.plannedStartDate)||999999;
      if(qa!==qb)return qa-qb;
      return String(a.task.title||"").localeCompare(String(b.task.title||""),"ru");
    });
  }

  function roadmapDateRange(task,status){
    const isDone=statusBucket(status)==="closed";

    // Roadmap uses actual dates independently for each boundary:
    // start: actual start if present, otherwise planned start;
    // end: actual close if present, otherwise planned close.
    const startValue=dateInputValue(task.actualStartDate)
      ? task.actualStartDate
      : task.plannedStartDate;
    const endValue=dateInputValue(task.actualCloseDate)
      ? task.actualCloseDate
      : task.plannedCloseDate;

    let start=quarterIndexFromDate(startValue);
    let end=quarterIndexFromDate(endValue);

    // If only one boundary is filled, show the task in that quarter.
    if(start===null && end!==null)start=end;
    if(end===null && start!==null)end=start;

    return {start,end,isDone};
  }

  function getRoadmapQuarters(rows){
    const points=[];
    rows.forEach(row=>{
      const range=roadmapDateRange(row.task,row.status);
      if(range.start!==null)points.push(range.start);
      if(range.end!==null)points.push(range.end);
    });

    let start,end;
    if(points.length){
      start=Math.min(...points);
      end=Math.max(...points);
      if(end-start<5)end=start+5;
    }else{
      start=currentQuarterIndex();
      end=start+5;
    }
    return Array.from({length:end-start+1},(_,i)=>quarterMetaFromIndex(start+i));
  }

  function isQuarterActive(task,quarter,status=""){
    const range=roadmapDateRange(task,status);
    if(range.start===null || range.end===null)return false;
    return quarter.index>=Math.min(range.start,range.end) && quarter.index<=Math.max(range.start,range.end);
  }

  const monthNamesRu=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];

  const ROADMAP_COLLAPSED_QUARTERS_KEY="dnm:roadmap:collapsed-quarters:v1";

  function loadRoadmapCollapsedQuarters(){
    try{
      const parsed=JSON.parse(localStorage.getItem(ROADMAP_COLLAPSED_QUARTERS_KEY)||"[]");
      return new Set(Array.isArray(parsed)?parsed:[]);
    }catch(e){
      return new Set();
    }
  }

  let roadmapCollapsedQuarters=loadRoadmapCollapsedQuarters();

  function roadmapQuarterCollapseId(moduleName,quarterIndex){
    return `${String(moduleName||"")}::${quarterIndex}`;
  }

  function isRoadmapQuarterCollapsed(moduleName,quarterIndex){
    return roadmapCollapsedQuarters.has(roadmapQuarterCollapseId(moduleName,quarterIndex));
  }

  function setRoadmapQuarterCollapsed(moduleName,quarterIndex,collapsed){
    const id=roadmapQuarterCollapseId(moduleName,quarterIndex);
    if(collapsed)roadmapCollapsedQuarters.add(id);
    else roadmapCollapsedQuarters.delete(id);

    try{
      localStorage.setItem(
        ROADMAP_COLLAPSED_QUARTERS_KEY,
        JSON.stringify([...roadmapCollapsedQuarters])
      );
    }catch(e){}
  }


  const ROADMAP_QUARTER_WIDTHS_KEY="dnm:roadmap:quarter-widths:v1";

  function loadRoadmapQuarterWidths(){
    try{
      const parsed=JSON.parse(localStorage.getItem(ROADMAP_QUARTER_WIDTHS_KEY)||"{}");
      return parsed&&typeof parsed==="object"&&!Array.isArray(parsed)?parsed:{};
    }catch(e){
      return {};
    }
  }

  let roadmapQuarterWidths=loadRoadmapQuarterWidths();

  function roadmapQuarterWidthId(moduleName,quarterIndex){
    return `${String(moduleName||"")}::${quarterIndex}`;
  }

  function getRoadmapQuarterWidth(moduleName,quarterIndex,defaultWidth){
    const value=Number(roadmapQuarterWidths[roadmapQuarterWidthId(moduleName,quarterIndex)]);
    return Number.isFinite(value)&&value>=180?value:defaultWidth;
  }

  function setRoadmapQuarterWidth(moduleName,quarterIndex,width){
    const id=roadmapQuarterWidthId(moduleName,quarterIndex);
    roadmapQuarterWidths[id]=Math.round(Math.max(180,Math.min(1440,width)));
    try{
      localStorage.setItem(ROADMAP_QUARTER_WIDTHS_KEY,JSON.stringify(roadmapQuarterWidths));
    }catch(e){}
  }

  function resetRoadmapQuarterWidth(moduleName,quarterIndex){
    delete roadmapQuarterWidths[roadmapQuarterWidthId(moduleName,quarterIndex)];
    try{
      localStorage.setItem(ROADMAP_QUARTER_WIDTHS_KEY,JSON.stringify(roadmapQuarterWidths));
    }catch(e){}
  }


  function monthIndexFromDate(value){
    const v=dateInputValue(value);
    if(!v)return null;
    const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m)return null;
    return Number(m[1])*12+(Number(m[2])-1);
  }

  function monthMetaFromIndex(index){
    const year=Math.floor(index/12);
    const month=((index%12)+12)%12;
    const q=Math.floor(month/3);
    return {
      index,
      year,
      month,
      quarterIndex:year*4+q,
      quarterLabel:`Q${q+1} ${year}`,
      label:monthNamesRu[month]
    };
  }

  function roadmapMonthRange(task,status){
    const isDone=statusBucket(status)==="closed";

    // Each side of the interval prefers fact independently.
    // This allows an in-progress task to start from actualStartDate
    // and still end at plannedCloseDate until actualCloseDate appears.
    const startValue=dateInputValue(task.actualStartDate)
      ? task.actualStartDate
      : task.plannedStartDate;
    const endValue=dateInputValue(task.actualCloseDate)
      ? task.actualCloseDate
      : task.plannedCloseDate;

    let start=monthIndexFromDate(startValue);
    let end=monthIndexFromDate(endValue);
    if(start===null&&end!==null)start=end;
    if(end===null&&start!==null)end=start;
    return {start,end,isDone};
  }

  function getRoadmapMonths(rows){
    const quarters=getRoadmapQuarters(rows);
    const months=[];
    quarters.forEach(q=>{
      const qStartMonth=(q.year*12)+(q.q*3);
      for(let i=0;i<3;i++)months.push(monthMetaFromIndex(qStartMonth+i));
    });
    return months;
  }

  function isMonthActive(task,month,status=""){
    const range=roadmapMonthRange(task,status);
    if(range.start===null||range.end===null)return false;
    return month.index>=Math.min(range.start,range.end)&&month.index<=Math.max(range.start,range.end);
  }

  function monthStartDate(monthIndex){
    const meta=monthMetaFromIndex(monthIndex);
    return `${meta.year}-${String(meta.month+1).padStart(2,"0")}-01`;
  }

  function monthEndDate(monthIndex){
    const meta=monthMetaFromIndex(monthIndex);
    const lastDay=new Date(Date.UTC(meta.year,meta.month+1,0)).getUTCDate();
    return `${meta.year}-${String(meta.month+1).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  }

  function renderTimeline(module){
    const host=$("timelineHost");
    if(!host)return;

    const sourceRows=buildRoadmapRows(module);
    const allAvailableMonths=getRoadmapMonths(sourceRows);
    const query=q();

    const rows=sourceRows.filter(row=>{
      const stage=String(row.status||"").trim()||"Без статуса";
      const bucketOk=!taskStageFilters.size||taskStageFilters.has(row.bucket);
      const stageOk=!topStageFilters.size||topStageFilters.has(stage);
      const directionOk=!topDirectionFilters.size||row.featureNames.some(name=>topDirectionFilters.has(name));
      const priorityOk=!topPriorityFilters.size||topPriorityFilters.has(row.priority);
      const quarterOk=taskMatchesQuarterFilter(row.task,row.status);
      const queryOk=!query || [
        row.task.number,
        row.task.title,
        row.status,
        row.priority,
        ...(row.featureNames||[])
      ].some(value=>String(value||"").toLowerCase().includes(query));
      return bucketOk&&stageOk&&directionOk&&priorityOk&&quarterOk&&queryOk;
    });

    const months=topQuarterFilters.size
      ? allAvailableMonths.filter(month=>topQuarterFilters.has(String(month.quarterIndex)))
      : allAvailableMonths;

    if(!rows.length||!months.length){
      host.innerHTML='<div class="roadmap-card"><div class="roadmap-empty">Нет доработок по выбранным условиям.</div></div>';
      return;
    }

    const featureOrder=new Map((module.features||[]).map((feature,index)=>[feature.name,index]));

    const groupsMap=new Map();
    rows.forEach(row=>{
      let names=[...(row.featureNames||[])];
      if(topDirectionFilters.size)names=names.filter(name=>topDirectionFilters.has(name));
      names.sort((a,b)=>(featureOrder.get(a)??9999)-(featureOrder.get(b)??9999));
      const key=names.join("|||");
      if(!groupsMap.has(key))groupsMap.set(key,{featureNames:names,rows:[]});
      groupsMap.get(key).rows.push(row);
    });

    const groups=Array.from(groupsMap.values()).sort((a,b)=>{
      const aa=Math.min(...a.featureNames.map(name=>featureOrder.get(name)??9999));
      const bb=Math.min(...b.featureNames.map(name=>featureOrder.get(name)??9999));
      return aa-bb;
    });

    const roadmapStageOrder=[
      "В планах","Backlog",
      "Обсуждение и оценка DNM","Аналитика и проработка","Дизайн",
      "Ждем согласования/оплаты/ДС","Очередь","В работе","Верстка",
      "Code review","Доработки","Тестирование","На проверке постановщиком",
      "Вылить","Реализовано","Закрыто"
    ];

    const roadmapStageRank=status=>{
      const s=String(status||"").trim()||"Без статуса";
      const index=roadmapStageOrder.indexOf(s);
      return index===-1?9998:index;
    };

    groups.forEach(group=>{
      group.rows.sort((a,b)=>{
        const stageDiff=roadmapStageRank(a.status)-roadmapStageRank(b.status);
        if(stageDiff)return stageDiff;
        const ar=roadmapMonthRange(a.task,a.status);
        const br=roadmapMonthRange(b.task,b.status);
        const ad=ar.start??999999;
        const bd=br.start??999999;
        if(ad!==bd)return bd-ad;
        return String(a.task.title||"").localeCompare(String(b.task.title||""),"ru");
      });
    });

    const roadmapPriorityClass=(level)=>{
      if(level==="Высокий")return "roadmap-row-priority-high";
      if(level==="Низкий")return "roadmap-row-priority-low";
      return "roadmap-row-priority-medium";
    };

    const taskLinkHtml=(row)=>{
      const task=row.task;
      const text=(task.number?`#${task.number} `:"")+(task.title||"");
      const link=task.number
        ? `<a class="roadmap-quarter-task-link" href="https://infotech.zetep.com/board/5/213/infotech-ru/dsfsubaru/issue/${esc(task.number)}" target="_blank" rel="noopener noreferrer" title="${esc(text)}">${esc(text)}</a>`
        : `<span class="roadmap-quarter-task-link" title="${esc(text)}">${esc(text)}</span>`;

      return link;
    };

    const quarterGroups=[];
    months.forEach(month=>{
      const last=quarterGroups[quarterGroups.length-1];
      if(last&&last.index===month.quarterIndex){
        last.months.push(month);
      }else{
        quarterGroups.push({
          index:month.quarterIndex,
          label:month.quarterLabel,
          months:[month]
        });
      }
    });

    quarterGroups.forEach(group=>{
      group.collapsed=isRoadmapQuarterCollapsed(module.name,group.index);
      group.visualSpan=group.collapsed?1:group.months.length;
      group.startMonth=group.months[0].index;
      group.monthSpan=group.months.length;
      group.totalWidth=getRoadmapQuarterWidth(module.name,group.index,group.monthSpan*120);
      group.visualWidth=group.collapsed
        ? Math.max(120,group.totalWidth/group.monthSpan)
        : group.totalWidth;
      group.columnWidth=group.visualWidth/group.visualSpan;
    });

    const displayColumns=[];
    quarterGroups.forEach(group=>{
      if(group.collapsed){
        displayColumns.push({
          type:"quarter",
          quarterIndex:group.index,
          quarterLabel:group.label,
          startMonth:group.startMonth,
          monthSpan:group.monthSpan,
          width:group.visualWidth
        });
      }else{
        group.months.forEach(month=>{
          displayColumns.push({
            type:"month",
            quarterIndex:group.index,
            quarterLabel:group.label,
            monthLabel:month.label,
            startMonth:month.index,
            monthSpan:1,
            width:group.columnWidth
          });
        });
      }
    });

    const displayColumnActive=(task,column,status)=>{
      const range=roadmapMonthRange(task,status);
      if(range.start===null||range.end===null)return false;

      const taskStart=Math.min(range.start,range.end);
      const taskEnd=Math.max(range.start,range.end);
      const colStart=column.startMonth;
      const colEnd=column.startMonth+column.monthSpan-1;

      return taskStart<=colEnd&&taskEnd>=colStart;
    };

    const renderTimelineCells=(row)=>{
      const task=row.task;
      const status=row.status||"—";
      const bucket=row.bucket==="closed"?"closed":(statusBucket(row.status)==="planned"?"planned":"inwork");
      let cells="";
      let i=0;

      while(i<displayColumns.length){
        const column=displayColumns[i];
        const active=displayColumnActive(task,column,row.status);

        if(!active){
          cells+=`
            <td class="roadmap-month-cell roadmap-month-empty ${column.type==="quarter"?"roadmap-collapsed-quarter-cell":""}"
                data-roadmap-month-start="${column.startMonth}"
                data-roadmap-month-span="${column.monthSpan}"></td>`;
          i+=1;
          continue;
        }

        let visualSpan=1;
        let actualStartMonth=column.startMonth;
        let actualEndMonth=column.startMonth+column.monthSpan-1;

        while(
          i+visualSpan<displayColumns.length &&
          displayColumnActive(task,displayColumns[i+visualSpan],row.status)
        ){
          const next=displayColumns[i+visualSpan];
          actualEndMonth=Math.max(actualEndMonth,next.startMonth+next.monthSpan-1);
          visualSpan+=1;
        }

        const actualMonthSpan=Math.max(1,actualEndMonth-actualStartMonth+1);
        const canPlanAdjust=!dateInputValue(task.actualCloseDate)&&statusBucket(task.status)!=="closed";

        cells+=`
          <td class="roadmap-month-cell roadmap-quarter-span-cell roadmap-quarter-${bucket}"
              colspan="${visualSpan}"
              data-roadmap-month-start="${actualStartMonth}"
              data-roadmap-month-span="${actualMonthSpan}">
            <div class="roadmap-quarter-span roadmap-month-task-bar ${canPlanAdjust?"roadmap-task-draggable roadmap-task-resizable":""}"
                 ${canPlanAdjust?`draggable="true" data-roadmap-drag-fi="${row.sourceFi}" data-roadmap-drag-ti="${row.sourceTi}"`:""}>
              ${canPlanAdjust?`<span class="roadmap-resize-handle roadmap-resize-left"
                    draggable="false"
                    data-roadmap-resize="start"
                    data-fi="${row.sourceFi}"
                    data-ti="${row.sourceTi}"
                    title="Изменить дату планового начала"></span>`:""}
              <div class="roadmap-quarter-bar-content">
                ${taskLinkHtml(row)}
                <span class="roadmap-inline-status ${labelClass(status)}" data-status-bucket="${statusBucket(status)}">${esc(status)}</span>
                <button type="button"
                        class="roadmap-task-edit"
                        data-action="edit-task"
                        data-fi="${row.sourceFi}"
                        data-ti="${row.sourceTi}"
                        title="Редактировать доработку"
                        aria-label="Редактировать доработку">${iconSvg("edit")}</button>
              </div>
              ${canPlanAdjust?`<span class="roadmap-resize-handle roadmap-resize-right"
                    draggable="false"
                    data-roadmap-resize="end"
                    data-fi="${row.sourceFi}"
                    data-ti="${row.sourceTi}"
                    title="Изменить дату планового закрытия"></span>`:""}
            </div>
          </td>`;
        i+=visualSpan;
      }

      return cells;
    };

    const quarterToggleSvg=collapsed=>collapsed
      ? `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5 10 8l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 5.5 4.5 4.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    const tableWidth=180+displayColumns.reduce((sum,column)=>sum+column.width,0);

    host.innerHTML=`
      <div id="roadmapScrollTop" class="roadmap-scroll-top" aria-label="Горизонтальная прокрутка роадмапа">
        <div id="roadmapScrollTopInner" class="roadmap-scroll-top-inner"></div>
      </div>

      <div class="roadmap-card" id="roadmapScroll">
        <table id="roadmapTable" class="roadmap-table roadmap-table-compact-lanes" style="width:${tableWidth}px!important;min-width:${tableWidth}px!important">
          <colgroup>
            <col class="roadmap-direction-col">
            ${displayColumns.map(column=>`<col
              class="${column.type==="quarter"?"roadmap-collapsed-quarter-col":"roadmap-month-col"}"
              data-roadmap-quarter-col="${column.quarterIndex}"
              style="width:${column.width}px!important;min-width:${column.width}px!important;max-width:${column.width}px!important">`).join("")}
          </colgroup>
          <thead>
            <tr class="roadmap-quarter-header-row">
              <th class="roadmap-col-features roadmap-feature-head" rowspan="2">Направление</th>
              ${quarterGroups.map(group=>{
                const toggle=`
                  <button type="button"
                          class="roadmap-quarter-toggle"
                          data-roadmap-quarter-toggle="${group.index}"
                          aria-expanded="${group.collapsed?"false":"true"}"
                          title="${group.collapsed?"Развернуть месяцы":"Свернуть месяцы"}">
                    ${quarterToggleSvg(group.collapsed)}
                  </button>`;

                const quarterResize=`
                  <span class="roadmap-quarter-width-handle"
                        data-roadmap-quarter-resize="${group.index}"
                        data-roadmap-quarter-months="${group.monthSpan}"
                        data-roadmap-quarter-collapsed="${group.collapsed?"1":"0"}"
                        title="Потяните, чтобы изменить ширину квартала. Двойной клик — сбросить ширину"></span>`;

                if(group.collapsed){
                  return `<th class="roadmap-quarter-group-head roadmap-quarter-group-collapsed"
                              rowspan="2"
                              data-roadmap-quarter-index="${group.index}"
                              data-roadmap-month-start="${group.startMonth}"
                              data-roadmap-month-span="${group.monthSpan}">
                            <span class="roadmap-quarter-heading-label">${esc(group.label)}</span>
                            ${toggle}
                            ${quarterResize}
                          </th>`;
                }

                return `<th class="roadmap-quarter-group-head"
                            colspan="${group.visualSpan}"
                            data-roadmap-quarter-index="${group.index}">
                          <span class="roadmap-quarter-heading-label">${esc(group.label)}</span>
                          ${toggle}
                          ${quarterResize}
                        </th>`;
              }).join("")}
            </tr>
            <tr class="roadmap-month-header-row">
              ${quarterGroups.filter(group=>!group.collapsed).flatMap(group=>
                group.months.map(month=>`
                  <th class="roadmap-month-head"
                      data-roadmap-month-start="${month.index}"
                      data-roadmap-month-span="1">${esc(month.label)}</th>`)
              ).join("")}
            </tr>
          </thead>
          <tbody>
            ${groups.map((group,groupIndex)=>{
              const rowspan=group.rows.length;
              const featureCell=`<td class="roadmap-col-features roadmap-feature-cell" rowspan="${rowspan}">
                <div class="roadmap-feature-tabs">
                  ${group.featureNames.map(name=>`<span class="roadmap-feature-tab" title="${esc(name)}">${esc(name)}</span>`).join("")}
                </div>
              </td>`;

              return group.rows.map((row,index)=>`
                <tr class="roadmap-task-row ${roadmapPriorityClass(row.priority)} ${row.bucket==="closed"?"roadmap-row-closed":""} ${index===0&&groupIndex>0?"roadmap-group-start":""}" title="Приоритет монетизации: ${esc(row.priority)}">
                  ${index===0?featureCell:""}
                  ${renderTimelineCells(row)}
                </tr>
              `).join("");
            }).join("")}
          </tbody>
        </table>
        <div id="roadmapTodayLine" class="roadmap-today-line" aria-hidden="true">
          <span class="roadmap-today-label">Сегодня</span>
        </div>
      </div>`;

    host.querySelectorAll("[data-roadmap-quarter-toggle]").forEach(button=>{
      button.addEventListener("click",e=>{
        e.preventDefault();
        e.stopPropagation();

        const quarterIndex=Number(button.dataset.roadmapQuarterToggle);
        if(!Number.isFinite(quarterIndex))return;

        const currentlyCollapsed=isRoadmapQuarterCollapsed(module.name,quarterIndex);
        setRoadmapQuarterCollapsed(module.name,quarterIndex,!currentlyCollapsed);
        rerenderRoadmapPreservingViewport();
      });
    });

    bindRoadmapMonthDrag();
    bindRoadmapResize();
    bindRoadmapQuarterWidthResize(module);
    requestAnimationFrame(()=>{
      syncTimelineTopScroll();
      renderRoadmapTodayLine();
    });
  }

  function previewRoadmapQuarterWidth(quarterIndex,totalWidth,collapsed,monthSpan){
    const table=$("roadmapTable");
    if(!table)return;

    const cols=[...table.querySelectorAll(`[data-roadmap-quarter-col="${quarterIndex}"]`)];
    if(!cols.length)return;

    const visualWidth=collapsed
      ? Math.max(120,totalWidth/Math.max(1,monthSpan))
      : totalWidth;
    const widthPerCol=visualWidth/cols.length;

    cols.forEach(col=>{
      col.style.setProperty("width",`${widthPerCol}px`,"important");
      col.style.setProperty("min-width",`${widthPerCol}px`,"important");
      col.style.setProperty("max-width",`${widthPerCol}px`,"important");
    });

    const directionWidth=180;
    const total=directionWidth+[...table.querySelectorAll("col[data-roadmap-quarter-col]")].reduce((sum,col)=>{
      return sum+(parseFloat(col.style.width)||col.getBoundingClientRect().width||120);
    },0);

    table.style.setProperty("width",`${total}px`,"important");
    table.style.setProperty("min-width",`${total}px`,"important");

    syncTimelineTopScroll();
    renderRoadmapTodayLine();
  }

  function bindRoadmapQuarterWidthResize(module){
    const table=$("roadmapTable");
    if(!table)return;

    table.querySelectorAll("[data-roadmap-quarter-resize]").forEach(handle=>{
      handle.addEventListener("dblclick",e=>{
        e.preventDefault();
        e.stopPropagation();
        const quarterIndex=Number(handle.dataset.roadmapQuarterResize);
        if(!Number.isFinite(quarterIndex))return;
        resetRoadmapQuarterWidth(module.name,quarterIndex);
        rerenderRoadmapPreservingViewport();
      });

      handle.addEventListener("pointerdown",e=>{
        if(e.button!==0)return;
        e.preventDefault();
        e.stopPropagation();

        const quarterIndex=Number(handle.dataset.roadmapQuarterResize);
        const monthSpan=Math.max(1,Number(handle.dataset.roadmapQuarterMonths)||3);
        const collapsed=handle.dataset.roadmapQuarterCollapsed==="1";
        const header=handle.closest(".roadmap-quarter-group-head");
        if(!header||!Number.isFinite(quarterIndex))return;

        const startX=e.clientX;
        const startVisualWidth=header.getBoundingClientRect().width;
        const startTotalWidth=collapsed?startVisualWidth*monthSpan:startVisualWidth;
        let currentTotalWidth=startTotalWidth;

        document.body.classList.add("roadmap-quarter-width-resizing");

        try{handle.setPointerCapture?.(e.pointerId)}catch(err){}

        const onMove=moveEvent=>{
          const delta=moveEvent.clientX-startX;
          const newVisualWidth=Math.max(80,Math.min(1200,startVisualWidth+delta));
          currentTotalWidth=collapsed?newVisualWidth*monthSpan:newVisualWidth;

          previewRoadmapQuarterWidth(
            quarterIndex,
            currentTotalWidth,
            collapsed,
            monthSpan
          );
        };

        const finish=()=>{
          document.removeEventListener("pointermove",onMove);
          document.removeEventListener("pointerup",onUp);
          document.removeEventListener("pointercancel",onCancel);
          document.body.classList.remove("roadmap-quarter-width-resizing");
          try{handle.releasePointerCapture?.(e.pointerId)}catch(err){}
        };

        const onUp=()=>{
          setRoadmapQuarterWidth(module.name,quarterIndex,currentTotalWidth);
          finish();
          rerenderRoadmapPreservingViewport();
        };

        const onCancel=()=>{
          finish();
          rerenderRoadmapPreservingViewport();
        };

        document.addEventListener("pointermove",onMove);
        document.addEventListener("pointerup",onUp,{once:true});
        document.addEventListener("pointercancel",onCancel,{once:true});
      });
    });
  }

  function roadmapTaskAnchor(fi,ti){
    if(fi===undefined||ti===undefined||fi===null||ti===null)return null;
    const bar=document.querySelector(
      `[data-roadmap-drag-fi="${Number(fi)}"][data-roadmap-drag-ti="${Number(ti)}"]`
    );
    const row=bar?.closest(".roadmap-task-row")||null;
    if(!row)return null;
    return {
      fi:Number(fi),
      ti:Number(ti),
      viewportTop:row.getBoundingClientRect().top
    };
  }

  function rerenderRoadmapPreservingViewport(anchor=null){
    const pageX=window.scrollX||0;
    const pageY=window.scrollY||0;
    const oldRoadmap=$("roadmapScroll");
    const roadmapLeft=oldRoadmap?.scrollLeft||0;
    const roadmapTop=oldRoadmap?.scrollTop||0;
    const topLeft=$("roadmapScrollTop")?.scrollLeft||roadmapLeft;

    render();

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const roadmap=$("roadmapScroll");
        const topScroll=$("roadmapScrollTop");

        // Restore both axes of the roadmap itself. Vertical scrolling is
        // intentionally inside .roadmap-card, so restoring only window.scrollY
        // is not sufficient.
        if(roadmap){
          roadmap.scrollLeft=roadmapLeft;
          roadmap.scrollTop=roadmapTop;
        }
        if(topScroll)topScroll.scrollLeft=topLeft;
        window.scrollTo(pageX,pageY);

        if(anchor){
          const bar=document.querySelector(
            `[data-roadmap-drag-fi="${anchor.fi}"][data-roadmap-drag-ti="${anchor.ti}"]`
          );
          const row=bar?.closest(".roadmap-task-row")||null;

          if(row){
            const newTop=row.getBoundingClientRect().top;
            const delta=newTop-anchor.viewportTop;

            if(Math.abs(delta)>0.5){
              const roadmapCanScroll=roadmap&&roadmap.scrollHeight>roadmap.clientHeight+1;

              if(roadmapCanScroll){
                roadmap.scrollTop+=delta;
              }else{
                window.scrollBy(0,delta);
              }
            }
          }
        }

        requestAnimationFrame(()=>{
          const roadmap2=$("roadmapScroll");
          const topScroll2=$("roadmapScrollTop");

          if(roadmap2){
            roadmap2.scrollLeft=roadmapLeft;
          }
          if(topScroll2)topScroll2.scrollLeft=roadmapLeft;

          renderRoadmapTodayLine();
        });
      });
    });
  }

  function renderRoadmapTodayLine(){
    const table=$("roadmapTable");
    const line=$("roadmapTodayLine");
    if(!table||!line)return;

    const now=new Date();
    const year=now.getFullYear();
    const month=now.getMonth();
    const day=now.getDate();
    const todayMonthIndex=year*12+month;

    const headers=[...table.querySelectorAll("thead [data-roadmap-month-start]")];
    const target=headers.find(header=>{
      const start=Number(header.dataset.roadmapMonthStart);
      const span=Math.max(1,Number(header.dataset.roadmapMonthSpan)||1);
      return Number.isFinite(start)&&todayMonthIndex>=start&&todayMonthIndex<start+span;
    });

    if(!target){
      line.style.display="none";
      return;
    }

    const startMonth=Number(target.dataset.roadmapMonthStart);
    const span=Math.max(1,Number(target.dataset.roadmapMonthSpan)||1);

    const startMeta=monthMetaFromIndex(startMonth);
    const cellStart=new Date(startMeta.year,startMeta.month,1);
    const endMeta=monthMetaFromIndex(startMonth+span);
    const cellEnd=new Date(endMeta.year,endMeta.month,1);
    const today=new Date(year,month,day);

    const fraction=Math.max(0,Math.min(1,(today-cellStart)/(cellEnd-cellStart)));
    const left=target.offsetLeft+(target.offsetWidth*fraction);

    const headerHeight=(
      table.querySelector(".roadmap-quarter-header-row")?.getBoundingClientRect().height||20
    )+(
      table.querySelector(".roadmap-month-header-row")?.getBoundingClientRect().height||18
    );

    line.style.display="block";
    line.style.left=`${left}px`;
    line.style.top=`${headerHeight}px`;
    line.style.height=`${Math.max(0,table.offsetHeight-headerHeight)}px`;

    const label=line.querySelector(".roadmap-today-label");
    if(label)label.title=`Сегодня: ${dateTextValue(`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`)}`;
  }

  function roadmapDropMonthIndex(cell,event){
    const start=Number(cell.dataset.roadmapMonthStart);
    const span=Math.max(1,Number(cell.dataset.roadmapMonthSpan)||1);
    if(!Number.isFinite(start))return null;
    if(span===1)return start;

    const rect=cell.getBoundingClientRect();
    if(!rect.width)return start;

    const x=Math.max(0,Math.min(rect.width-1,(event?.clientX??rect.left)-rect.left));
    const offset=Math.max(0,Math.min(span-1,Math.floor((x/rect.width)*span)));
    return start+offset;
  }

  function roadmapMonthAtPoint(clientX,clientY){
    const el=document.elementFromPoint(clientX,clientY);
    let cell=el?.closest?.("[data-roadmap-month-start]")||null;

    if(!cell){
      const headers=[...document.querySelectorAll("#roadmapTable thead [data-roadmap-month-start]")];
      cell=headers.find(header=>{
        const r=header.getBoundingClientRect();
        return clientX>=r.left&&clientX<=r.right;
      })||null;
    }

    return cell?roadmapDropMonthIndex(cell,{clientX}):null;
  }

  function bindRoadmapResize(){
    const card=$("roadmapScroll");
    if(!card)return;

    card.querySelectorAll("[data-roadmap-resize]").forEach(handle=>{
      handle.addEventListener("dragstart",e=>{
        e.preventDefault();
        e.stopPropagation();
      });

      handle.addEventListener("pointerdown",e=>{
        e.preventDefault();
        e.stopPropagation();

        const fi=Number(handle.dataset.fi);
        const ti=Number(handle.dataset.ti);
        const side=handle.dataset.roadmapResize;
        const task=state[active]?.features?.[fi]?.tasks?.[ti];

        if(!task||dateInputValue(task.actualCloseDate)||statusBucket(task.status)==="closed")return;

        const range=roadmapMonthRange(task,task.status);
        if(range.start===null&&range.end===null)return;

        const initialStart=range.start??range.end;
        const initialEnd=range.end??range.start;
        let candidate=side==="start"?initialStart:initialEnd;

        document.body.classList.add("roadmap-resizing");
        handle.closest(".roadmap-month-task-bar")?.classList.add("roadmap-resizing-bar");

        const preview=document.createElement("div");
        preview.className="roadmap-resize-tooltip";
        document.body.appendChild(preview);

        const updatePreview=()=>{
          const start=side==="start"?candidate:initialStart;
          const end=side==="end"?candidate:initialEnd;
          preview.textContent=`${dateTextValue(monthStartDate(start))} — ${dateTextValue(monthEndDate(end))}`;
          preview.style.left=Math.min(window.innerWidth-210,e.clientX+12)+"px";
          preview.style.top=Math.max(8,e.clientY-30)+"px";
        };
        updatePreview();

        const onMove=moveEvent=>{
          const monthIndex=roadmapMonthAtPoint(moveEvent.clientX,moveEvent.clientY);
          if(monthIndex===null)return;

          candidate=side==="start"
            ? Math.min(monthIndex,initialEnd)
            : Math.max(monthIndex,initialStart);

          const start=side==="start"?candidate:initialStart;
          const end=side==="end"?candidate:initialEnd;
          preview.textContent=`${dateTextValue(monthStartDate(start))} — ${dateTextValue(monthEndDate(end))}`;
          preview.style.left=Math.min(window.innerWidth-210,moveEvent.clientX+12)+"px";
          preview.style.top=Math.max(8,moveEvent.clientY-30)+"px";

          document.querySelectorAll(".roadmap-month-resize-target").forEach(x=>x.classList.remove("roadmap-month-resize-target"));
          const pointEl=document.elementFromPoint(moveEvent.clientX,moveEvent.clientY);
          pointEl?.closest?.("[data-roadmap-month-start]")?.classList.add("roadmap-month-resize-target");
        };

        const finish=()=>{
          document.removeEventListener("pointermove",onMove);
          document.removeEventListener("pointerup",onUp);
          document.removeEventListener("pointercancel",cancel);
          document.body.classList.remove("roadmap-resizing");
          handle.closest(".roadmap-month-task-bar")?.classList.remove("roadmap-resizing-bar");
          document.querySelectorAll(".roadmap-month-resize-target").forEach(x=>x.classList.remove("roadmap-month-resize-target"));
          preview.remove();
        };

        const onUp=()=>{
          const viewportAnchor=roadmapTaskAnchor(fi,ti);

          if(side==="start"){
            task.plannedStartDate=monthStartDate(candidate);
            if(!task.plannedCloseDate)task.plannedCloseDate=monthEndDate(initialEnd);
          }else{
            task.plannedCloseDate=monthEndDate(candidate);
            if(!task.plannedStartDate)task.plannedStartDate=monthStartDate(initialStart);
          }
          finish();
          save();
          rerenderRoadmapPreservingViewport(viewportAnchor);
        };

        const cancel=()=>finish();

        document.addEventListener("pointermove",onMove);
        document.addEventListener("pointerup",onUp,{once:true});
        document.addEventListener("pointercancel",cancel,{once:true});
      });
    });
  }

  function bindRoadmapMonthDrag(){
    const card=$("roadmapScroll");
    if(!card)return;

    let dragData=null;

    card.querySelectorAll("[data-roadmap-drag-fi][data-roadmap-drag-ti]").forEach(bar=>{
      bar.addEventListener("dragstart",e=>{
        const fi=Number(bar.dataset.roadmapDragFi);
        const ti=Number(bar.dataset.roadmapDragTi);
        const feature=state[active]?.features?.[fi];
        const task=feature?.tasks?.[ti];

        if(!task||dateInputValue(task.actualCloseDate)||statusBucket(task.status)==="closed"){
          e.preventDefault();
          return;
        }

        dragData={fi,ti};
        bar.classList.add("roadmap-dragging");

        if(e.dataTransfer){
          e.dataTransfer.effectAllowed="move";
          e.dataTransfer.setData("text/plain",`${fi}:${ti}`);
        }
      });

      bar.addEventListener("dragend",()=>{
        bar.classList.remove("roadmap-dragging");
        document.querySelectorAll(".roadmap-month-drop-target").forEach(el=>el.classList.remove("roadmap-month-drop-target"));
        dragData=null;
      });
    });

    const dropCells=[
      ...card.querySelectorAll("[data-roadmap-month-start]"),
      ...document.querySelectorAll("#roadmapTable thead [data-roadmap-month-start]")
    ];

    [...new Set(dropCells)].forEach(cell=>{
      cell.addEventListener("dragover",e=>{
        if(!dragData)return;
        e.preventDefault();
        if(e.dataTransfer)e.dataTransfer.dropEffect="move";
        cell.classList.add("roadmap-month-drop-target");
      });

      cell.addEventListener("dragleave",()=>{
        cell.classList.remove("roadmap-month-drop-target");
      });

      cell.addEventListener("drop",e=>{
        if(!dragData)return;
        e.preventDefault();

        const monthIndex=roadmapDropMonthIndex(cell,e);
        const task=state[active]?.features?.[dragData.fi]?.tasks?.[dragData.ti];

        if(!task||monthIndex===null||dateInputValue(task.actualCloseDate)||statusBucket(task.status)==="closed")return;

        const viewportAnchor=roadmapTaskAnchor(dragData.fi,dragData.ti);

        task.plannedStartDate=monthStartDate(monthIndex);
        task.plannedCloseDate=monthEndDate(monthIndex);

        dragData=null;
        save();
        rerenderRoadmapPreservingViewport(viewportAnchor);
      });
    });
  }

  function marketingHasValue(field,value){

  function marketingFillLevel(field,value){
    if(!marketingHasValue(field,value))return 0;
    if(field?.type==="checkbox")return 1;
    const n=Math.max(0,Math.floor(Number(value)||0));
    if(n<=1)return 1;
    if(n<=3)return 2;
    if(n<=5)return 3;
    if(n<=8)return 4;
    if(n<=12)return 5;
    return 6;
  }

  function marketingFillClass(field,value){

  function syncTimelineTopScroll(){
    const scroll=$("roadmapScroll");
    const topScroll=$("roadmapScrollTop");
    const topInner=$("roadmapScrollTopInner");
    const table=$("roadmapTable");
    if(!scroll||!topScroll||!topInner||!table)return;

    const stickyWidth=180;

    // The roadmap can have a vertical scrollbar. Use its real clientWidth
    // instead of CSS calc(100% - 180px), otherwise the upper scrollbar
    // becomes wider than the visible timeline by the scrollbar width.
    const visibleTimelineWidth=Math.max(0,scroll.clientWidth-stickyWidth);
    topScroll.style.marginLeft=stickyWidth+"px";
    topScroll.style.width=visibleTimelineWidth+"px";

    const scrollableWidth=Math.max(
      visibleTimelineWidth,
      table.scrollWidth-stickyWidth
    );
    topInner.style.width=scrollableWidth+"px";

    if(!topScroll.dataset.bound){
      let syncing=false;

      scroll.addEventListener("scroll",()=>{
        if(syncing)return;
        syncing=true;
        if(topScroll.scrollLeft!==scroll.scrollLeft){
          topScroll.scrollLeft=scroll.scrollLeft;
        }
        syncing=false;
      });

      topScroll.addEventListener("scroll",()=>{
        if(syncing)return;
        syncing=true;
        const keepTop=scroll.scrollTop;
        scroll.scrollLeft=topScroll.scrollLeft;
        // Horizontal synchronization must not alter the internal vertical
        // position of the roadmap.
        if(scroll.scrollTop!==keepTop)scroll.scrollTop=keepTop;
        syncing=false;
      });

      topScroll.dataset.bound="1";
    }

    topScroll.scrollLeft=scroll.scrollLeft;
  }

  function taskBucket(t){
    const s=String(t.status||"").trim().toLowerCase();
    if(s==="закрыто")return "closed";
    if(["в планах","планируется (нет задачи)","планируется","планирование","backlog"].includes(s))return "planned";
    return "inwork";
  }
  function passesStageFilter(t){
    const bucketOk=!taskStageFilters.size||taskStageFilters.has(taskBucket(t));
    const exactOk=!topStageFilters.size||topStageFilters.has(String(t.status||"").trim()||"Без статуса");
    const quarterOk=taskMatchesQuarterFilter(t,t.status);
    return bucketOk&&exactOk&&quarterOk;
  }
  function featureQueryMatch(f){return !!q()&&(matches(f.name)||matches(f.why)||matches(f.monetization))}
  function taskQueryMatch(t,f){return !q()||featureQueryMatch(f)||matches(taskText(t))}
  function featureVisible(f){
    if(topDirectionFilters.size && !topDirectionFilters.has(f.name))return false;
    if(!q()&&!taskStageFilters.size&&!topStageFilters.size&&!topPriorityFilters.size&&!topQuarterFilters.size)return true;
    return f.tasks.some(t=>passesStageFilter(t)&&taskMatchesPriorityFilter(t,f)&&taskQueryMatch(t,f));
  }

  function visibleTasks(f){
    return f.tasks.filter(t=>passesStageFilter(t)&&taskMatchesPriorityFilter(t,f)&&taskQueryMatch(t,f))
  }

  function spentHoursForTasks(tasks){
    const total=(tasks||[]).reduce((sum,t)=>{
      const raw=String(t?.spentHours??"").trim().replace(/\s+/g,"").replace(",",".");
      const value=Number.parseFloat(raw);
      return sum+(Number.isFinite(value)?value:0);
    },0);
    return Math.round(total*10)/10;
  }

  function clearDragMarks(){
    document.querySelectorAll(".feature-row,.task-item,.task-list,.stage-group,.stage-group-head").forEach(el=>{
      el.classList.remove(
        "dragging-feature","feature-drop-before","feature-drop-after",
        "dragging-task","task-drop-before","task-drop-after","task-list-drop",
        "dragging-stage","stage-drop-before","stage-drop-after"
      );
    });
  }

  function reorderStage(stageName,targetStage,after){
    const module=state[active];
    if(!module||!stageName||!targetStage||stageName===targetStage)return false;

    const order=getStageOrder(module);
    const from=order.indexOf(stageName);
    const to=order.indexOf(targetStage);
    if(from===-1||to===-1)return false;

    order.splice(from,1);
    let insertAt=order.indexOf(targetStage);
    if(after)insertAt++;
    order.splice(Math.max(0,Math.min(insertAt,order.length)),0,stageName);

    module.stageOrder=order;
    return true;
  }

  function insertTaskAtStage(feature,t,stage,beforeIndex=null){
    t.status=stage;
    const list=feature.tasks;
    if(beforeIndex!==null){
      list.splice(beforeIndex,0,t);
      return;
    }
    let last=-1;
    list.forEach((x,i)=>{if(String(x.status||"Планируется")===stage)last=i});
    list.splice(last>=0?last+1:list.length,0,t);
  }

  function bindDragAndDrop(){
    document.querySelectorAll(".stage-group-head").forEach(head=>{
      head.addEventListener("dragstart",e=>{
        if(e.target.closest("button,input,select,textarea,a")){e.preventDefault();return}
        const stage=head.dataset.dragStage;
        if(!stage){e.preventDefault();return}
        dragContext={kind:"stage",stage};
        justDragged=true;
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",JSON.stringify(dragContext));
        head.classList.add("dragging-stage");
        hidePopover();
      });
      head.addEventListener("dragend",()=>{
        dragContext=null;
        clearDragMarks();
        setTimeout(()=>{justDragged=false},80);
      });
    });

    document.querySelectorAll(".stage-group").forEach(group=>{
      group.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="stage")return;
        e.preventDefault();
        e.stopPropagation();

        document.querySelectorAll(".stage-group").forEach(x=>{
          x.classList.remove("stage-drop-before","stage-drop-after");
        });

        const head=group.querySelector(".stage-group-head");
        const r=(head||group).getBoundingClientRect();
        const horizontal=!!group.closest(".feature-focus-row");
        const after=horizontal?e.clientX>=r.left+r.width/2:e.clientY>=r.top+r.height/2;
        group.classList.add(after?"stage-drop-after":"stage-drop-before");
        e.dataTransfer.dropEffect="move";
      });

      group.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="stage")return;
        e.preventDefault();
        e.stopPropagation();

        const targetStage=group.dataset.stageName;
        const head=group.querySelector(".stage-group-head");
        const r=(head||group).getBoundingClientRect();
        const horizontal=!!group.closest(".feature-focus-row");
        const after=horizontal?e.clientX>=r.left+r.width/2:e.clientY>=r.top+r.height/2;

        if(reorderStage(dragContext.stage,targetStage,after)){
          dragContext=null;
          clearDragMarks();
          save();
          render();
          return;
        }

        dragContext=null;
        clearDragMarks();
      });
    });

    document.querySelectorAll(".feature-panel").forEach(panel=>{
      panel.addEventListener("dragstart",e=>{
        if(e.target.closest("button,input,select,textarea,a")){e.preventDefault();return}
        const fi=Number(panel.dataset.dragFeature);
        if(Number.isNaN(fi)){e.preventDefault();return}
        dragContext={kind:"feature",fi};
        justDragged=true;
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",JSON.stringify(dragContext));
        panel.closest(".feature-row")?.classList.add("dragging-feature");
        hidePopover();
      });
      panel.addEventListener("dragend",()=>{
        dragContext=null;
        clearDragMarks();
        setTimeout(()=>{justDragged=false},80);
        requestAnimationFrame(drawNetworkArrows);
      });
    });

    document.querySelectorAll(".feature-row").forEach(row=>{
      row.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="feature")return;
        e.preventDefault();
        document.querySelectorAll(".feature-row").forEach(x=>x.classList.remove("feature-drop-before","feature-drop-after"));
        const r=row.getBoundingClientRect();
        row.classList.add(e.clientX<r.left+r.width/2?"feature-drop-before":"feature-drop-after");
        e.dataTransfer.dropEffect="move";
      });
      row.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="feature")return;
        e.preventDefault();
        const from=dragContext.fi,to=Number(row.dataset.fi);
        if(Number.isNaN(from)||Number.isNaN(to)){clearDragMarks();return}
        const r=row.getBoundingClientRect();
        const after=e.clientX>=r.left+r.width/2;
        const features=state[active].features;
        if(from===to){dragContext=null;clearDragMarks();return}
        const [moved]=features.splice(from,1);
        let insertAt=to+(after?1:0);
        if(from<insertAt)insertAt--;
        features.splice(Math.max(0,Math.min(insertAt,features.length)),0,moved);
        collapsed.clear();
        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });

    document.querySelectorAll(".task-item").forEach(item=>{
      item.addEventListener("dragstart",e=>{
        if(e.target.closest("button,input,select,textarea,a")){e.preventDefault();return}
        const fi=Number(item.dataset.taskFi),ti=Number(item.dataset.taskTi);
        if(Number.isNaN(fi)||Number.isNaN(ti)){e.preventDefault();return}
        dragContext={kind:"task",fi,ti};
        justDragged=true;
        e.dataTransfer.effectAllowed="move";
        e.dataTransfer.setData("text/plain",JSON.stringify(dragContext));
        item.classList.add("dragging-task");
        hidePopover();
      });
      item.addEventListener("dragend",()=>{
        dragContext=null;
        clearDragMarks();
        setTimeout(()=>{justDragged=false},80);
      });
    });

    document.querySelectorAll(".task-item").forEach(item=>{
      item.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="task")return;
        e.preventDefault();
        e.stopPropagation();
        document.querySelectorAll(".task-item").forEach(x=>x.classList.remove("task-drop-before","task-drop-after"));
        const r=item.getBoundingClientRect();
        item.classList.add(e.clientY<r.top+r.height/2?"task-drop-before":"task-drop-after");
        e.dataTransfer.dropEffect="move";
      });
      item.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="task")return;
        e.preventDefault();
        e.stopPropagation();

        const srcFi=dragContext.fi,srcTi=dragContext.ti;
        const dstFi=Number(item.dataset.taskFi),rawDstTi=Number(item.dataset.taskTi);
        if([srcFi,srcTi,dstFi,rawDstTi].some(Number.isNaN)){clearDragMarks();return}

        const r=item.getBoundingClientRect();
        const after=e.clientY>=r.top+r.height/2;
        const source=state[active].features[srcFi].tasks;
        const destination=state[active].features[dstFi].tasks;
        const targetTask=destination[rawDstTi];
        const targetStage=String(targetTask?.status||"Планируется");

        const [moved]=source.splice(srcTi,1);
        let dstTi=rawDstTi;
        if(srcFi===dstFi&&srcTi<dstTi)dstTi--;
        if(after)dstTi++;
        dstTi=Math.max(0,Math.min(dstTi,destination.length));

        moved.status=targetStage;
        destination.splice(dstTi,0,moved);

        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });

    document.querySelectorAll(".stage-group").forEach(group=>{
      group.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="task"||e.target.closest(".task-item"))return;
        e.preventDefault();
        group.classList.add("task-list-drop");
        e.dataTransfer.dropEffect="move";
      });
      group.addEventListener("dragleave",e=>{
        if(!group.contains(e.relatedTarget))group.classList.remove("task-list-drop");
      });
      group.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="task"||e.target.closest(".task-item"))return;
        e.preventDefault();

        const srcFi=dragContext.fi,srcTi=dragContext.ti,dstFi=Number(group.dataset.taskListFi);
        const stage=group.dataset.stageName||"В планах";
        if([srcFi,srcTi,dstFi].some(Number.isNaN)){clearDragMarks();return}

        const source=state[active].features[srcFi].tasks;
        const destinationFeature=state[active].features[dstFi];
        const [moved]=source.splice(srcTi,1);
        insertTaskAtStage(destinationFeature,moved,stage);

        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });

    document.querySelectorAll(".task-list").forEach(list=>{
      list.addEventListener("dragover",e=>{
        if(!dragContext||dragContext.kind!=="task")return;
        if(e.target.closest(".task-item")||e.target.closest(".stage-group"))return;
        e.preventDefault();
        list.classList.add("task-list-drop");
      });
      list.addEventListener("drop",e=>{
        if(!dragContext||dragContext.kind!=="task"||e.target.closest(".task-item")||e.target.closest(".stage-group"))return;
        e.preventDefault();
        const srcFi=dragContext.fi,srcTi=dragContext.ti,dstFi=Number(list.dataset.taskListFi);
        if([srcFi,srcTi,dstFi].some(Number.isNaN)){clearDragMarks();return}
        const source=state[active].features[srcFi].tasks;
        const [moved]=source.splice(srcTi,1);
        state[active].features[dstFi].tasks.push(moved);
        dragContext=null;
        clearDragMarks();
        save();
        render();
      });
    });
  }

  function syncTopScroll(){
    const top=$("topScroll"),inner=$("topScrollInner"),view=$("roadmapView"),board=$("networkBoard");
    if(!top||!inner||!view||!board)return;
    inner.style.width=Math.max(board.scrollWidth,board.offsetWidth)+"px";
    top.scrollLeft=view.scrollLeft;
  }

  let syncingScroll=false;
  function bindScrollSync(){
    const top=$("topScroll"),view=$("roadmapView");
    if(!top||!view||top.dataset.bound==="1")return;
    top.dataset.bound="1";

    top.addEventListener("scroll",()=>{
      if(syncingScroll)return;
      syncingScroll=true;
      view.scrollLeft=top.scrollLeft;
      requestAnimationFrame(()=>{syncingScroll=false;drawNetworkArrows()});
    });

    view.addEventListener("scroll",()=>{
      if(syncingScroll)return;
      syncingScroll=true;
      top.scrollLeft=view.scrollLeft;
      requestAnimationFrame(()=>{syncingScroll=false;drawNetworkArrows()});
    });
  }

  function drawNetworkArrows(){
    const svg=$("networkSvg"),board=$("networkBoard"),root=$("networkRoot");
    if(!svg||!board||!root)return;
    while(svg.lastElementChild && svg.lastElementChild.tagName.toLowerCase()!=="defs")svg.removeChild(svg.lastElementChild);

    const cards=[...document.querySelectorAll(".feature-panel")];
    if(!cards.length)return;

    const br=board.getBoundingClientRect();
    const rr=root.getBoundingClientRect();
    const width=Math.max(board.clientWidth,board.scrollWidth);
    const height=board.scrollHeight;

    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.setAttribute("width",width);
    svg.setAttribute("height",height);
    svg.style.width=width+"px";

    const sx=(rr.left+rr.width/2-br.left)||width/2;
    const sy=Math.max(4,rr.bottom-br.top+2);

    cards.forEach(card=>{
      const cr=card.getBoundingClientRect();
      const tx=cr.left+cr.width/2-br.left;
      const ty=cr.top-br.top-7;
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      const curve=Math.max(14,Math.min(38,(ty-sy)*.35));
      path.setAttribute("d",`M ${sx} ${sy} C ${sx} ${sy+curve}, ${tx} ${ty-curve}, ${tx} ${ty}`);
      path.setAttribute("fill","none");
      path.setAttribute("stroke","#93AFC1");
      path.setAttribute("stroke-width","1.5");
      path.setAttribute("marker-end","url(#arrowHead)");
      path.setAttribute("vector-effect","non-scaling-stroke");
      svg.appendChild(path);
    });
  }

        textInput.value=dateTextValue(native.value);
        textInput.classList.remove("date-input-invalid");
        textInput.dispatchEvent(new Event("change",{bubbles:true}));
      }
      cleanup();

      if(typeof native.showPicker==="function"){

document.addEventListener("click",e=>{
    const taskCard=e.target.closest(".task-item[data-task-url]");
    if(taskCard && justDragged){
      e.preventDefault();
      return;
    }
    if(taskCard && !e.target.closest("button,a,input,select,textarea")){
      window.open(taskCard.dataset.taskUrl,"_blank","noopener,noreferrer");
      return;
    }

    const featurePanel=e.target.closest(".feature-panel[data-feature-filter]");
    if(featurePanel && !e.target.closest("button,a,input,select,textarea") && !justDragged){
      const name=featurePanel.dataset.featureFilter||"";
      if(name){
        if(focusedFeatureName===name){
          focusedFeatureName=null;
          if(topDirectionFilters.size===1&&topDirectionFilters.has(name))topDirectionFilters.clear();
        }else{
          focusedFeatureName=name;
          topDirectionFilters=new Set([name]);
        }
        closeTopFilterMenu();
        render();
        return;
      }
    }

    const a=e.target.closest("[data-action]");
    if(a){
      const act=a.dataset.action,fi=Number(a.dataset.fi),ti=Number(a.dataset.ti),key=`${active}:${fi}`;
      if(act==="toggle"){collapsed.has(key)?collapsed.delete(key):collapsed.add(key);render();return}
      if(act==="edit-feature"){featureModal(fi);return}
      if(act==="add-task"){taskModal(fi,null);return}
      if(act==="edit-task"){taskModal(fi,ti);return}
      if(act==="task-money"){taskMoneyModal(fi,ti);return}
      if(act==="feature-money"){featureMoneyModal(fi);return}
      if(act==="edit-description-section"){
        descriptionSectionModal(a.dataset.descriptionKey,a.dataset.descriptionTitle||"Описание");
        return;
      }
      if(act==="delete-task"&&confirm("Удалить доработку?")){state[active].features[fi].tasks.splice(ti,1);save();render();return}
      if(act==="delete-feature"&&confirm("Удалить функционал и все его доработки?")){state[active].features.splice(fi,1);save();render();return}
    }
    const b=e.target.closest("[data-modal]");
    if(!b)return;
    const act=b.dataset.modal;
    if(act==="cancel"){closeModal();return}
    if(act==="rollback-version"){rollbackVersion(b.dataset.versionId);return}
    if(act==="save-module"){
      const name=$("mName").value.trim();if(!name)return;
      state[active].name=name;save();closeModal();render();return
    }
    if(act==="save-description"){
      state[active].description={
        users:$("dUsers").value.trim(),
        beneficiaries:$("dBeneficiaries").value.trim(),
        area:$("dArea").value.trim(),
        functional:$("dFunctional").value.trim(),
        benefits:$("dBenefits").value.trim(),
        competitors:$("dCompetitors").value.trim(),
        usp:$("dUsp").value.trim()
      };
      save();closeModal();render();return
    }
    if(act==="save-description-section"){
      const key=b.dataset.descriptionKey;
      if(!state[active].description)state[active].description={};
      state[active].description[key]=$("descriptionSectionValue").value.trim();
      save();closeModal();render();return
    }
    if(act==="save-feature"){
      const raw=b.dataset.fi,name=$("fName").value.trim();if(!name)return;
      const level=$("fLevel").value;
      const reason=$("fReason").value.trim();
      const obj={
        name,
        why:$("fWhy").value.trim(),
        monetizationLevel:level,
        monetizationReason:reason,
        monetization:reason?`${level}. ${reason}`:`${level}.`,
        tasks:[]
      };
      if(raw==="")state[active].features.push(obj);
      else{
        const i=Number(raw);
        obj.tasks=state[active].features[i].tasks;
        state[active].features[i]=obj;
      }
      save();closeModal();render();return
    }
    if(act==="save-task"){
      const oldFi=Number(b.dataset.fi),raw=b.dataset.ti,newFi=Number($("tFeature").value);
      const plannedStartDate=normalizeTaskDateField("tPlannedStartDate");
      const plannedCloseDate=normalizeTaskDateField("tPlannedCloseDate");
      const actualStartDate=normalizeTaskDateField("tActualStartDate");
      const actualCloseDate=normalizeTaskDateField("tActualCloseDate");

      if([plannedStartDate,plannedCloseDate,actualStartDate,actualCloseDate].some(value=>value===null)){
        return;
      }

      const obj={
        number:$("tNumber").value.trim().replace(/^#/,""),
        status:$("tStatus").value,
        title:$("tTitle").value.trim(),
        plannedStartDate,
        plannedCloseDate,
        actualStartDate,
        actualCloseDate,
        spentHours:$("tSpentHours").value.trim(),
        estimate:$("tEstimate").value.trim(),
        monetizationLevel:$("tMoneyLevel").value,
        monetizationReason:$("tMoneyReason").value.trim()
      };
      if(!obj.title)return;

      if(raw===""){
        state[active].features[newFi].tasks.push(obj);
      }else{
        const ti=Number(raw);
        if(oldFi===newFi)state[active].features[oldFi].tasks[ti]=obj;
        else{
          state[active].features[oldFi].tasks.splice(ti,1);
          state[active].features[newFi].tasks.push(obj);
        }
      }
      save();closeModal();render();return
    }
  });

  function download(name,content,type){
    const blob=new Blob([content],{type:type||"application/octet-stream"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");

    a.href=url;
    a.download=name;
    a.style.display="none";
    document.body.appendChild(a);

    // Один пользовательский клик -> одно обычное браузерное скачивание
    // в папку загрузок. Никаких дополнительных окон/ссылок.
    a.click();

    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }

  function hasExportValue(v){

  function availableExportFields(module){
    const features=Array.isArray(module?.features)?module.features:[];
    const tasks=features.flatMap(f=>(f.tasks||[]).map(t=>({f,t})));

    return EXPORT_FIELDS.filter(field=>{
      if(field.entity==="module"){
        return field.always || hasExportValue(field.get(module));
      }
      if(field.entity==="feature"){
        if(!features.length)return false;
        return field.always || features.some(f=>hasExportValue(field.get(module,f)));
      }
      if(field.entity==="task"){
        if(!tasks.length)return false;
        return field.always || tasks.some(({f,t})=>hasExportValue(field.get(module,f,t)));
      }
      return false;
    });
  }

  function exportStateToCsv(selectedFieldIds){
    const module=state[active];
    if(!module)return "";

    const selectedSet=new Set(selectedFieldIds||[]);
    const fields=availableExportFields(module).filter(field=>selectedSet.has(field.id));
    if(!fields.length)return "";

    const entityDepth={module:0,feature:1,task:2};
    const deepest=Math.max(...fields.map(field=>entityDepth[field.entity]??0));
    const rows=[fields.map(field=>field.label)];
    const features=Array.isArray(module.features)?module.features:[];

    const pushRow=(feature=null,task=null)=>{
      rows.push(fields.map(field=>field.get(module,feature,task)));
    };

    if(deepest===0){
      pushRow();
    }else if(deepest===1){
      features.forEach(feature=>pushRow(feature,null));
    }else{
      features.forEach(feature=>{
        (feature.tasks||[]).forEach(task=>pushRow(feature,task));
      });
    }

    return "\ufeff"+rows.map(r=>r.map(escapeCsv).join(";")).join("\r\n");
  }

  function promotionSummaryXmlEscape(value){
    return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[ch]));
  }

  function promotionSummaryXlsxCol(index){
    let n=index+1,out="";
    while(n){n--;out=String.fromCharCode(65+(n%26))+out;n=Math.floor(n/26)}
    return out;
  }

  let promotionSummaryCrcTable=null;
  function promotionSummaryCrc32(bytes){
    if(!promotionSummaryCrcTable){
      promotionSummaryCrcTable=new Uint32Array(256);
      for(let n=0;n<256;n++){
        let c=n;
        for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
        promotionSummaryCrcTable[n]=c>>>0;
      }
    }
    let crc=0xFFFFFFFF;
    for(const b of bytes)crc=promotionSummaryCrcTable[(crc^b)&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }

  function promotionSummaryZipStore(files){
    const enc=new TextEncoder();
    const chunks=[];
    const central=[];
    let offset=0;
    const push16=(arr,v)=>{arr.push(v&255,(v>>>8)&255)};
    const push32=(arr,v)=>{arr.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255)};

    files.forEach(file=>{
      const name=enc.encode(file.name);
      const data=typeof file.data==="string"?enc.encode(file.data):file.data;
      const crc=promotionSummaryCrc32(data);
      const local=[];
      push32(local,0x04034b50);push16(local,20);push16(local,0x0800);push16(local,0);
      push16(local,0);push16(local,0);push32(local,crc);push32(local,data.length);push32(local,data.length);
      push16(local,name.length);push16(local,0);
      const localBytes=new Uint8Array(local.length+name.length);
      localBytes.set(local,0);localBytes.set(name,local.length);
      chunks.push(localBytes,data);

      const cd=[];
      push32(cd,0x02014b50);push16(cd,20);push16(cd,20);push16(cd,0x0800);push16(cd,0);
      push16(cd,0);push16(cd,0);push32(cd,crc);push32(cd,data.length);push32(cd,data.length);
      push16(cd,name.length);push16(cd,0);push16(cd,0);push16(cd,0);push16(cd,0);push32(cd,0);push32(cd,offset);
      const cdBytes=new Uint8Array(cd.length+name.length);
      cdBytes.set(cd,0);cdBytes.set(name,cd.length);
      central.push(cdBytes);
      offset+=localBytes.length+data.length;
    });

    const centralOffset=offset;
    central.forEach(c=>{chunks.push(c);offset+=c.length});
    const centralSize=offset-centralOffset;
    const end=[];
    push32(end,0x06054b50);push16(end,0);push16(end,0);push16(end,files.length);push16(end,files.length);
    push32(end,centralSize);push32(end,centralOffset);push16(end,0);
    chunks.push(new Uint8Array(end));

    const total=chunks.reduce((sum,c)=>sum+c.length,0);
    const out=new Uint8Array(total);
    let pos=0;
    chunks.forEach(c=>{out.set(c,pos);pos+=c.length});
    return out;
  }

  function normalizeHeader(value){
    return String(value||"")
      .replace(/^\ufeff/,"")
      .trim()
      .toLowerCase()
      .replace(/\s+/g," ");
  }

  function detectDelimiter(line){
    const candidates=[";","\t",","];
    let best=";", bestCount=-1;

    candidates.forEach(delimiter=>{
      let count=0, inQuotes=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'){
          if(inQuotes&&line[i+1]==='"'){i++;continue}
          inQuotes=!inQuotes;
        }else if(ch===delimiter&&!inQuotes){
          count++;
        }
      }
      if(count>bestCount){
        bestCount=count;
        best=delimiter;
      }
    });
    return best;
  }

  function parseDelimited(text){
    text=String(text||"").replace(/^\ufeff/,"");
    const firstLine=text.split(/\r?\n/,1)[0]||"";
    const delimiter=detectDelimiter(firstLine);

    const rows=[]; let row=[]; let value=""; let inQuotes=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i], next=text[i+1];
      if(ch==='"'){
        if(inQuotes&&next==='"'){value+='"';i++;}
        else inQuotes=!inQuotes;
      }else if(ch===delimiter&&!inQuotes){
        row.push(value); value="";
      }else if((ch==="\n"||ch==="\r")&&!inQuotes){
        if(ch==="\r"&&next==="\n")i++;
        row.push(value); rows.push(row); row=[]; value="";
      }else{
        value+=ch;
      }
    }
    if(value!==""||row.length){row.push(value);rows.push(row);}
    return rows.filter(r=>r.some(cell=>String(cell||"").trim()!==""));
  }


  function xlsxColumnIndex(cellRef){
    const match=String(cellRef||"").match(/^([A-Z]+)/i);
    if(!match)return 0;
    let index=0;
    for(const ch of match[1].toUpperCase()){
      index=index*26+(ch.charCodeAt(0)-64);
    }
    return Math.max(0,index-1);
  }

  function xlsxNormalizePath(base,target){
    const raw=String(target||"").replace(/\\/g,"/");
    if(raw.startsWith("/"))return raw.replace(/^\/+/,"");
    const parts=(String(base||"")+raw).split("/");
    const out=[];
    parts.forEach(part=>{
      if(!part||part===".")return;
      if(part==="..")out.pop();
      else out.push(part);
    });
    return out.join("/");
  }

  async function xlsxInflateRaw(bytes){
    if(typeof DecompressionStream==="undefined"){
      throw new Error("Браузер не поддерживает распаковку XLSX. Откройте страницу в актуальном Chrome/Edge.");
    }
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function openXlsxZip(arrayBuffer){
    const bytes=new Uint8Array(arrayBuffer);
    const view=new DataView(arrayBuffer);
    const decoder=new TextDecoder("utf-8");
    let eocd=-1;
    const min=Math.max(0,bytes.length-0xFFFF-22);
    for(let i=bytes.length-22;i>=min;i--){
      if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}
    }
    if(eocd<0)throw new Error("Файл не похож на XLSX: не найден ZIP-каталог.");

    const total=view.getUint16(eocd+10,true);
    const centralOffset=view.getUint32(eocd+16,true);
    const entries=new Map();
    let pos=centralOffset;

    for(let n=0;n<total;n++){
      if(view.getUint32(pos,true)!==0x02014b50)throw new Error("Повреждён каталог XLSX.");
      const method=view.getUint16(pos+10,true);
      const compressedSize=view.getUint32(pos+20,true);
      const fileNameLength=view.getUint16(pos+28,true);
      const extraLength=view.getUint16(pos+30,true);
      const commentLength=view.getUint16(pos+32,true);
      const localOffset=view.getUint32(pos+42,true);
      const name=decoder.decode(bytes.subarray(pos+46,pos+46+fileNameLength));
      entries.set(name,{method,compressedSize,localOffset});
      pos+=46+fileNameLength+extraLength+commentLength;
    }

    const readEntry=async name=>{
      const meta=entries.get(name);
      if(!meta)return null;
      const p=meta.localOffset;
      if(view.getUint32(p,true)!==0x04034b50)throw new Error(`Повреждена запись XLSX: ${name}`);
      const fileNameLength=view.getUint16(p+26,true);
      const extraLength=view.getUint16(p+28,true);
      const start=p+30+fileNameLength+extraLength;
      const compressed=bytes.subarray(start,start+meta.compressedSize);
      if(meta.method===0)return new Uint8Array(compressed);
      if(meta.method===8)return await xlsxInflateRaw(compressed);
      throw new Error(`Неподдерживаемое сжатие XLSX (${meta.method}).`);
    };

    const readText=async name=>{
      const data=await readEntry(name);
      return data===null?null:decoder.decode(data);
    };

    return {entries,readEntry,readText};
  }

  function xlsxXml(text,label){
    const doc=new DOMParser().parseFromString(String(text||""),"application/xml");
    if(doc.getElementsByTagName("parsererror").length){
      throw new Error(`Не удалось прочитать XML XLSX: ${label}.`);
    }
    return doc;
  }

  async function parseXlsxRows(file){
    const zip=openXlsxZip(await file.arrayBuffer());

    const workbookText=await zip.readText("xl/workbook.xml");
    if(!workbookText)throw new Error("В XLSX не найден workbook.xml.");
    const workbook=xlsxXml(workbookText,"workbook.xml");
    const sheet=workbook.getElementsByTagName("sheet")[0];
    if(!sheet)throw new Error("В XLSX нет листов.");
    const relId=sheet.getAttribute("r:id")||sheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");

    let sheetPath="xl/worksheets/sheet1.xml";
    const relsText=await zip.readText("xl/_rels/workbook.xml.rels");
    if(relsText&&relId){
      const rels=xlsxXml(relsText,"workbook.xml.rels");
      const relationships=Array.from(rels.getElementsByTagName("Relationship"));
      const rel=relationships.find(item=>item.getAttribute("Id")===relId);
      if(rel?.getAttribute("Target")){
        sheetPath=xlsxNormalizePath("xl/",rel.getAttribute("Target"));
      }
    }

    const shared=[];
    const sharedText=await zip.readText("xl/sharedStrings.xml");
    if(sharedText){
      const sharedDoc=xlsxXml(sharedText,"sharedStrings.xml");
      Array.from(sharedDoc.getElementsByTagName("si")).forEach(si=>{
        shared.push(Array.from(si.getElementsByTagName("t")).map(t=>t.textContent||"").join(""));
      });
    }

    const sheetText=await zip.readText(sheetPath);
    if(!sheetText)throw new Error("Не удалось найти первый лист XLSX.");
    const sheetDoc=xlsxXml(sheetText,sheetPath);
    const rows=[];

    Array.from(sheetDoc.getElementsByTagName("row")).forEach(rowNode=>{
      const row=[];
      Array.from(rowNode.getElementsByTagName("c")).forEach(cell=>{
        const col=xlsxColumnIndex(cell.getAttribute("r"));
        const type=cell.getAttribute("t")||"";
        let value="";
        if(type==="inlineStr"){
          value=Array.from(cell.getElementsByTagName("t")).map(t=>t.textContent||"").join("");
        }else{
          const valueNode=cell.getElementsByTagName("v")[0];
          const raw=valueNode?valueNode.textContent||"":"";
          if(type==="s"){
            const index=Number(raw);
            value=Number.isFinite(index)?(shared[index]??""):"";
          }else if(type==="b"){
            value=raw==="1"?"TRUE":"FALSE";
          }else{
            value=raw;
          }
        }
        row[col]=value;
      });
      for(let i=0;i<row.length;i++)if(row[i]===undefined)row[i]="";
      rows.push(row);
    });

    return rows.filter(row=>row.some(cell=>String(cell??"").trim()!==""));
  }

  async function readTaskUpdateRows(file){
    const name=String(file?.name||"").toLowerCase();
    if(name.endsWith(".xlsx")){
      return await parseXlsxRows(file);
    }
    if(name.endsWith(".csv")||name.endsWith(".txt")){
      return parseDelimited(await file.text());
    }
    throw new Error("Поддерживаются файлы .xlsx, .csv и .txt.");
  }

  function guessTaskUpdateColumn(field,headers){
    const normalized=headers.map(normalizeHeader);
    for(const alias of field.aliases){
      const index=normalized.indexOf(normalizeHeader(alias));
      if(index!==-1)return index;
    }
    return -1;
  }

  function normalizeImportedTaskNumber(value){
    return String(value??"")
      .trim()
      .replace(/^#/,"")
      .replace(/\.0+$/,"")
      .replace(/\s+/g,"");
  }

  function normalizeImportedDate(value){
    const raw=String(value??"").trim();
    if(!raw)return "";

    let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s].*)?$/);
    if(m){
      return `${m[1]}-${String(Number(m[2])).padStart(2,"0")}-${String(Number(m[3])).padStart(2,"0")}`;
    }

    m=raw.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    if(m){
      return `${m[3]}-${String(Number(m[2])).padStart(2,"0")}-${String(Number(m[1])).padStart(2,"0")}`;
    }

    if(/^\d+(?:[.,]\d+)?$/.test(raw)){
      const serial=Number(raw.replace(",","."));
      if(Number.isFinite(serial)&&serial>20000&&serial<100000){
        const wholeDays=Math.floor(serial+1e-9);
        const date=new Date(Date.UTC(1899,11,30)+wholeDays*86400000);
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,"0")}-${String(date.getUTCDate()).padStart(2,"0")}`;
      }
    }
    return null;
  }

  function normalizeImportedPriority(value){
    const raw=String(value??"").trim();
    if(!raw)return "";
    const normalized=raw.toLowerCase();
    if(["высокий","high"].includes(normalized))return "Высокий";
    if(["средний","medium","normal"].includes(normalized))return "Средний";
    if(["низкий","low"].includes(normalized))return "Низкий";
    return null;
  }

  function findFeatureIndexByName(module,name){
    const needle=String(name||"").trim().toLowerCase();
    if(!needle)return -1;
    return (module.features||[]).findIndex(feature=>String(feature.name||"").trim().toLowerCase()===needle);
  }

  function ensureFeatureForTaskUpdate(module,name,stats){
    const clean=String(name||"").trim()||"Не распределено";

    let index=findFeatureIndexByName(module,clean);
    if(index!==-1)return index;

    module.features.push({
      name:clean,
      why:"",
      monetization:"Средний.",
      monetizationLevel:"Средний",
      monetizationReason:"",
      tasks:[]
    });
    stats.featuresCreated++;
    return module.features.length-1;
  }

  function findTaskMatchesByNumber(module,number){
    const result=[];
    (module.features||[]).forEach((feature,fi)=>{
      (feature.tasks||[]).forEach((task,ti)=>{
        if(normalizeImportedTaskNumber(task.number)===number){
          result.push({feature,task,fi,ti});
        }
      });
    });
    return result;
  }

  function removeTaskNumberFromModule(module,number){
    (module.features||[]).forEach(feature=>{
      feature.tasks=(feature.tasks||[]).filter(task=>normalizeImportedTaskNumber(task.number)!==number);
    });
  }

  function importedFieldValue(row,mapping,fieldId){
    const index=mapping[fieldId];
    if(index===undefined||index===null||index==="")return "";
    return String(row[Number(index)]??"").trim();
  }

  function applyNonEmptyTaskUpdate(task,row,mapping,stats){
    const status=importedFieldValue(row,mapping,"status");
    const title=importedFieldValue(row,mapping,"title");
    const plannedStartRaw=importedFieldValue(row,mapping,"plannedStartDate");
    const plannedCloseRaw=importedFieldValue(row,mapping,"plannedCloseDate");
    const actualStartRaw=importedFieldValue(row,mapping,"actualStartDate");
    const actualCloseRaw=importedFieldValue(row,mapping,"actualCloseDate");
    const spentHoursRaw=importedFieldValue(row,mapping,"spentHours");
    const estimateRaw=importedFieldValue(row,mapping,"estimate");
    const priorityRaw=importedFieldValue(row,mapping,"monetizationLevel");
    const reason=importedFieldValue(row,mapping,"monetizationReason");

    if(status)task.status=status;
    if(title)task.title=title;
    if(spentHoursRaw)task.spentHours=spentHoursRaw.replace(",",".");
    if(estimateRaw)task.estimate=estimateRaw.replace(",",".");
    if(reason)task.monetizationReason=reason;

    const datePairs=[
      ["plannedStartDate",plannedStartRaw],
      ["plannedCloseDate",plannedCloseRaw],
      ["actualStartDate",actualStartRaw],
      ["actualCloseDate",actualCloseRaw]
    ];

    datePairs.forEach(([field,raw])=>{
      if(!raw)return;
      const normalized=normalizeImportedDate(raw);
      if(normalized===null){
        stats.invalidDates++;
        return;
      }
      task[field]=normalized;
    });

    if(priorityRaw){
      const normalizedPriority=normalizeImportedPriority(priorityRaw);
      if(normalizedPriority===null)stats.invalidPriorities++;
      else task.monetizationLevel=normalizedPriority;
    }
  }

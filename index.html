  function applyTaskUpdateRows(rows,mapping){
    const module=state[active];
    const stats={
      updated:0,
      added:0,
      skipped:0,
      featuresCreated:0,
      invalidDates:0,
      invalidPriorities:0,
      addedUnassigned:0
    };

    rows.forEach(row=>{
      const number=normalizeImportedTaskNumber(importedFieldValue(row,mapping,"number"));
      if(!number){
        stats.skipped++;
        return;
      }

      const rawFeatureName=importedFieldValue(row,mapping,"feature");
      const featureName=rawFeatureName||"Не распределено";

      const matches=findTaskMatchesByNumber(module,number);

      if(matches.length){
        if(rawFeatureName){
          const targetFi=ensureFeatureForTaskUpdate(module,rawFeatureName,stats);
          const canonical={...matches[0].task};
          canonical.number=number;
          applyNonEmptyTaskUpdate(canonical,row,mapping,stats);

          removeTaskNumberFromModule(module,number);
          module.features[targetFi].tasks.push(canonical);
        }else{
          matches.forEach(match=>{
            match.task.number=number;
            applyNonEmptyTaskUpdate(match.task,row,mapping,stats);
          });
        }
        stats.updated++;
        return;
      }

      // Номер задачи не найден: задача создаётся всегда.
      const targetFi=ensureFeatureForTaskUpdate(module,featureName,stats);
      const feature=module.features[targetFi];
      const featureMoney=featureMoneyValue(feature);

      const task={
        number,
        status:"В планах",
        title:`Задача #${number}`,
        plannedStartDate:"",
        plannedCloseDate:"",
        actualStartDate:"",
        actualCloseDate:"",
        spentHours:"",
        estimate:"",
        monetizationLevel:featureMoney.level||"Средний",
        monetizationReason:featureMoney.reason||""
      };

      applyNonEmptyTaskUpdate(task,row,mapping,stats);

      if(["в планах","планируется (нет задачи)","планируется","планирование","backlog"].includes(String(task.status||"").trim().toLowerCase())&&!task.plannedStartDate){
        task.plannedStartDate="2026-09-22";
      }

      feature.tasks.push(task);
      stats.added++;
      if(featureName==="Не распределено")stats.addedUnassigned++;
    });

    // После обновления показываем результат без старых фильтров,
    // чтобы новые задачи не выглядели как "не созданные".
    taskStageFilters.clear();
    topStageFilters.clear();
    topDirectionFilters.clear();
    topPriorityFilters.clear();
    topQuarterFilters.clear();
    focusedFeatureName=null;
    const search=$("searchInput");
    if(search)search.value="";

    save();
    render();

    openModal(`
      <div class="modal-header"><h4 class="modal-title">Обновление завершено</h4></div>
      <div class="modal-body">
        <div class="task-update-result">
          <div><strong>${stats.updated}</strong><span>обновлено</span></div>
          <div><strong>${stats.added}</strong><span>добавлено</span></div>
          <div><strong>${stats.skipped}</strong><span>пропущено</span></div>
          <div><strong>${stats.featuresCreated}</strong><span>создано функционалов</span></div>
        </div>

        ${stats.addedUnassigned?`
          <div class="task-update-warning">
            ${stats.addedUnassigned} новых задач не содержали функционал и добавлены в блок «Не распределено».
          </div>`:""}

        ${(stats.invalidDates||stats.invalidPriorities)?`
          <div class="task-update-warning">
            Не применено значений из-за неверного формата:
            ${stats.invalidDates?` даты — ${stats.invalidDates}`:""}
            ${stats.invalidDates&&stats.invalidPriorities?", ":""}
            ${stats.invalidPriorities?` приоритет — ${stats.invalidPriorities}`:""}.
          </div>`:""}

        <div class="task-update-help">
          Пустые значения из файла не изменяли существующие поля. Новые номера задач создаются независимо от заполненности функционала; при пустом функционале используются «Не распределено».
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-modal="cancel">Закрыть</button>
      </div>
    `);

    taskUpdateFileData=null;
  }

  function parseCsv(text){
    const rows=[]; let row=[]; let value=""; let inQuotes=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i], next=text[i+1];
      if(ch==='"'){
        if(inQuotes && next==='"'){value+='"';i++;}
        else inQuotes=!inQuotes;
      } else if(ch===';' && !inQuotes){
        row.push(value); value="";
      } else if((ch==='\n' || ch==='\r') && !inQuotes){
        if(ch==='\r' && next==='\n') i++;
        row.push(value); rows.push(row); row=[]; value="";
      } else {
        value+=ch;
      }
    }
    if(value!=="" || row.length){row.push(value); rows.push(row);}
    return rows.filter(r=>r.some(cell=>String(cell||"").trim()!==""));
  }

  function importStateFromCsv(text){
    text=text.replace(/^\ufeff/,"");
    const rows=parseCsv(text);
    if(rows.length<2) throw new Error("CSV пустой");
    const header=rows[0].map(x=>String(x||"").trim());
    const idx=name=>header.indexOf(name);
    const req=["Продукт","Пользователи","Выгодоприобретатели","Область применения","Функциональное описание","Выгоды применения","Конкуренты","УТП","Функционал","Зачем / какую боль закрывает","Перспектива монетизации","Номер задачи","Статус задачи","Доработка","Плановая дата закрытия","Фактическая дата начала","Фактическая дата закрытия","Приоритет монетизации доработки","Обоснование монетизации доработки"];
    if(req.some(x=>idx(x)===-1)) throw new Error("bad");
    const modules=[]; const byModule=new Map();
    rows.slice(1).forEach(r=>{
      const moduleName=String(r[idx("Продукт")]||"").trim();
      if(!moduleName) return;
      let module=byModule.get(moduleName);
      if(!module){
        module={
          name:moduleName,
          description:{
            users:String(r[idx("Пользователи")]||"").trim(),
            beneficiaries:String(r[idx("Выгодоприобретатели")]||"").trim(),
            area:String(r[idx("Область применения")]||"").trim(),
            functional:String(r[idx("Функциональное описание")]||"").trim(),
            benefits:String(r[idx("Выгоды применения")]||"").trim(),
            competitors:String(r[idx("Конкуренты")]||"").trim(),
            usp:String(r[idx("УТП")]||"").trim()
          },
          features:[]
        };
        module._featureMap=new Map();
        byModule.set(moduleName,module);
        modules.push(module);
      }
      const featureName=String(r[idx("Функционал")]||"").trim();
      if(!featureName) return;
      let feature=module._featureMap.get(featureName);
      if(!feature){
        feature={
          name:featureName,
          why:String(r[idx("Зачем / какую боль закрывает")]||"").trim(),
          monetization:String(r[idx("Перспектива монетизации")]||"").trim(),
          tasks:[]
        };
        module._featureMap.set(featureName,feature);
        module.features.push(feature);
      }
      const taskTitle=String(r[idx("Доработка")]||"").trim();
      const taskNumber=String(r[idx("Номер задачи")]||"").trim().replace(/^#/,"");
      const taskStatus=String(r[idx("Статус задачи")]||"").trim();
      if(taskTitle || taskNumber || taskStatus){
        feature.tasks.push({number:taskNumber,status:taskStatus || "Планируется",title:taskTitle,plannedStartDate:String(r[idx("Плановая дата начала")]||"").trim(),plannedCloseDate:String(r[idx("Плановая дата закрытия")]||"").trim(),actualStartDate:String(r[idx("Фактическая дата начала")]||"").trim(),actualCloseDate:String(r[idx("Фактическая дата закрытия")]||"").trim(),monetizationLevel:String(r[idx("Приоритет монетизации доработки")]||"").trim()||money(feature.monetization).level,monetizationReason:String(r[idx("Обоснование монетизации доработки")]||"").trim()||money(feature.monetization).reason});
      }
    });
    modules.forEach(m=>delete m._featureMap);
    return hydrateDescriptions(modules);
  }

  function positionActionsMenu(){
    const dropdown=document.querySelector(".actions-dropdown");
    const button=$("actionsToggle");
    const menu=$("actionsMenu");
    if(!dropdown?.classList.contains("open")||!button||!menu)return;

    if(window.matchMedia("(max-width:760px)").matches){
      menu.style.removeProperty("left");
      menu.style.removeProperty("right");
      menu.style.removeProperty("top");
      menu.style.removeProperty("bottom");
      menu.style.removeProperty("max-height");
      return;
    }

    const rect=button.getBoundingClientRect();
    const width=menu.offsetWidth||300;
    const left=Math.max(8,Math.min(rect.right-width,window.innerWidth-width-8));
    const top=Math.max(0,rect.bottom-1);

    menu.style.left=`${Math.round(left)}px`;
    menu.style.right="auto";
    menu.style.top=`${Math.round(top)}px`;
    menu.style.bottom="auto";
    menu.style.maxHeight=`${Math.max(160,Math.floor(window.innerHeight-top-8))}px`;
  }

    }catch(err){alert("Не удалось загрузить JSON. Используйте файл, выгруженный с этой страницы.");}
    e.target.value="";
  }

  $("taskUpdateCsv").onchange=async e=>{
    const file=e.target.files[0];
    if(!file)return;

    try{
      const rows=await readTaskUpdateRows(file);
      if(rows.length<2)throw new Error("В файле нет данных");
      taskUpdateMappingModal(file.name,rows);
    }catch(err){
      console.error(err);
      alert(err?.message||"Не удалось прочитать файл. Используйте XLSX, CSV или TXT с заголовками столбцов.");
    }finally{
      e.target.value="";
    }
  };

  $("importCsv").onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const text=await file.text();
      state=prioritizeModules(migrateState(importStateFromCsv(text)));active=0;save();render();
      alert("Данные из Excel (CSV) загружены.");
    }catch(err){alert("Не удалось загрузить CSV. Проверьте, что это файл, выгруженный с этой страницы.");}
    e.target.value="";
  }
try {
    window.addEventListener("resize",()=>requestAnimationFrame(renderRoadmapTodayLine));
  initAuth();
  } catch (err) {
    console.error(err);
    showAuth("Ошибка инициализации входа");
  }
})();
</script>
